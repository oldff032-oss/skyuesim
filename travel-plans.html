<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Пакети для подорожей — Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05060d">
<script src="pwa.js"></script>
<style>
  .catalog-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-top:20px}
  .catalog-filters{display:grid;grid-template-columns:minmax(180px,2fr) 1fr 1fr;gap:9px;margin-top:18px}
  .catalog-filters input,.catalog-filters select{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font:13px Inter,sans-serif}
  .catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:18px}
  .package-card{padding:17px;display:flex;flex-direction:column;min-height:230px}
  .package-location{font-size:11px;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .package-name{font:700 16px 'Space Grotesk',sans-serif;margin-top:7px;line-height:1.25}
  .package-facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .package-fact{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--text-muted)}
  .package-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:17px}
  .package-price{font:700 19px 'Space Mono',monospace;color:var(--success)}
  .package-buy{width:auto;padding:10px 14px;font-size:12px}
  .catalog-note{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-top:12px}
  @media(max-width:820px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){.catalog-filters,.catalog-grid{grid-template-columns:1fr}.package-card{min-height:0}}
</style>
</head>
<body class="has-bottomnav">
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Signal</span></div>
    <div class="catalog-head">
      <div><h1>Пакети для подорожей</h1><p class="lead">Актуальні країни й регіони безпосередньо з каталогу eSIM Access.</p></div>
      <a href="plans.html" class="btn secondary" style="width:auto;padding:11px 16px;text-decoration:none">Місячні тарифи</a>
    </div>

    <div class="catalog-filters">
      <input id="search" type="search" placeholder="Країна, регіон або назва…" oninput="scheduleLoad()">
      <select id="data" onchange="loadPackages()"><option value="all">Будь-який обсяг</option><option value="small">До 3 ГБ</option><option value="medium">4–10 ГБ</option><option value="large">Понад 10 ГБ</option></select>
      <select id="duration" onchange="loadPackages()"><option value="all">Будь-який термін</option><option value="short">До 7 днів</option><option value="month">8–30 днів</option><option value="long">Понад 30 днів</option></select>
    </div>
    <p class="catalog-note">Ціна остаточна у USD. Пакет не поновлюється автоматично. Для акаунта з уже активною eSIM додатковий пакет безпечно оформить підтримка.</p>
    <div id="loading" class="shimmer" style="height:180px;margin-top:18px"></div>
    <div id="error" class="err-text" style="display:none;margin-top:18px"></div>
    <div id="count" class="muted" style="display:none;margin-top:18px;font-size:12px"></div>
    <div id="catalog" class="catalog-grid"></div>
  </div>

  <nav class="bottomnav">
    <a href="dashboard.html"><span class="ic">🏠</span>Головна</a>
    <a href="plans.html" class="active"><span class="ic">📶</span>Тариф</a>
    <a href="usage.html"><span class="ic">📊</span>Витрати</a>
    <a href="profile.html"><span class="ic">👤</span>Профіль</a>
  </nav>
  <script src="config.js"></script>
  <script>
    const sessionToken=localStorage.getItem('signal_session_token');
    if(!sessionToken) location.href='login.html';
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let timer=null,packagesByCode=new Map();
    function scheduleLoad(){clearTimeout(timer);timer=setTimeout(loadPackages,300)}
    function dataLabel(item){return item.unlimited?'Безліміт':item.dataLimitGb==null?'Обсяг за умовами':`${Number(item.dataLimitGb).toLocaleString('uk-UA')} ГБ`}
    function renderPackage(item){
      const coverage=item.networks?.length?`${item.networks.length} країн/зон`:item.location;
      return `<article class="glass package-card"><div class="package-location">${escapeHtml(item.location)}</div><div class="package-name">${escapeHtml(item.name)}</div><div class="package-facts"><span class="package-fact">${escapeHtml(dataLabel(item))}</span><span class="package-fact">${item.durationDays} днів</span><span class="package-fact">${escapeHtml(item.speed||'4G/5G')}</span></div><p class="muted" style="font-size:11.5px;line-height:1.45;margin-top:11px">Покриття: ${escapeHtml(coverage)}</p><div class="package-bottom"><div class="package-price">$${(item.amountCents/100).toFixed(2)}</div><button class="btn package-buy" onclick="buy('${escapeHtml(item.packageCode)}',this)">Купити</button></div></article>`;
    }
    async function loadPackages(){
      const loading=document.getElementById('loading'),error=document.getElementById('error'),catalog=document.getElementById('catalog'),count=document.getElementById('count');
      loading.style.display='block';error.style.display='none';catalog.innerHTML='';count.style.display='none';
      try{
        const params=new URLSearchParams({q:document.getElementById('search').value.trim(),data:document.getElementById('data').value,duration:document.getElementById('duration').value});
        const response=await fetch(`${API_URL}/api/travel-packages?${params}`,{headers:{'x-session-token':sessionToken}});
        const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Помилка каталогу');
        packagesByCode=new Map(payload.packages.map(item=>[item.packageCode,item]));
        catalog.innerHTML=payload.packages.map(renderPackage).join('');
        count.textContent=`Знайдено пакетів: ${payload.packages.length}`;count.style.display='block';
        if(!payload.packages.length)catalog.innerHTML='<div class="card"><p class="muted">За цими фільтрами пакетів немає.</p></div>';
      }catch(err){error.textContent=err.message;error.style.display='flex'}finally{loading.style.display='none'}
    }
    async function buy(code,button){
      const item=packagesByCode.get(code);if(!item)return;
      if(!confirm(`Оформити ${item.name} за $${(item.amountCents/100).toFixed(2)}?`))return;
      button.disabled=true;button.textContent='Зачекай…';
      try{
        const response=await fetch(`${API_URL}/api/travel-packages/checkout`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':sessionToken},body:JSON.stringify({packageCode:code})});
        const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Не вдалося створити оплату');location.href=payload.url;
      }catch(err){alert(err.message);button.disabled=false;button.textContent='Купити'}
    }
    loadPackages();
  </script>
</body>
</html>
