<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статус замовлення — Signal</title><link rel="stylesheet" href="style.css"><script src="pwa.js"></script><style>.step{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--glass-border)}.step:last-child{border:0}.dotx{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass)}.complete .dotx{background:var(--success);color:#04130a}.active .dotx{background:var(--blue)}.failed .dotx{background:var(--danger)}</style></head><body><main class="wrap" style="max-width:560px"><div class="brand"><div class="mark">S</div><span>Signal</span></div><h1 style="margin-top:24px">Статус замовлення</h1><p class="lead">Сторінка оновлюється автоматично. Повторно оплачувати не потрібно.</p><section id="steps" class="glass" style="padding:18px;margin-top:20px"><div class="shimmer" style="height:180px"></div></section><div id="actions" style="margin-top:14px"></div></main><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;
async function load(){try{const response=await fetch(`${API_URL}/api/account/order-status`,{headers:{'x-session-token':token}}),data=await response.json();if(!response.ok)throw new Error(data.error);steps.innerHTML=data.steps.map(step=>`<div class="step ${esc(step.status)}"><span class="dotx">${step.status==='complete'?'✓':step.status==='failed'?'!':'•'}</span><div><b>${esc(step.label)}</b><div class="muted">${step.status==='complete'?'Готово':step.status==='active'?'Виконується…':step.status==='failed'?'Потрібна допомога':'Очікує'}</div></div></div>`).join('');const ready=data.steps.find(s=>s.key==='ready')?.status==='complete',failed=data.steps.some(s=>s.status==='failed');actions.innerHTML=ready?'<a class="btn" href="esim-management.html">Відкрити «Моя eSIM»</a>':failed?'<a class="btn" href="new-ticket.html">Звернутися в підтримку</a>':'<a class="btn ghost" href="dashboard.html">Повернутися на головну</a>';if(ready||failed)clearInterval(timer);}catch(error){steps.innerHTML=`<p class="err-text">${esc(error.message)}</p>`}}load();timer=setInterval(load,5000);
</script></body></html>
