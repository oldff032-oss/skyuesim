<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Історія активності — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script><style>.filters{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.filter{white-space:nowrap;border:1px solid var(--xp-line);border-radius:99px;padding:9px 12px;background:#ffffff07;color:#93a3c4;font-size:10px}.filter.active{background:#315da955;color:#b9f7ff;border-color:#63ddff55}</style></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="profile.html" aria-label="Назад">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Історія активності</b></header><section class="xp-hero"><div class="xp-kicker">ПРОЗОРА ХРОНОЛОГІЯ</div><h1 class="xp-title">Усе, що відбулося</h1><p class="xp-lead">Покупки, підготовка eSIM, Points, сімейні дії та підтримка — без секретних даних.</p></section><div class="filters" style="margin-top:20px"><button class="filter active" data-filter="all">Усе</button><button class="filter" data-filter="purchase">Покупки</button><button class="filter" data-filter="points">Points</button><button class="filter" data-filter="support">Підтримка</button><button class="filter" data-filter="family">Сім’я</button></div><div id="timeline" class="xp-timeline" style="margin-top:13px"><div class="xp-skeleton"></div></div></main><script src="config.js"></script><script src="experience.js"></script><script>
document.body.insertAdjacentHTML('beforeend',xpNav('profile'));let items=[];const mark={purchase:'$',points:'✦',support:'?',family:'F',trip:'✈'};function render(filter='all'){const visible=filter==='all'?items:items.filter(item=>item.type===filter);timeline.innerHTML=visible.length?visible.map(item=>`<a class="xp-timeline-item" href="${xpEsc(item.url||'#')}"><span class="xp-timeline-dot">${xpEsc(mark[item.type]||'S')}</span><span class="xp-notification-copy"><b>${xpEsc(item.title)}</b><p>${xpEsc(item.detail||'')}</p><time>${xpEsc(xpDate(item.date))} · ${xpEsc(item.status||'')}</time></span></a>`).join(''):`<div class="xp-empty xp-panel"><i>◌</i><b>Тут поки порожньо</b><p class="xp-muted">Нові події з’являться автоматично.</p></div>`}document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));button.classList.add('active');render(button.dataset.filter)});xpFetch('/api/account/activity').then(data=>{items=data.items||[];render()}).catch(error=>timeline.innerHTML=`<div class="xp-note">${xpEsc(error.message)}</div>`);
</script></body></html>
