<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Signal Club</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="signal-universe.html">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Signal Club</b></header><section class="xp-hero"><div class="xp-kicker">винагороди за подорожі</div><div id="tierRing" class="xp-ring" style="--value:0"><span><strong id="points">—</strong><small>Points</small></span></div><h1 id="tier" class="xp-title" style="text-align:center">Завантажуємо…</h1><p id="next" class="xp-lead" style="text-align:center">Рівень зростає разом із твоїми подорожами.</p></section><section class="xp-section"><h2>Винагороди</h2><div id="rewards" class="xp-list"><div class="xp-skeleton"></div></div></section><section class="xp-section"><h2>Останні нарахування</h2><div id="ledger" class="xp-panel"></div></section></main><script src="config.js"></script><script src="experience.js"></script><script>document.body.insertAdjacentHTML('beforeend',xpNav());let club;async function load(){club=await xpFetch('/api/account/club');points.textContent=club.points;tier.textContent=club.tier.name;tierRing.style.setProperty('--value',club.tier.progress||100);next.textContent=club.tier.next?`Ще ${Math.max(0,club.tier.next-club.lifetimePoints)} points до наступного рівня.`:'Ти на найвищій орбіті Signal.';rewards.innerHTML=club.rewardsCatalog.map(item=>`<div class="xp-card wide"><span class="xp-card-icon">${item.kind==='data_bonus'?'⚡':'✦'}</span><b>${xpEsc(item.name)}</b><p>${item.points} Points · код діє 180 днів</p><button class="xp-btn secondary" data-reward="${xpEsc(item.id)}" ${club.points<item.points?'disabled':''}>${club.points<item.points?'Ще не вистачає':'Отримати'}</button></div>`).join('');ledger.innerHTML=club.ledger.length?club.ledger.slice(0,8).map(item=>`<div class="xp-row"><span><b>${xpEsc(item.reason)}</b><small class="xp-muted" style="display:block">${xpDate(item.createdAt)}</small></span><strong style="color:${item.points>0?'#63edc8':'#ff9aac'}">${item.points>0?'+':''}${item.points}</strong></div>`).join(''):`<div class="xp-empty"><i>✦</i><b>Нарахувань ще немає</b><p class="xp-muted">Points з’являться після успішної видачі eSIM.</p></div>`;document.querySelectorAll('[data-reward]').forEach(button=>button.onclick=()=>redeem(button.dataset.reward,button));}async function redeem(id,button){if(!confirm('Обміняти Signal Points на цю винагороду?'))return;button.disabled=true;try{const result=await xpFetch('/api/account/club/redeem',{method:'POST',body:JSON.stringify({rewardId:id})});xpToast(`Готово: ${result.reward.code}`);await load()}catch(e){xpToast(e.message);button.disabled=false}}load().catch(e=>rewards.innerHTML=`<div class="xp-note">${xpEsc(e.message)}</div>`);</script></body></html>
