<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Підтримка — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#05060d"><style>
.hero{padding:20px;border-radius:22px;background:linear-gradient(145deg,#121d39,#0a0e1c);border:1px solid #6680ff33;margin-top:18px}.hero-top{display:flex;align-items:center;gap:14px}.hero-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#5376ff22;font-size:24px}.hero h1{font-size:23px}.hero p{margin-top:5px;color:var(--text-muted);font-size:13px;line-height:1.55}.tickets{margin-top:16px;overflow:hidden}.ticket-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;cursor:pointer;text-decoration:none;color:inherit}.ticket-row:not(:last-child){border-bottom:1px solid var(--glass-border)}.ticket-subject{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticket-meta{font-size:11.5px;color:var(--text-muted);margin-top:5px}.status-chip{font-size:9.5px;font-weight:800;padding:5px 8px;border-radius:8px;text-transform:uppercase;white-space:nowrap}.open{background:#3b82f622;color:#69a7ff}.in_progress{background:#8b5cf622;color:#af8cff}.waiting_customer{background:#f5a62322;color:#f5bd5e}.resolved,.closed{background:#34e4b822;color:#50dcb7}.empty{padding:30px 20px;text-align:center}.empty strong{display:block;margin-bottom:7px}@media(max-width:380px){.ticket-row{grid-template-columns:1fr}.status-chip{justify-self:start}.hero{padding:17px}}
</style></head><body class="has-bottomnav"><div class="wrap"><div class="brand"><div class="mark">S</div><span>Signal</span></div><section class="hero"><div class="hero-top"><div class="hero-icon">💬</div><div><h1>Центр підтримки</h1><p>Ми допоможемо з eSIM, оплатою або тарифом.</p></div></div><a class="btn" href="new-ticket.html" style="margin-top:18px">+ Створити звернення</a></section><div id="loading" class="shimmer" style="height:130px;margin-top:16px"></div><div id="list" class="glass tickets" style="display:none"></div><div id="empty" class="glass empty" style="display:none;margin-top:16px"><strong>Звернень поки немає</strong><span class="muted">Створіть нове звернення — воно одразу з’явиться тут.</span></div></div><nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" aria-label="Головна" title="Головна" data-nav="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="home-roof" d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><rect class="home-window" x="9.7" y="13" width="4.6" height="7" rx="1" fill="currentColor" stroke="none"/><circle class="home-spark" cx="19" cy="5" r="1.25" fill="currentColor" stroke="none"/></svg></span></a><a href="plans.html" aria-label="Тарифи" title="Тарифи" data-nav="plans"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect class="plan-back" x="5.5" y="3" width="15" height="14" rx="2.5"/><rect class="plan-front" x="3" y="6.5" width="16" height="14" rx="2.5"/><path class="plan-scan" d="M3.8 11h14.4"/><path d="M7 16h5"/></svg></span></a><a href="usage.html" aria-label="Витрати" title="Витрати" data-nav="usage"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="usage-bar bar-one" d="M5 19V13"/><path class="usage-bar bar-two" d="M12 19V7"/><path class="usage-bar bar-three" d="M19 19V10"/><path d="M3 21h18"/><circle class="usage-pulse" cx="19" cy="7.5" r="1.45" fill="currentColor" stroke="none"/></svg></span></a><a href="profile.html" aria-label="Профіль" title="Профіль" data-nav="profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle class="profile-head" cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/><path class="profile-orbit" d="M5.5 8c1.8-5.6 11.2-7.2 15-1.6" stroke-dasharray="2 3"/><circle class="profile-star" cx="20.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg></span></a></nav><script src="config.js"></script><script src="pwa.js"></script><script>
if(new URLSearchParams(location.search).get('maintenance')==='1')location.replace('/maintenance-support.html');const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={open:'Відкрито',in_progress:'У роботі',waiting_customer:'Очікує вас',resolved:'Вирішено',closed:'Закрито'};async function load(){const loading=document.getElementById('loading'),list=document.getElementById('list'),empty=document.getElementById('empty');try{const response=await fetch(`${API_URL}/api/support/tickets`,{headers:{'x-session-token':token}}),tickets=await response.json();if(!response.ok)throw new Error(tickets.error||'Помилка завантаження');loading.style.display='none';if(!tickets.length){empty.style.display='block';return}list.style.display='block';list.innerHTML=tickets.map(t=>`<a class="ticket-row" href="ticket.html?id=${encodeURIComponent(t.id)}"><div><div class="ticket-subject">#${esc(t.id)} · ${esc(t.subject)}</div><div class="ticket-meta">${esc(t.category)} · ${new Date(t.updatedAt).toLocaleString('uk-UA')}</div></div><span class="status-chip ${esc(t.status)}">${esc(labels[t.status]||t.status)}</span></a>`).join('')}catch(error){loading.style.display='none';empty.style.display='block';empty.innerHTML=`<strong>Не вдалося завантажити звернення</strong><span class="muted">${esc(error.message)}</span>`}}load();
</script></body></html>
