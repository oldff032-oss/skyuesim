<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Підтримка — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .ticket-row{ display:flex; justify-content:space-between; align-items:center; padding:15px 18px; cursor:pointer; }
  .ticket-row:not(:last-child){ border-bottom:1px solid var(--glass-border); }
  .ticket-subject{ font-size:14px; font-weight:600; }
  .ticket-meta{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .status-chip{ font-size:10px; font-weight:700; padding:4px 9px; border-radius:7px; text-transform:uppercase; letter-spacing:.03em; }
  .status-chip.open{ background:rgba(59,130,246,0.15); color:var(--blue); }
  .status-chip.in_progress{ background:rgba(139,92,246,0.15); color:var(--violet); }
  .status-chip.waiting_customer{ background:rgba(245,166,35,0.15); color:#f5a623; }
  .status-chip.resolved, .status-chip.closed{ background:rgba(52,228,184,0.15); color:var(--success); }
</style>
</head>
<body class="has-bottomnav">
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Сигнал</span></div>
    <h1 style="margin-top:20px;">Підтримка</h1>
    <p class="lead">Твої звернення й нові запити</p>

    <a class="btn" href="new-ticket.html" style="margin-top:16px;">+ Нове звернення</a>

    <div id="loading" class="shimmer" style="height:120px; margin-top:20px;"></div>
    <div id="list" class="glass" style="margin-top:20px; display:none; overflow:hidden;"></div>
    <div id="empty" class="card" style="display:none; margin-top:20px;"><p class="muted">Звернень ще немає.</p></div>
  </div>

  <nav class="bottomnav">
    <a href="dashboard.html"><span class="ic">🏠</span>Головна</a>
    <a href="plans.html"><span class="ic">📶</span>Тариф</a>
    <a href="usage.html"><span class="ic">📊</span>Витрати</a>
    <a href="profile.html"><span class="ic">👤</span>Профіль</a>
  </nav>

  <script src="config.js"></script>
  <script>
    const email = localStorage.getItem('signal_email');
    if(!email){ window.location.href = 'login.html'; }

    const statusLabels = { open:'Відкритий', in_progress:'В роботі', waiting_customer:'Очікує вас', resolved:'Вирішено', closed:'Закрито' };

    async function load(){
      const loading = document.getElementById('loading');
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      try{
        const res = await fetch(`${API_URL}/api/support/tickets?email=${encodeURIComponent(email)}`);
        const tickets = await res.json();
        loading.style.display = 'none';

        if(!tickets.length){ empty.style.display = 'block'; return; }

        list.style.display = 'block';
        list.innerHTML = tickets.map(t => `
          <div class="ticket-row" onclick="window.location.href='ticket.html?id=${t.id}'">
            <div>
              <div class="ticket-subject">#${t.id} · ${t.subject}</div>
              <div class="ticket-meta">${t.category} · ${new Date(t.updatedAt).toLocaleDateString('uk-UA')}</div>
            </div>
            <span class="status-chip ${t.status}">${statusLabels[t.status] || t.status}</span>
          </div>`).join('');
      }catch(e){
        loading.style.display = 'none';
        empty.style.display = 'block';
        document.querySelector('#empty p').textContent = 'Не вдалося завантажити звернення';
      }
    }
    load();
  </script>
</body>
</html>
