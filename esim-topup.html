<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Продовження пакета — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="signal-v5.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#020713"><script src="pwa.js"></script></head><body class="signal-v5 client-v5 topup-v5"><main class="o-shell"><div class="o-brand"><img src="signal-premium-logo.png" alt=""><span><strong>Signal</strong><small>eSIM для подорожей</small></span></div><div class="topup-hero" aria-hidden="true"></div><section class="topup-copy"><a href="dashboard.html" class="o-link">‹ Назад</a><h1 style="margin:18px 0 8px;font:700 34px 'Space Grotesk'">Продовження пакета</h1><p style="color:#b1c0dc;line-height:1.5">Залишайтеся на зв’язку в будь-якій точці світу. Пакет додається до поточної eSIM — новий QR-код не потрібний.</p><div id="current" class="o-card" style="margin-top:16px;color:#a8bbda"></div></section><div id="loading" class="shimmer" style="height:170px;margin-top:18px"></div><div id="error" class="o-card" style="display:none;margin-top:18px"></div><div id="catalog" class="topup-grid"></div><a class="o-card" href="support.html" style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;color:#fff;text-decoration:none"><span>ⓘ　Потрібна допомога?</span><b>›</b></a></main><nav class="o-bottomnav"><a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5M5.5 9.3V21h13V9.3M9.5 21v-6h5v6"/></svg><span>Головна</span></a><a class="active" href="plans.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/></svg><span>Пакети</span></a><a href="usage.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-8M22 20V3M2 20h21"/></svg><span>Витрати</span></a><a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c.4-4.6 2.8-7 7-7s6.6 2.4 7 7"/></svg><span>Профіль</span></a></nav><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const headers={'Content-Type':'application/json','x-session-token':token},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(item){const data=item.unlimited?'∞':item.dataLimitGb==null?'Пакет':`${item.dataLimitGb.toLocaleString('uk-UA')} ГБ`;return `<article class="o-card pack"><span style="float:right;padding:6px 9px;border-radius:99px;background:#156df1;font-size:10px">Сумісний</span><h2>${esc(item.name)}</h2><div class="data">◎　${esc(data)}</div><p>${item.durationDays?`${item.durationDays} днів · `:''}${esc(item.description||'Для вашої активної eSIM')}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px"><b class="price">$${(item.amountCents/100).toFixed(2)}</b><button class="o-btn" style="width:auto;min-height:44px;padding:0 18px" data-code="${esc(item.packageCode)}">Продовжити</button></div></article>`}async function load(){try{const res=await fetch(`${API_URL}/api/account/esim/topups`,{headers}),data=await res.json();if(!res.ok)throw Error(data.error);current.textContent=`Поточна eSIM •••• ${data.iccidEnding}${data.current.remainingGb!=null?` · залишилось ${Number(data.current.remainingGb).toLocaleString('uk-UA',{maximumFractionDigits:2})} ГБ`:''}`;catalog.innerHTML=data.packages.length?data.packages.map(card).join(''):'<div class="o-card"><h2>Сумісних поповнень поки немає</h2><p style="color:#91a5ca">Провайдер не запропонував додаткові пакети. Можна придбати новий туристичний пакет.</p><a class="o-btn" href="travel-plans.html">Обрати новий пакет</a></div>';catalog.querySelectorAll('button[data-code]').forEach(button=>button.onclick=()=>checkout(button))}catch(e){error.style.display='block';error.innerHTML=`<h2>Поповнення недоступне</h2><p>${esc(e.message)}</p>`}finally{loading.style.display='none'}}async function checkout(button){if(!confirm('Перейти на захищену сторінку оплати Stripe?'))return;const label=button.textContent;button.disabled=true;button.textContent='Готуємо…';try{const res=await fetch(`${API_URL}/api/account/esim/topups/checkout`,{method:'POST',headers,body:JSON.stringify({packageCode:button.dataset.code})}),data=await res.json();if(!res.ok)throw Error(data.error);location.href=data.url}catch(e){alert(e.message);button.disabled=false;button.textContent=label}}load();
</script></body></html>
