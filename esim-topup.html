<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Продовження пакета — Signal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="signal-v5.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020713">
  <script src="pwa.js"></script>
</head>
<body class="signal-v5 client-v5 topup-v5">
  <main class="o-shell">
    <section class="topup-head">
      <header class="screen-title"><a href="dashboard.html" aria-label="Назад">‹</a><h1>Продовження пакета</h1><i></i></header>
      <p>Залишайтеся на зв’язку в будь-якій точці світу — новий QR-код не потрібний</p>
    </section>
    <p id="current" class="current-esim">Перевіряємо поточну eSIM…</p>
    <div id="loading" class="shimmer" style="height:330px"></div>
    <div id="error" class="o-card" style="display:none"></div>
    <section id="recommended" class="recommend-card" hidden></section>
    <section id="other" class="other-packs"></section>
    <a class="o-card topup-help" href="support.html"><span>ⓘ　Потрібна допомога?</span><b>›</b></a>
  </main>
  <nav class="o-bottomnav">
    <a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5M5.5 9.3V21h13V9.3M9.5 21v-6h5v6"/></svg><span>Головна</span></a>
    <a class="active" href="plans.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/></svg><span>Пакети</span></a>
    <a href="usage.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-8M22 20V3M2 20h21"/></svg><span>Витрати</span></a>
    <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c.4-4.6 2.8-7 7-7s6.6 2.4 7 7"/></svg><span>Профіль</span></a>
  </nav>
  <script src="config.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';
    const headers={'Content-Type':'application/json','x-session-token':token};
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const dataLabel=item=>item.unlimited?'∞':item.dataLimitGb==null?'Пакет':`${Number(item.dataLimitGb).toLocaleString('uk-UA')} ГБ`;
    function recommendedCard(item){return `<h2>Рекомендований пакет</h2><article class="pack-feature"><div class="pack-row"><span class="pack-globe">◎</span><span><strong>${esc(dataLabel(item))}</strong><small>${item.durationDays?`${item.durationDays} днів`:'Для поточної eSIM'}</small></span><em class="best-chip">Найкращий вибір</em></div></article><div class="benefits"><span>Вигідне співвідношення ціни</span><span>Працює в тій самій країні / регіоні</span><span>Миттєве підключення</span></div><button class="o-btn continue-btn" type="button" data-code="${esc(item.packageCode)}">Продовжити без нового QR</button><p class="pack-note">ⓘ Пакет буде додано до вашої поточної eSIM · $${(item.amountCents/100).toFixed(2)}</p>`}
    function otherCard(item){return `<article class="o-card"><div style="display:flex;align-items:center;gap:12px"><span class="pack-globe">◎</span><span style="flex:1"><b>${esc(item.name)}</b><small style="display:block;margin-top:4px;color:#91a5ca">${esc(dataLabel(item))}${item.durationDays?` · ${item.durationDays} днів`:''}</small></span><button class="o-btn" type="button" style="width:auto;min-height:42px;padding:0 13px;font-size:12px" data-code="${esc(item.packageCode)}">Обрати</button></div></article>`}
    async function load(){try{const response=await fetch(`${API_URL}/api/account/esim/topups`,{headers,cache:'no-store'}),data=await response.json();if(!response.ok)throw Error(data.error||'Поповнення недоступне');current.textContent=`Поточна eSIM •••• ${data.iccidEnding}${data.current.remainingGb!=null?` · залишилось ${Number(data.current.remainingGb).toLocaleString('uk-UA',{maximumFractionDigits:2})} ГБ`:''}`;if(!data.packages?.length){recommended.hidden=false;recommended.innerHTML='<h2>Сумісних поповнень поки немає</h2><p style="color:#91a5ca;line-height:1.5">Провайдер не запропонував пакет для цієї eSIM.</p><a class="o-btn" href="travel-plans.html">Обрати новий пакет</a>';return}recommended.hidden=false;recommended.innerHTML=recommendedCard(data.packages[0]);if(data.packages.length>1)other.innerHTML=`<h2 style="font-size:16px;margin:4px 0">Інші сумісні пакети</h2>${data.packages.slice(1).map(otherCard).join('')}`;document.querySelectorAll('button[data-code]').forEach(button=>button.onclick=()=>checkout(button))}catch(errorValue){error.style.display='block';error.innerHTML=`<h2>Поповнення недоступне</h2><p>${esc(errorValue.message)}</p>`}finally{loading.style.display='none'}}
    async function checkout(button){if(!confirm('Додати цей пакет до поточної eSIM без нового QR-коду?'))return;const label=button.textContent;button.disabled=true;button.textContent='Готуємо…';try{const response=await fetch(`${API_URL}/api/account/esim/topups/checkout`,{method:'POST',headers,body:JSON.stringify({packageCode:button.dataset.code})}),data=await response.json();if(!response.ok)throw Error(data.error||'Не вдалося створити оплату');location.href=data.url}catch(errorValue){alert(errorValue.message);button.disabled=false;button.textContent=label}}
    load();
  </script>
</body>
</html>
