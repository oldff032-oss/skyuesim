<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Додати інтернет — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><script src="pwa.js"></script><style>
.topup-head{padding:22px;border-radius:26px;background:linear-gradient(145deg,rgba(21,85,133,.52),rgba(70,35,133,.48));border:1px solid rgba(80,224,255,.3)}.topup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px}.pack{padding:17px;border-radius:20px}.pack h2{font-size:17px}.pack .data{font:700 29px 'Space Grotesk',sans-serif;margin:12px 0 4px;color:#7eeaff}.pack .price{font-weight:700;font-size:17px}.pack p{font-size:11px;line-height:1.45;color:var(--text-muted)}@media(max-width:520px){.topup-grid{grid-template-columns:1fr}}
</style></head><body class="has-bottomnav"><main class="wrap"><div class="brand"><div class="mark">＋</div><span>Signal</span></div><section class="topup-head" style="margin-top:20px"><h1>Додати інтернет</h1><p class="lead">Пакет додається до вже встановленої eSIM. Новий QR-код не потрібний.</p><div id="current" class="muted" style="margin-top:13px"></div></section><div id="loading" class="shimmer" style="height:150px;margin-top:16px"></div><div id="error" class="glass glass-card" style="display:none;margin-top:16px"></div><div id="catalog" class="topup-grid"></div><a class="btn ghost" href="travel-plans.html" style="margin-top:17px">Переглянути інші пакети</a></main><nav class="bottomnav"><a href="dashboard.html"><span class="nav-icon"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html"><span class="nav-icon"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html"><span class="nav-icon"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html"><span class="nav-icon"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const headers={'Content-Type':'application/json','x-session-token':token};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=document.getElementById('current'),loading=document.getElementById('loading'),errorBox=document.getElementById('error'),catalog=document.getElementById('catalog');
function card(item){const data=item.unlimited?'∞':item.dataLimitGb==null?'Пакет':`${item.dataLimitGb.toLocaleString('uk-UA')} GB`;return `<article class="glass pack"><h2>${esc(item.name)}</h2><div class="data">${esc(data)}</div><p>${item.durationDays?`${item.durationDays} днів · `:''}${esc(item.description||'Сумісний із вашою активною eSIM')}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px"><span class="price">$${(item.amountCents/100).toFixed(2)}</span><button class="btn" style="width:auto;padding:10px 15px" data-code="${esc(item.packageCode)}">Додати</button></div></article>`}
async function load(){try{const res=await fetch(`${API_URL}/api/account/esim/topups`,{headers}),data=await res.json();if(!res.ok)throw Error(data.error);current.textContent=`eSIM •••• ${data.iccidEnding}${data.current.remainingGb!=null?` · залишилося ${Number(data.current.remainingGb).toLocaleString('uk-UA',{maximumFractionDigits:2})} GB`:''}`;catalog.innerHTML=data.packages.length?data.packages.map(card).join(''):'<div class="glass glass-card"><h2 style="font-size:17px">Сумісних поповнень поки немає</h2><p class="muted" style="margin-top:7px">Провайдер не запропонував додаткові пакети для цієї eSIM. Можна придбати новий туристичний пакет.</p></div>';catalog.querySelectorAll('button[data-code]').forEach(button=>button.onclick=()=>checkout(button));}catch(e){errorBox.style.display='block';errorBox.innerHTML=`<h2 style="font-size:17px">Поповнення недоступне</h2><p class="muted" style="margin-top:7px">${esc(e.message)}</p>`}finally{loading.style.display='none'}}
async function checkout(button){if(!confirm('Перейти на захищену сторінку оплати Stripe?'))return;const label=button.textContent;button.disabled=true;button.textContent='Готуємо…';try{const res=await fetch(`${API_URL}/api/account/esim/topups/checkout`,{method:'POST',headers,body:JSON.stringify({packageCode:button.dataset.code})}),data=await res.json();if(!res.ok)throw Error(data.error);location.href=data.url}catch(e){alert(e.message);button.disabled=false;button.textContent=label}}load();
</script></body></html>
