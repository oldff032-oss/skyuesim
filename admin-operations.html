<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Операційний центр</title><link rel="stylesheet" href="style.css"><style>.box{padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}textarea,select,input{width:100%;margin-top:8px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:10px}textarea{min-height:88px}.item{padding:10px 0;border-top:1px solid var(--glass-border);font-size:13px}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">🛡️</div><span>Signal Admin</span></div><nav class="admin-nav"><a href="admin-dashboard.html">📊 Dashboard</a><a href="admin-users.html">👥 Користувачі</a><a href="admin-tickets.html">🎫 Підтримка</a><a class="active" href="admin-operations.html">⚙️ Операції</a><a href="#" onclick="logout()">⏏ Вийти</a></nav></aside><main class="admin-main"><h1>Операційний центр</h1><p class="lead">Оголошення, захист та стан сервісу.</p><div id="system" class="glass box"></div><div class="grid"><section class="glass box"><h3>Нове оголошення</h3><input id="title" placeholder="Заголовок"><textarea id="message" placeholder="Текст повідомлення"></textarea><select id="audience"><option value="all">Усі користувачі</option></select><label class="muted" style="display:block;margin-top:10px">Зникне після <input id="expires" type="datetime-local"></label><button class="btn" style="margin-top:12px" onclick="announce()">Опублікувати</button></section><section class="glass box"><h3>Чорний список</h3><select id="blackType"><option value="emails">Email</option><option value="iccids">ICCID</option></select><input id="blackValue" placeholder="Значення"><button class="btn ghost" style="margin-top:12px" onclick="blacklist()">Додати</button><div id="blacklist"></div></section></div><section class="glass box"><h3>Активні оголошення</h3><div id="announcements"></div></section></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>requireAdminAuth();let state={};const esc=v=>String(v||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const [o,s]=await Promise.all([adminFetch('/api/admin/operations'),adminFetch('/api/admin/system-status')]);state=await o.json();const sys=await s.json();document.getElementById('system').innerHTML=`<b>Стан системи</b><p class="muted" style="margin-top:8px">Сервер: ${sys.server} · База: ${sys.database?'✓':'✕'} · Push: ${sys.push?'✓':'✕'} · Stripe: ${sys.stripe?'✓':'✕'} · eSIM: ${sys.esimProvider?'✓':'✕'}</p>`;document.getElementById('announcements').innerHTML=state.announcements.map(a=>`<div class="item"><b>${esc(a.title)}</b><br>${esc(a.message)}<br><span class="muted">до ${a.expiresAt?new Date(a.expiresAt).toLocaleString('uk-UA'):'вимкнення вручну'}</span><button class="btn ghost" style="width:auto;float:right;padding:6px 9px;font-size:11px" onclick="del('${a.id}')">Видалити</button></div>`).join('')||'<p class="muted">Немає активних записів</p>';document.getElementById('blacklist').innerHTML=['emails','iccids'].map(t=>state.blacklist[t].map(v=>`<div class="item">${esc(v)} <button class="btn ghost" style="float:right;width:auto;padding:5px" onclick="unblack('${t}','${encodeURIComponent(v)}')">×</button></div>`).join('')).join('');}async function announce(){const title=document.getElementById('title').value,message=document.getElementById('message').value,expiresAt=document.getElementById('expires').value;const r=await adminFetch('/api/admin/announcements',{method:'POST',body:JSON.stringify({title,message,expiresAt:expiresAt||null})});if(!r.ok)return alert((await r.json()).error);load();}async function del(id){await adminFetch('/api/admin/announcements/'+id,{method:'DELETE'});load()}async function blacklist(){const type=document.getElementById('blackType').value,value=document.getElementById('blackValue').value.trim();const r=await adminFetch('/api/admin/blacklist',{method:'POST',body:JSON.stringify({type,value})});if(!r.ok)return alert((await r.json()).error);load()}async function unblack(t,v){await adminFetch('/api/admin/blacklist/'+t+'/'+v,{method:'DELETE'});load()}load();</script></body></html>
