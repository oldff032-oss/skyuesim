<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Графічний ключ — Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signal-v5.css?v=100">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020713">
  <script src="pwa.js"></script>
</head>
<body class="signal-v5 pattern-page">
  <main class="pattern-shell">
    <header><a id="closePattern" href="security.html" aria-label="Закрити">×</a><span><img src="signal-premium-logo.png" alt=""><b>Signal</b></span><i></i></header>
    <div class="pattern-lock">▢</div>
    <h1>Намалюйте ключ</h1>
    <p id="patternHint">З’єднайте щонайменше 4 точки</p>
    <div class="pattern-attempt">Спроба <b id="attemptNo">1</b> з 3 <span><i class="active"></i><i></i><i></i></span></div>
    <div id="patternCanvas"></div>
    <p id="patternMessage"></p>
    <div class="pattern-note">ⓘ　Якщо забудете ключ, доступ можна відновити через email.</div>
  </main>
  <script src="config.js"></script>
  <script type="module">
    import { mountSignalPattern } from './signal-pattern.js';
    const token=localStorage.getItem('signal_session_token');
    const onboarding=new URLSearchParams(location.search).get('onboarding')==='1';
    closePattern.href=onboarding?'security-setup.html?onboarding=1':'security.html';
    if(!token)location.href='login.html';
    let first=null;
    const hint=document.getElementById('patternHint');
    const message=document.getElementById('patternMessage');
    const attemptNo=document.getElementById('attemptNo');
    const dots=[...document.querySelectorAll('.pattern-attempt i')];
    const widget=mountSignalPattern(document.getElementById('patternCanvas'),{
      label:'Графічний ключ',
      onComplete:async pattern=>{
        if(!pattern){message.textContent='З’єднайте від 4 до 9 різних точок.';setTimeout(()=>widget.reset(),500);return}
        if(!first){first=pattern;attemptNo.textContent='2';dots[1].classList.add('active');hint.textContent='Повторіть ключ для підтвердження';message.textContent='';setTimeout(()=>widget.reset(),550);return}
        if(first!==pattern){first=null;attemptNo.textContent='3';dots[2].classList.add('active');hint.textContent='Ключі не збігаються. Намалюйте знову';message.textContent='Спробуйте ще раз';setTimeout(()=>widget.reset(),600);return}
        widget.setDisabled(true);message.style.color='#55e8c4';message.textContent='Зберігаємо ключ…';
        try{
          const response=await fetch(`${API_URL}/api/account/lock`,{method:'PUT',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({method:'pattern',pattern})});
          const data=await response.json();if(!response.ok)throw Error(data.error);
          sessionStorage.setItem(`signal_app_unlocked:${token}`,'1');message.textContent='Графічний ключ увімкнено';
          setTimeout(()=>location.href=onboarding?'account-created.html':'security.html',700);
        }catch(error){message.style.color='#ff6f88';message.textContent=error.message;first=null;widget.setDisabled(false);setTimeout(()=>widget.reset(),600)}
      }
    });
  </script>
</body>
</html>
