<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Signal Passport</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="signal-universe.html">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Signal Passport</b></header><section class="xp-hero"><div class="xp-kicker">цифровий паспорт</div><div class="xp-orb">🛂</div><h1 class="xp-title" style="text-align:center">Світ у твоєму Signal</h1><p class="xp-lead" style="text-align:center">Штамп додається лише після успішно виданої оплаченої eSIM.</p></section><div id="stats" class="xp-grid"><div class="xp-skeleton wide"></div></div><section class="xp-section"><h2>Штампи подорожей</h2><div id="stamps" class="xp-panel"><div class="xp-skeleton"></div></div></section><button id="sync" class="xp-btn secondary" style="margin-top:14px">Синхронізувати покупки</button></main><script src="config.js"></script><script src="experience.js"></script><script>document.body.insertAdjacentHTML('beforeend',xpNav());let data;async function load(){data=await xpFetch('/api/account/passport');stats.innerHTML=`<div class="xp-card"><span class="xp-muted">Країни</span><strong>${data.totalCountries}</strong></div><div class="xp-card"><span class="xp-muted">Подорожі</span><strong>${data.totalTrips}</strong></div>`;stamps.innerHTML=data.stamps.length?`<div class="xp-list">${data.stamps.map(item=>`<div class="xp-stamp"><span class="xp-stamp-flag">${xpEsc(item.flag)}</span><span style="min-width:0;flex:1"><b>${xpEsc(item.country)}</b><small class="xp-muted" style="display:block;margin-top:4px">${xpDate(item.firstConnectedAt)} · ${item.source==='family'?'для близьких':'особиста eSIM'}</small></span><span class="xp-badge">${xpEsc(item.countryCode)}</span></div>`).join('')}</div>`:`<div class="xp-empty"><i>🌌</i><b>Перший штамп попереду</b><p class="xp-muted">Після успішної покупки й видачі eSIM країна з’явиться тут автоматично.</p><a class="xp-btn" href="travel-plans.html">Обрати країну</a></div>`}load().catch(e=>stamps.innerHTML=`<div class="xp-note">${xpEsc(e.message)}</div>`);sync.onclick=async()=>{sync.disabled=true;try{await xpFetch('/api/account/passport/sync',{method:'POST',body:'{}'});await load();xpToast('Паспорт синхронізовано')}catch(e){xpToast(e.message)}finally{sync.disabled=false}};</script></body></html>
