<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подорожі — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.trip-list{margin-top:16px}.trip-item{display:grid;grid-template-columns:minmax(170px,1.5fr) repeat(4,minmax(90px,1fr));gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--glass-border);font-size:12px}.trip-item b{display:block;font-size:13px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(52,211,153,.12);color:var(--success);font-size:10px}.tag.warn{background:rgba(245,166,35,.12);color:#f5c062}@media(max-width:760px){.trip-item{grid-template-columns:1fr 1fr}.trip-item>*:first-child{grid-column:1/-1}}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">✈</div><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Подорожі клієнтів</h1><p class="lead">Підготовка eSIM перед поїздкою, низький залишок і доступність сповіщень.</p><div id="stats" class="stat-grid" style="margin-top:20px"></div><section class="glass glass-card" style="margin-top:18px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 style="font-size:17px">Заплановані подорожі</h2><input id="search" placeholder="Пошук email або країни" style="max-width:260px"></div><div id="list" class="trip-list"><div class="shimmer" style="height:120px"></div></div></section></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();let items=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stats=document.getElementById('stats'),search=document.getElementById('search'),list=document.getElementById('list');
function render(){const q=search.value.trim().toLowerCase(),rows=items.filter(x=>!q||`${x.email} ${x.destination} ${x.displayName}`.toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(x=>`<div class="trip-item"><div><a href="admin-users.html?email=${encodeURIComponent(x.email)}" style="color:var(--text);text-decoration:none"><b>${esc(x.displayName||x.email)}</b><span class="muted">${esc(x.email)}</span></a></div><div><b>${esc(x.destination)}</b><span class="muted">${esc(x.startDate)} → ${esc(x.endDate)}</span></div><div><span class="tag ${x.daysUntil<=3?'warn':''}">${x.daysUntil<0?'у подорожі':x.daysUntil===0?'сьогодні':`через ${x.daysUntil} дн.`}</span></div><div><b>${x.hasEsim?'eSIM готова':'Немає eSIM'}</b><span class="muted">${x.remainingGb==null?'залишок невідомий':`${Number(x.remainingGb).toLocaleString('uk-UA',{maximumFractionDigits:2})} GB`}</span></div><div><b>${x.pushDevices?'Push увімкнено':'Без push'}</b><span class="muted">${esc(x.deviceModel||x.platform)}</span></div></div>`).join(''):'<p class="muted">Нічого не знайдено.</p>'}
async function load(){const res=await adminFetch('/api/admin/travel'),data=await res.json();if(!res.ok)throw Error(data.error);items=data.items;stats.innerHTML=`<div class="glass stat-card"><div class="num">${data.summary.planned}</div><div class="lbl">Заплановано</div></div><div class="glass stat-card"><div class="num">${data.summary.next14Days}</div><div class="lbl">Наступні 14 днів</div></div><div class="glass stat-card"><div class="num" style="color:var(--danger)">${data.summary.withoutEsim}</div><div class="lbl">Без eSIM</div></div><div class="glass stat-card"><div class="num" style="color:#f5a623">${data.summary.lowData}</div><div class="lbl">Менше 1 GB</div></div>`;render()}search.oninput=render;load().catch(e=>list.innerHTML=`<p class="err-text" style="display:block">${esc(e.message)}</p>`);
</script></body></html>
