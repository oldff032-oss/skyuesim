<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  .splash-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; z-index:1;
  }
  .splash-mark{
    width:84px; height:84px; border-radius:24px; font-size:38px;
    background:linear-gradient(135deg, var(--blue), var(--violet));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 0 rgba(59,130,246,0.5);
    animation: markPulse 1.8s ease-in-out infinite, markIn .6s cubic-bezier(.4,0,.2,1);
  }
  @keyframes markIn{ from{ opacity:0; transform:scale(.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes markPulse{
    0%{ box-shadow: 0 0 0 0 rgba(59,130,246,.45); }
    70%{ box-shadow: 0 0 0 26px rgba(59,130,246,0); }
    100%{ box-shadow: 0 0 0 0 rgba(59,130,246,0); }
  }
  .splash-name{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; margin-top:20px;
    opacity:0; animation: fadeUp .5s ease forwards .3s;
  }
  .splash-tagline{
    color:var(--text-muted); font-size:13px; margin-top:6px;
    opacity:0; animation: fadeUp .5s ease forwards .45s;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .splash-track{
    width:120px; height:3px; background:var(--border); border-radius:99px; margin-top:36px; overflow:hidden;
    opacity:0; animation: fadeUp .5s ease forwards .6s;
  }
  .splash-fill{
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--blue), var(--cyan));
    animation: fillUp 1.3s cubic-bezier(.4,0,.2,1) forwards .65s;
  }
  @keyframes fillUp{ to{ width:100%; } }
</style>
</head>
<body>
  <div class="starfield"></div>
  <div class="splash-wrap">
    <div class="splash-mark">📶</div>
    <div class="splash-name">Сигнал</div>
    <div class="splash-tagline">Інтернет без кордонів</div>
    <div class="splash-track"><div class="splash-fill"></div></div>
  </div>

  <script>
    setTimeout(() => {
      const hasSession = localStorage.getItem('signal_session_token') && localStorage.getItem('signal_email');
      window.location.href = hasSession ? 'dashboard.html' : 'welcome.html';
    }, 1900);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
