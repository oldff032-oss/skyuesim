<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Користувачі — Signal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand"><div class="mark" style="width:32px;height:32px;font-size:15px;">🛡️</div><span style="font-size:15px;">Signal Admin</span></div>
      <nav class="admin-nav">
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="admin-tickets.html">🎫 Підтримка</a>
        <a href="admin-users.html" class="active">👥 Користувачі</a>
        <a href="admin-team.html" id="teamNavLink">🔑 Команда</a>
        <a href="admin-audit.html" id="auditNavLink">🛡️ Журнал дій</a>
        <a href="#" onclick="logout()">⏏ Вийти</a>
      </nav>
    </aside>

    <main class="admin-main">
      <h1 style="font-size:22px;">Користувачі</h1>
      <p class="lead">Усі зареєстровані акаунти</p>
      <div class="filter-bar"><input type="text" id="search" placeholder="Пошук за email..." style="min-width:260px;"></div>
      <div class="filter-bar" style="margin-top:10px;">
        <select id="userStatusFilter"><option value="">Усі статуси</option><option value="active">Активні</option><option value="blocked">Заблоковані</option><option value="payment_ok_esim_failed">Помилка eSIM</option><option value="pending_payment">Очікують оплату</option></select>
        <select id="userPlanFilter"><option value="">Усі тарифи</option><option value="basic">Basic</option><option value="standard">Standard</option><option value="unlimited">Unlimited</option></select>
        <select id="userUsageFilter"><option value="">Будь-який трафік</option><option value="80">80%+ трафіку</option><option value="no_esim">Без eSIM</option></select>
        <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="exportCsv()">CSV</button>
      </div>
      <div id="loading" class="shimmer" style="height:200px; margin-top:16px;"></div>

      <table class="admin-table" id="table" style="display:none;">
        <thead>
          <tr><th>Email</th><th>Зареєстрований</th><th>Тариф</th><th>Статус</th><th>Використано</th><th>Дія</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="userDetailsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;padding:20px;overflow:auto;">
        <div class="card" style="max-width:680px;margin:5vh auto;position:relative;">
          <button class="icon-btn" type="button" onclick="closeUserDetails()" style="position:absolute;right:12px;top:12px;">×</button>
          <h2 style="font-size:18px;margin-right:36px;">Дані користувача</h2>
          <pre id="userDetailsContent" style="margin-top:16px;white-space:pre-wrap;word-break:break-word;font-family:'Space Mono',monospace;font-size:12px;color:var(--text-muted);"></pre>
          <div id="userDetailsActions" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="admin-common.js"></script>
  <script>
    requireAdminAuth();

    let allUsers = [];
    const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[char]));

    async function load() {
      try {
        const res = await adminFetch('/api/admin/users');
        if (!res.ok) throw new Error('Не вдалося отримати список користувачів');

        allUsers = await res.json();
        document.getElementById('table').style.display = 'table';
        applyFilters();
      } catch (error) {
        alert(error.message || 'Помилка завантаження');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function render(users) {
      document.getElementById('tbody').innerHTML = users.map((user) => {
        const subscription = user.subscription || {};
        const encodedEmail = encodeURIComponent(user.email);

        const recoveryButton = `<button class="btn ${subscription.status === 'payment_ok_esim_failed' ? 'primary' : 'ghost'}"
               style="padding:7px 10px;font-size:12px;"
               onclick="recoverEsim('${encodedEmail}', '${subscription.plan || 'basic'}')">
               Відновити eSIM
             </button>`;

        const blockButton = `<button class="btn ghost"
          style="padding:7px 10px;font-size:12px;${subscription.status === 'blocked' ? 'color:var(--cyan);' : 'color:var(--danger);'}"
          onclick="setUserBlocked('${encodedEmail}', ${subscription.status === 'blocked'})">
          ${subscription.status === 'blocked' ? 'Розблокувати' : 'Заблокувати'}
        </button>`;

        const detailsButton = `<button class="btn ghost" style="padding:7px 10px;font-size:12px;" onclick="showUserDetails('${encodedEmail}')">Деталі</button>`;

        const usage = subscription.esim
          ? `${subscription.esim.usedGb ?? 0} / ${subscription.esim.dataLimitGb ?? '∞'} ГБ`
          : '—';

        return `<tr>
          <td>${escapeHtml(user.email)}</td>
          <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('uk-UA') : '—'}</td>
          <td>${escapeHtml(subscription.plan || '—')}</td>
          <td>${escapeHtml(subscription.status || 'Немає підписки')}${subscription.referredBy ? '<br><span class="muted" style="font-size:11px;">🎁 Запрошення</span>' : ''}</td>
          <td>${usage}</td>
          <td style="display:flex;gap:6px;flex-wrap:wrap;">${detailsButton}${recoveryButton}${blockButton}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">Немає користувачів</td></tr>';
    }

    async function recoverEsim(encodedEmail, defaultPlan = 'basic') {
      const email = decodeURIComponent(encodedEmail);
      const iccid = prompt(
        `Введіть ICCID уже виданої або встановленої eSIM для ${email}. Оплата Stripe не повторюється.`
      );

      if (!iccid) return;

      const plan = prompt('Оберіть тариф: basic, standard або unlimited.', defaultPlan);
      if (!plan) return;

      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}/recover-esim`, {
          method: 'POST',
          body: JSON.stringify({
            iccid: iccid.replace(/\s/g, ''),
            plan: plan.trim().toLowerCase()
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Не вдалося відновити eSIM');
        }

        alert('eSIM успішно відновлено. Оплата Stripe не повторювалася.');
        await load();
      } catch (error) {
        alert(error.message || 'Помилка відновлення eSIM');
      }
    }

    async function setUserBlocked(encodedEmail, isBlocked) {
      const email = decodeURIComponent(encodedEmail);
      const action = isBlocked ? 'розблокувати' : 'заблокувати';
      if (!confirm(`${action.charAt(0).toUpperCase() + action.slice(1)} ${email}?`)) return;

      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}/block`, {
          method: 'PATCH',
          body: JSON.stringify({ blocked: !isBlocked })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Не вдалося змінити статус користувача');
        await load();
      } catch (error) {
        alert(error.message || 'Помилка зміни статусу користувача');
      }
    }

    async function showUserDetails(encodedEmail) {
      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Не вдалося отримати дані користувача');
        const subscription = data.subscription || {};
        const esim = subscription.esim || {};
        const lines = [
          `Email: ${data.email}`,
          `Зареєстрований: ${data.account?.createdAt ? new Date(data.account.createdAt).toLocaleString('uk-UA') : '—'}`,
          `Останній вхід: ${data.account?.lastLoginAt ? new Date(data.account.lastLoginAt).toLocaleString('uk-UA') : '—'}`,
          `Тариф: ${subscription.plan || '—'}`,
          `Статус: ${subscription.status || '—'}`,
          `Запросив: ${subscription.referredBy || '—'}`,
          `Винагорода: ${subscription.referralRewardStatus || '—'}`,
          `Код бонусу: ${subscription.referralRewardPackageCode || '—'}`,
          `Оновлено: ${subscription.updatedAt ? new Date(subscription.updatedAt).toLocaleString('uk-UA') : '—'}`,
          '',
          'eSIM',
          `ICCID: ${esim.iccid || '—'}`,
          `Номер замовлення: ${esim.orderNo || '—'}`,
          `eSIM UID: ${esim.esimTranNo || '—'}`,
          `Статус eSIM: ${esim.status || '—'}`,
          `Використано: ${esim.usedGb ?? '—'} ГБ`,
          `Залишилось: ${esim.remainingGb ?? '—'} ГБ`,
          `Ліміт: ${esim.dataLimitGb ?? '—'} ГБ`,
          `Активація: ${esim.activateTime || '—'}`,
          `Завершення: ${esim.expiredTime || '—'}`,
          `APN: ${esim.apn || '—'}`,
          `Код активації: ${esim.activationCode || '—'}`,
        ];
        document.getElementById('userDetailsContent').textContent = lines.join('\n');
        document.getElementById('userDetailsActions').innerHTML = `
          <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="adminUserAction('${encodedEmail}','resync-esim')">Оновити трафік</button>
          <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="adminUserAction('${encodedEmail}','resend-esim-instructions')">Інструкція eSIM</button>
          <button class="btn primary" style="width:auto;padding:9px 12px;font-size:12px;" onclick="recoverEsim('${encodedEmail}','${subscription.plan || 'basic'}')">Відновити eSIM</button>
          <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="createCustomPackageCheckout('${encodedEmail}')">Продати пакет eSIM</button>
          ${subscription.referredBy ? `<button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="prepareReferralReward('${encodedEmail}')">Підготувати 1 ГБ</button>` : ''}
          ${subscription.referredBy ? `<button class="btn primary" style="width:auto;padding:9px 12px;font-size:12px;" onclick="creditReferralReward('${encodedEmail}')">Нарахувати 1 ГБ рефералу</button>` : ''}
          <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;color:var(--danger);" onclick="adminUserAction('${encodedEmail}','revoke-sessions')">Завершити входи</button>
          <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="notifyUser('${encodedEmail}','push')">Push</button>
          <button class="btn ghost" style="width:auto;padding:9px 12px;font-size:12px;" onclick="notifyUser('${encodedEmail}','email')">Email</button>`;
        document.getElementById('userDetailsModal').style.display = 'block';
      } catch (error) {
        alert(error.message || 'Помилка завантаження даних користувача');
      }
    }

    function closeUserDetails() {
      document.getElementById('userDetailsModal').style.display = 'none';
    }

    async function createCustomPackageCheckout(encodedEmail) {
      const email = decodeURIComponent(encodedEmail);
      const packageCode = prompt('Package code з eSIM Access, наприклад CKH139:');
      if (!packageCode) return;
      const packageName = prompt('Назва, яку побачить користувач у Stripe:', packageCode);
      if (!packageName) return;
      const price = prompt('Ціна для користувача в USD, наприклад 4.99:');
      if (price === null) return;
      const amountCents = Math.round(Number(String(price).replace(',', '.')) * 100);
      if (!Number.isInteger(amountCents) || amountCents < 50) return alert('Вкажіть коректну ціну, мінімум $0.50.');
      const dataLimit = prompt('Обсяг пакета в ГБ (необов’язково):', '');
      try {
        const response = await adminFetch(`/api/admin/users/${encodedEmail}/custom-package-checkout`, {
          method: 'POST',
          body: JSON.stringify({ packageCode: packageCode.trim(), packageName: packageName.trim(), amountCents, currency: 'usd', dataLimitGb: dataLimit === '' ? null : Number(dataLimit) })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Не вдалося створити оплату');
        await navigator.clipboard?.writeText(data.url);
        prompt('Stripe-посилання створено й скопійовано. Надішли його користувачу:', data.url);
      } catch (error) { alert(error.message); }
    }

    async function prepareReferralReward(encodedEmail) {
      const packageCode = prompt('Введіть packageCode top-up пакета на 1 ГБ з eSIM Access:');
      if (!packageCode) return;
      try {
        const response = await adminFetch(`/api/admin/referrals/${encodedEmail}/prepare-reward`, { method: 'POST', body: JSON.stringify({ packageCode: packageCode.trim() }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Не вдалося підготувати винагороду');
        alert('Готово. Користувач отримав статус: винагорода очікується 12–24 години.');
        await showUserDetails(encodedEmail); await load();
      } catch (error) { alert(error.message); }
    }

    async function creditReferralReward(encodedEmail) {
      const packageCode = prompt('Введіть packageCode top-up пакета на 1 ГБ. Він буде застосований до eSIM того, хто запросив друга:');
      if (!packageCode) return;
      if (!confirm('Підтвердити реальне поповнення eSIM на 1 ГБ? Цю дію не можна скасувати.')) return;
      try {
        const response = await adminFetch(`/api/admin/referrals/${encodedEmail}/credit-reward`, { method: 'POST', body: JSON.stringify({ packageCode: packageCode.trim() }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Не вдалося нарахувати винагороду');
        alert(`Готово. 1 ГБ нараховано користувачу ${data.beneficiary}.`);
        await showUserDetails(encodedEmail); await load();
      } catch (error) { alert(error.message); }
    }

    async function adminUserAction(encodedEmail, action) {
      const email = decodeURIComponent(encodedEmail);
      if(action === 'revoke-sessions' && !confirm(`Завершити всі активні входи ${email}?`)) return;
      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}/${action}`, { method: 'POST' });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Дію не виконано');
        alert(action === 'revoke-sessions' ? `Завершено входів: ${data.revoked}` : 'Готово');
        await showUserDetails(encodedEmail); await load();
      } catch(error) { alert(error.message); }
    }

    async function notifyUser(encodedEmail, channel) {
      const email = decodeURIComponent(encodedEmail);
      const title = prompt('Заголовок повідомлення:', 'Сигнал');
      if(title === null) return;
      const message = prompt(`Текст для ${email}:`);
      if(!message) return;
      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}/notify`, { method:'POST', body:JSON.stringify({ channel, title, message }) });
        const data = await res.json(); if(!res.ok) throw new Error(data.error || 'Не вдалося надіслати');
        alert(channel === 'push' && !data.delivered ? 'Push-пристрій не підключено.' : 'Повідомлення надіслано.');
      } catch(error) { alert(error.message); }
    }

    function applyFilters(){
      const query = document.getElementById('search').value.toLowerCase();
      const status = document.getElementById('userStatusFilter').value;
      const plan = document.getElementById('userPlanFilter').value;
      const usage = document.getElementById('userUsageFilter').value;
      render(allUsers.filter((user) => {
        const subscription = user.subscription || {}; const esim = subscription.esim || {};
        const percent = esim.dataLimitGb ? (Number(esim.usedGb || 0) / Number(esim.dataLimitGb)) * 100 : 0;
        return user.email.toLowerCase().includes(query) && (!status || subscription.status === status) && (!plan || subscription.plan === plan) && (!usage || (usage === 'no_esim' ? !subscription.esim : percent >= Number(usage)));
      }));
    }

    function exportCsv(){
      const rows = [['Email','Тариф','Статус','Використано ГБ','Ліміт ГБ'], ...allUsers.map(user => [user.email, user.subscription?.plan || '', user.subscription?.status || '', user.subscription?.esim?.usedGb ?? '', user.subscription?.esim?.dataLimitGb ?? ''])];
      const blob = new Blob([rows.map(row => row.map(value => `"${String(value).replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'signal-users.csv'; link.click(); URL.revokeObjectURL(url);
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    ['userStatusFilter','userPlanFilter','userUsageFilter'].forEach((id) => document.getElementById(id).addEventListener('change', applyFilters));

    load();
  </script>
</body>
</html>
