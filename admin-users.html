<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Користувачі — Signal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand"><div class="mark" style="width:32px;height:32px;font-size:15px;">🛡️</div><span style="font-size:15px;">Signal Admin</span></div>
      <nav class="admin-nav">
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="admin-tickets.html">🎫 Підтримка</a>
        <a href="admin-users.html" class="active">👥 Користувачі</a>
        <a href="admin-team.html" id="teamNavLink">🔑 Команда</a>
        <a href="admin-audit.html" id="auditNavLink">🛡️ Журнал дій</a>
        <a href="#" onclick="logout()">⏏ Вийти</a>
      </nav>
    </aside>

    <main class="admin-main">
      <h1 style="font-size:22px;">Користувачі</h1>
      <p class="lead">Усі зареєстровані акаунти</p>
      <div class="filter-bar"><input type="text" id="search" placeholder="Пошук за email..." style="min-width:260px;"></div>
      <div id="loading" class="shimmer" style="height:200px; margin-top:16px;"></div>

      <table class="admin-table" id="table" style="display:none;">
        <thead>
          <tr><th>Email</th><th>Зареєстрований</th><th>Тариф</th><th>Статус</th><th>Використано</th><th>Дія</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="admin-common.js"></script>
  <script>
    requireAdminAuth();

    let allUsers = [];
    const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[char]));

    async function load() {
      try {
        const res = await adminFetch('/api/admin/users');
        if (!res.ok) throw new Error('Не вдалося отримати список користувачів');

        allUsers = await res.json();
        document.getElementById('table').style.display = 'table';
        render(allUsers);
      } catch (error) {
        alert(error.message || 'Помилка завантаження');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function render(users) {
      document.getElementById('tbody').innerHTML = users.map((user) => {
        const subscription = user.subscription || {};
        const encodedEmail = encodeURIComponent(user.email);

        const recoveryButton = !subscription.esim && subscription.status !== 'blocked'
          ? `<button class="btn ${subscription.status === 'payment_ok_esim_failed' ? 'primary' : 'ghost'}"
               style="padding:7px 10px;font-size:12px;"
               onclick="recoverEsim('${encodedEmail}')">
               Відновити eSIM
             </button>`
          : '';

        const blockButton = `<button class="btn ghost"
          style="padding:7px 10px;font-size:12px;${subscription.status === 'blocked' ? 'color:var(--cyan);' : 'color:var(--danger);'}"
          onclick="setUserBlocked('${encodedEmail}', ${subscription.status === 'blocked'})">
          ${subscription.status === 'blocked' ? 'Розблокувати' : 'Заблокувати'}
        </button>`;

        const usage = subscription.esim
          ? `${subscription.esim.usedGb ?? 0} / ${subscription.esim.dataLimitGb ?? '∞'} ГБ`
          : '—';

        return `<tr>
          <td>${escapeHtml(user.email)}</td>
          <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('uk-UA') : '—'}</td>
          <td>${escapeHtml(subscription.plan || '—')}</td>
          <td>${escapeHtml(subscription.status || 'Немає підписки')}</td>
          <td>${usage}</td>
          <td style="display:flex;gap:6px;flex-wrap:wrap;">${recoveryButton}${blockButton}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">Немає користувачів</td></tr>';
    }

    async function recoverEsim(encodedEmail) {
      const email = decodeURIComponent(encodedEmail);
      const iccid = prompt(
        `Введіть ICCID / UID уже виданої або встановленої eSIM для ${email}. Оплата Stripe не повторюється.`
      );

      if (!iccid) return;

      const plan = prompt('Оберіть тариф: basic, standard або unlimited.', 'basic');
      if (!plan) return;

      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}/recover-esim`, {
          method: 'POST',
          body: JSON.stringify({
            iccid: iccid.replace(/\s/g, ''),
            plan: plan.trim().toLowerCase()
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Не вдалося відновити eSIM');
        }

        alert('eSIM успішно відновлено. Оплата Stripe не повторювалася.');
        await load();
      } catch (error) {
        alert(error.message || 'Помилка відновлення eSIM');
      }
    }

    async function setUserBlocked(encodedEmail, isBlocked) {
      const email = decodeURIComponent(encodedEmail);
      const action = isBlocked ? 'розблокувати' : 'заблокувати';
      if (!confirm(`${action.charAt(0).toUpperCase() + action.slice(1)} ${email}?`)) return;

      try {
        const res = await adminFetch(`/api/admin/users/${encodedEmail}/block`, {
          method: 'PATCH',
          body: JSON.stringify({ blocked: !isBlocked })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Не вдалося змінити статус користувача');
        await load();
      } catch (error) {
        alert(error.message || 'Помилка зміни статусу користувача');
      }
    }

    document.getElementById('search').addEventListener('input', (event) => {
      const query = event.target.value.toLowerCase();
      render(allUsers.filter((user) => user.email.toLowerCase().includes(query)));
    });

    load();
  </script>
</body>
</html>
