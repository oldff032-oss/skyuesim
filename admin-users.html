<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Керування клієнтами — Signal Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .users-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}.users-head .btn{width:auto}.user-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:19px 0}.user-stat{padding:16px;position:relative;overflow:hidden}.user-stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-26px;bottom:-35px;background:var(--glow,#36d7ff);filter:blur(25px);opacity:.32}.user-stat small{color:var(--text-muted)}.user-stat strong{display:block;font:700 27px 'Space Grotesk',sans-serif;margin-top:6px}.users-toolbar{display:grid;grid-template-columns:minmax(230px,1fr) 190px 170px 190px auto;gap:9px}.users-toolbar input,.users-toolbar select{width:100%;box-sizing:border-box;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px}.users-toolbar option{background:#101522}.users-table-wrap{margin-top:15px;overflow:auto;border:1px solid var(--glass-border);border-radius:16px;background:rgba(255,255,255,.018)}.users-table{width:100%;border-collapse:collapse;min-width:880px}.users-table th{text-align:left;padding:12px 14px;color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--glass-border)}.users-table td{padding:14px;border-bottom:1px solid rgba(255,255,255,.065);font-size:12px}.users-table tr:last-child td{border-bottom:0}.users-table tbody tr{cursor:pointer;transition:.18s}.users-table tbody tr:hover{background:rgba(71,151,255,.06)}.user-cell{display:flex;gap:11px;align-items:center}.user-avatar{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#258eea,#744ef0);background-size:cover;background-position:center;border:1px solid rgba(99,210,255,.3);font-weight:800}.user-cell b,.user-cell small{display:block}.user-cell small{color:var(--text-muted);margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--glass-border);border-radius:999px;font-size:10px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#8f99b2}.status.active:before{background:#43e9b5;box-shadow:0 0 9px #43e9b5}.status.blocked:before,.status.canceled:before,.status.esim_revoked:before{background:#ff647e}.status.payment_ok_esim_failed:before,.status.renewal_failed:before{background:#ffc456}.open-button{display:inline-flex;padding:8px 10px;border:1px solid rgba(84,203,255,.25);border-radius:10px;color:#c9f5ff;text-decoration:none;background:rgba(49,130,255,.09);font-weight:800}.role-note{padding:13px 15px;margin-top:14px;border:1px solid rgba(78,201,255,.18);border-radius:14px;background:rgba(38,119,223,.06);font-size:12px;color:var(--text-muted)}.empty{text-align:center;padding:35px;color:var(--text-muted)}
    @media(max-width:900px){.user-stats{grid-template-columns:1fr 1fr}.users-toolbar{grid-template-columns:1fr 1fr}.users-toolbar input{grid-column:1/-1}}
    @media(max-width:560px){.admin-main{padding-left:14px!important;padding-right:14px!important}.user-stat{padding:13px}.user-stat strong{font-size:22px}.users-toolbar{grid-template-columns:1fr}.users-toolbar input{grid-column:auto}.users-head{align-items:flex-start}.users-head .btn{width:100%}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar"><div class="brand"><div class="mark">🛡️</div><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside>
    <main class="admin-main">
      <div class="users-head"><div><h1>Керування клієнтами</h1><p class="lead">Один центр для профілю, eSIM, пакетів, оплат, підтримки, доступу та історії.</p></div><button class="btn ghost" onclick="load()">Оновити список</button></div>
      <div id="roleNote" class="role-note">Завантаження прав доступу…</div>
      <section class="user-stats"><div class="glass user-stat" style="--glow:#43dfff"><small>Усього</small><strong id="allCount">0</strong></div><div class="glass user-stat" style="--glow:#43ebb7"><small>Активні</small><strong id="activeCount">0</strong></div><div class="glass user-stat" style="--glow:#ffbe56"><small>Потребують уваги</small><strong id="attentionCount">0</strong></div><div class="glass user-stat" style="--glow:#ff647e"><small>Заблоковані</small><strong id="blockedCount">0</strong></div></section>
      <div class="users-toolbar"><input id="search" type="search" placeholder="Email або ім’я клієнта"><select id="statusFilter"><option value="">Усі статуси</option><option value="active">Активні</option><option value="blocked">Заблоковані</option><option value="payment_ok_esim_failed">Помилка eSIM</option><option value="renewal_failed">Помилка поновлення</option><option value="registered">Без пакета</option></select><select id="planFilter"><option value="">Усі тарифи</option><option value="basic">Basic</option><option value="standard">Standard</option><option value="unlimited">Unlimited</option></select><select id="esimFilter"><option value="">Будь-яка eSIM</option><option value="yes">З eSIM</option><option value="no">Без eSIM</option><option value="80">Використано 80%+</option></select><button class="btn ghost" onclick="exportCsv()">CSV</button></div>
      <div id="loading" class="shimmer" style="height:230px;margin-top:15px"></div>
      <div id="tableWrap" class="users-table-wrap" hidden><table class="users-table"><thead><tr><th>Клієнт</th><th>Реєстрація</th><th>Пакет</th><th>Статус</th><th>Інтернет</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
    </main>
  </div>
  <script src="config.js"></script><script src="admin-common.js"></script>
  <script>
    requireAdminAuth();
    const E=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),statusName=value=>({active:'Активний',blocked:'Заблокований',registered:'Без пакета',payment_ok_esim_failed:'Помилка eSIM',renewal_failed:'Помилка поновлення',esim_revoked:'eSIM відкликана',esim_transferred:'eSIM передана',canceled:'Скасований'})[value]||value||'Без підписки';
    let users=[];
    async function load(){loading.style.display='block';tableWrap.hidden=true;try{const [usersResponse,meResponse]=await Promise.all([adminFetch('/api/admin/users'),adminFetch('/api/admin/me')]),usersData=await usersResponse.json(),me=await meResponse.json();if(!usersResponse.ok)throw new Error(usersData.error||'Не вдалося отримати клієнтів');if(!meResponse.ok)throw new Error(me.error||'Не вдалося перевірити роль');users=usersData;roleNote.innerHTML=me.role==='super_admin'?'<b style="color:#ffd670">Super Admin:</b> повний контроль доступний у центрі клієнта; критичні операції потребують підтвердженої 2FA та записуються в журнал.':me.role==='admin'?'<b>Admin:</b> доступні профіль, синхронізація, підтримка та керування входами. Видача нового QR, відкликання eSIM, повернення і видалення — тільки Super Admin.':me.role==='support'?'<b>Support:</b> доступні перегляд клієнта, звернення, нотатки й повідомлення.':'<b>Viewer:</b> доступний лише перегляд.';allCount.textContent=users.length;activeCount.textContent=users.filter(user=>user.subscription?.status==='active').length;attentionCount.textContent=users.filter(user=>['payment_ok_esim_failed','renewal_failed'].includes(user.subscription?.status)||(user.subscription?.purchases||[]).some(item=>item.fulfillmentStatus==='failed')).length;blockedCount.textContent=users.filter(user=>user.subscription?.status==='blocked').length;applyFilters();tableWrap.hidden=false}catch(error){tbody.innerHTML=`<tr><td colspan="6" class="empty">${E(error.message)}</td></tr>`;tableWrap.hidden=false}finally{loading.style.display='none'}}
    function applyFilters(){const query=search.value.trim().toLowerCase(),status=statusFilter.value,plan=planFilter.value,esimMode=esimFilter.value;render(users.filter(user=>{const sub=user.subscription||{},esim=sub.esim||null,percent=esim?.dataLimitGb?Number(esim.usedGb||0)/Number(esim.dataLimitGb)*100:0,name=String(sub.displayName||'').toLowerCase();return(!query||user.email.toLowerCase().includes(query)||name.includes(query))&&(!status||sub.status===status)&&(!plan||sub.plan===plan)&&(!esimMode||(esimMode==='yes'&&esim)||(esimMode==='no'&&!esim)||(esimMode==='80'&&percent>=80))}))}
    function render(items){tbody.innerHTML=items.length?items.map(user=>{const sub=user.subscription||{},esim=sub.esim||{},encoded=encodeURIComponent(user.email),name=sub.displayName||user.email.split('@')[0],usage=sub.esim?`${Number(esim.usedGb||0).toFixed(2)} / ${esim.dataLimitGb==null?'∞':E(esim.dataLimitGb)} ГБ`:'—',avatar=sub.avatarDataUrl?`style="background-image:url('${E(sub.avatarDataUrl)}')"`:'';return `<tr onclick="location.href='admin-client.html?email=${encoded}'"><td><div class="user-cell"><span class="user-avatar" ${avatar}>${sub.avatarDataUrl?'':E(name[0].toUpperCase())}</span><div><b>${E(name)}</b><small>${E(user.email)}</small></div></div></td><td>${user.createdAt?new Date(user.createdAt).toLocaleDateString('uk-UA'):'—'}</td><td>${E(sub.plan||'—')}</td><td><span class="status ${E(sub.status||'registered')}">${E(statusName(sub.status))}</span></td><td>${usage}</td><td><a class="open-button" href="admin-client.html?email=${encoded}" onclick="event.stopPropagation()">Відкрити центр</a></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">За цими фільтрами клієнтів немає.</td></tr>'}
    function exportCsv(){const rows=[['Email','Ім’я','Тариф','Статус','Використано ГБ','Ліміт ГБ'],...users.map(user=>[user.email,user.subscription?.displayName||'',user.subscription?.plan||'',user.subscription?.status||'',user.subscription?.esim?.usedGb??'',user.subscription?.esim?.dataLimitGb??''])],csv=rows.map(row=>row.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(',')).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='signal-clients.csv';link.click();URL.revokeObjectURL(url)}
    [search,statusFilter,planFilter,esimFilter].forEach(control=>control.addEventListener(control===search?'input':'change',applyFilters));
    const requestedEmail=new URLSearchParams(location.search).get('email');if(requestedEmail)location.replace(`admin-client.html?email=${encodeURIComponent(requestedEmail)}`);else load();
  </script>
</body>
</html>
