<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Підтримка під час оновлення — Signal</title><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#05060d"><style>
body{min-height:100vh;background:radial-gradient(circle at 50% -15%,#193873 0,#080c19 46%,#03050b 100%)}.maintenance-wrap{width:min(100%,520px);margin:auto;padding:24px 18px 40px}.support-head{text-align:center;padding:8px 0 18px}.support-head img{width:94px;height:94px;border-radius:24px;box-shadow:0 16px 50px #3178ff55}.support-head h1{font-size:27px;margin-top:17px}.support-head p{color:var(--text-muted);font-size:13px;line-height:1.65;margin-top:8px}.support-card{padding:20px}.support-card textarea{width:100%;min-height:140px;padding:14px 15px;border-radius:14px;background:#ffffff09;border:1px solid var(--border);color:var(--text);font:inherit;resize:vertical}.support-card textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #3b82f622}.notice{display:flex;gap:9px;padding:12px;border-radius:12px;background:#4f75ff12;color:var(--text-muted);font-size:11.5px;line-height:1.55;margin-top:14px}.success{display:none;text-align:center;padding:28px 18px}.success .check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#27d3a422;color:#45e6b9;font-size:28px;margin:auto}@media(max-width:380px){.support-card{padding:16px}.support-head h1{font-size:24px}}
</style></head><body><main class="maintenance-wrap"><header class="support-head"><img src="/signal-premium-logo.png" alt="Signal"><h1>Підтримка працює</h1><p>Застосунок оновлюється, але ви можете надіслати звернення просто зараз. Вхід, PIN та UID eSIM не потрібні.</p></header><section id="form" class="glass support-card"><div class="field-group"><label class="field-label">Ваш email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field-group"><label class="field-label">Тема</label><input id="subject" maxlength="160" value="Проблема під час технічних робіт"></div><div class="field-group"><label class="field-label">Опишіть проблему</label><textarea id="message" maxlength="5000" placeholder="Що сталося та якої допомоги ви потребуєте?"></textarea></div><div class="notice"><span>🔒</span><span>Не надсилайте пароль, PIN, банківські дані, QR-код або код активації eSIM.</span></div><div id="error" class="err-text" style="display:none;margin-top:14px"></div><button id="send" class="btn" style="margin-top:17px" onclick="submitRequest()">Надіслати в підтримку</button><button class="btn ghost" style="margin-top:9px" onclick="checkStatus()">Перевірити стан сервісу</button></section><section id="success" class="glass success"><div class="check">✓</div><h2 style="margin-top:14px">Звернення надіслано</h2><p id="successText" class="lead"></p><button class="btn" style="margin-top:18px" onclick="checkStatus()">Перевірити стан сервісу</button></section></main><script src="config.js"></script><script>
document.getElementById('email').value=localStorage.getItem('signal_email')||'';async function submitRequest(){const email=document.getElementById('email').value.trim(),subject=document.getElementById('subject').value.trim(),message=document.getElementById('message').value.trim(),button=document.getElementById('send'),error=document.getElementById('error');error.style.display='none';button.disabled=true;button.textContent='Надсилаємо…';try{const response=await fetch(`${API_URL}/api/maintenance-support`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,subject,message})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Не вдалося надіслати звернення.');document.getElementById('form').style.display='none';document.getElementById('success').style.display='block';document.getElementById('successText').textContent=`Номер звернення: #${data.ticketId}. Відповідь надійде на ${email}.`}catch(e){error.textContent=e.message;error.style.display='flex';button.disabled=false;button.textContent='Надіслати в підтримку'}}async function checkStatus(){try{const response=await fetch(`${API_URL}/api/service-status`,{cache:'no-store'}),data=await response.json();if(data.status==='operational')location.href=localStorage.getItem('signal_session_token')?'/dashboard.html':'/login.html';else alert('Оновлення ще триває. Підтримка залишається доступною.')}catch{alert('Не вдалося перевірити стан. Спробуйте ще раз пізніше.')}}
</script><script src="i18n.js"></script></body></html>
