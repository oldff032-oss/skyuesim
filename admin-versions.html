<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Версії та оновлення — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{padding:16px}.metric b{font-size:24px;display:block}.table-wrap{overflow:auto}.table-wrap table{width:100%;min-width:720px;border-collapse:collapse}.table-wrap td,.table-wrap th{padding:10px;border-bottom:1px solid var(--glass-border);text-align:left}.assets{display:flex;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}.change{padding:12px;border-bottom:1px solid var(--glass-border)}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><img src="signal-premium-logo.png" style="width:34px;border-radius:10px"><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Версії та оновлення</h1><p class="lead">Контроль деплоїв, Service Worker, кешу та старих версій на пристроях.</p><div id="loading" class="shimmer" style="height:150px"></div><div id="content" hidden><div class="grid" id="metrics"></div><section class="glass glass-card"><h2>Зафіксувати новий деплой</h2><div class="grid"><input id="frontend" placeholder="Frontend"><input id="backend" placeholder="Backend"><input id="serviceWorker" placeholder="Service Worker"><input id="cache" placeholder="Версія кешу"></div><textarea id="change" rows="3" placeholder="Що змінилося" style="margin-top:10px"></textarea><button class="btn primary" onclick="saveVersion()" style="margin-top:10px">Зберегти версію</button></section><section class="glass glass-card"><h2>Оновлення користувачів</h2><div class="actions"><button class="btn primary" onclick="requestUpdate()">Попросити оновити застосунок</button></div><h3>Примусово оновити лише критичні файли</h3><div class="assets" id="assets"></div><button class="btn danger" onclick="criticalRefresh()" style="margin-top:12px">Оновити вибрані критичні файли</button></section><section class="glass glass-card"><h2>Пристрої</h2><div class="table-wrap"><table><thead><tr><th>Користувач</th><th>Frontend</th><th>Service Worker</th><th>Кеш</th><th>Платформа</th><th>Остання активність</th><th>Стан</th></tr></thead><tbody id="clients"></tbody></table></div></section><section class="glass glass-card"><h2>Журнал змін</h2><div id="changelog"></div></section></div></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();let state;const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),allowed=['/i18n.js','/style.css','/pwa.js','/sw.js','/config.js','/admin-common.js'];async function call(path,method='GET',body){const r=await adminFetch(path,{method,...(body?{body:JSON.stringify(body)}:{})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){state=await call('/api/admin/versions');loading.hidden=true;content.hidden=false;const c=state.current;metrics.innerHTML=`<div class="glass metric"><b>${E(c.frontend)}</b>Frontend</div><div class="glass metric"><b>${E(c.backend)}</b>Backend</div><div class="glass metric"><b>${E(c.serviceWorker)}</b>Service Worker</div><div class="glass metric"><b>${E(c.cache||'—')}</b>Кеш</div><div class="glass metric"><b style="color:${state.summary.old?'var(--danger)':'var(--success)'}">${state.summary.old}</b>Старих версій</div><div class="glass metric"><b>${state.summary.untracked}</b>Ще не відзвітували</div>`;frontend.value=c.frontend||'';backend.value=c.backend||'';serviceWorker.value=c.serviceWorker||'';cache.value=c.cache||'';assets.innerHTML=allowed.map(x=>`<label><input type="checkbox" value="${x}" ${['/i18n.js','/style.css','/pwa.js','/sw.js'].includes(x)?'checked':''}> ${x}</label>`).join('');clients.innerHTML=state.clients.map(x=>`<tr><td>${E(x.email)}</td><td>${E(x.frontend)}</td><td>${E(x.serviceWorker)}</td><td>${E(x.cache)}</td><td>${E(x.platform)}</td><td>${new Date(x.lastSeenAt).toLocaleString('uk-UA')}</td><td style="color:${x.old?'var(--danger)':'var(--success)'}">${x.old?'Стара':'Актуальна'}</td></tr>`).join('')||'<tr><td colspan="7">Дані з’являться після входу користувачів у застосунок.</td></tr>';changelog.innerHTML=(c.changelog||[]).map(x=>`<div class="change"><b>${E(x.version)}</b> · ${new Date(x.createdAt).toLocaleString('uk-UA')}<p>${E(x.text)}</p><small>${E(x.by)}</small></div>`).join('')||'<p class="muted">Записів ще немає.</p>'}async function run(fn){try{await fn();await load()}catch(e){alert(e.message)}}function saveVersion(){run(()=>call('/api/admin/version-info','PATCH',{frontend:frontend.value,backend:backend.value,serviceWorker:serviceWorker.value,cache:cache.value,change:change.value}))}function requestUpdate(){run(async()=>{const x=await call('/api/admin/versions/request-update','POST',{});alert(`Запит надіслано: ${x.delivered} з ${x.targets}`)})}function criticalRefresh(){const selected=[...document.querySelectorAll('#assets input:checked')].map(x=>x.value);if(!confirm('Оновити вибрані критичні файли на пристроях?'))return;run(()=>call('/api/admin/versions/critical-refresh','POST',{assets:selected}))}load().catch(e=>loading.textContent=e.message);
</script></body></html>
