<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запити порятунку — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.rescue{padding:17px;border:1px solid var(--glass-border);border-radius:18px;background:#ffffff05;margin-top:12px}.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin-top:12px}.diag span{padding:9px;border-radius:10px;background:#ffffff06;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{width:auto}@media(max-width:520px){.actions button{flex:1}}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">◎</div><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Запити порятунку</h1><p class="lead">Перевірка стану eSIM і контрольоване нарахування бонусу турботи.</p><div id="stats" class="stat-grid" style="margin-top:20px"></div><section class="glass glass-card" style="margin-top:18px"><div id="message" class="muted"></div><div id="list"><div class="shimmer" style="height:120px"></div></div></section></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>requireAdminAuth();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=v=>new Date(v).toLocaleString('uk-UA');async function load(){const res=await adminFetch('/api/admin/rescue-requests'),data=await res.json();if(!res.ok)throw Error(data.error);stats.innerHTML=`<div class="glass stat-card"><div class="num" style="color:#ffd071">${data.summary.pending}</div><div class="lbl">Очікують</div></div><div class="glass stat-card"><div class="num" style="color:#62e2c0">${data.summary.approved}</div><div class="lbl">Схвалено</div></div><div class="glass stat-card"><div class="num">${data.summary.declined}</div><div class="lbl">Відхилено</div></div>`;list.innerHTML=data.items.length?data.items.map(item=>`<article class="rescue"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b>${esc(item.email)}</b><small class="muted" style="display:block">${date(item.createdAt)} · ${esc(item.reason)}</small></span><span class="status-pill ${item.status==='approved'?'on':item.status==='pending'?'warn':'off'}">${esc(item.status)}</span></div><div class="diag"><span>eSIM: ${esc(item.diagnostics?.esimStatus)}</span><span>Stripe: ${esc(item.diagnostics?.stripeStatus)}</span><span>Provider: ${esc(item.diagnostics?.providerStatus)}</span><span>APN: ${esc(item.diagnostics?.apn||'немає')}</span><span>Покупка: ${esc(item.diagnostics?.purchaseId||'немає')}</span><span>Пристрій: ${esc(item.diagnostics?.deviceModel)}</span></div>${item.note?`<p class="muted">${esc(item.note)}</p>`:''}${item.status==='pending'?`<div class="actions"><button class="btn" onclick="resolveRequest('${encodeURIComponent(item.id)}',true)">Схвалити 250 Points</button><button class="btn ghost" onclick="resolveRequest('${encodeURIComponent(item.id)}',false)">Відхилити</button></div>`:''}</article>`).join(''):'<p class="muted">Нових запитів немає.</p>'}async function resolveRequest(id,approved){if(!confirm(approved?'Після перевірки нарахувати 250 Signal Points?':'Відхилити запит?'))return;const res=await adminFetch(`/api/admin/rescue-requests/${id}/resolve`,{method:'POST',body:JSON.stringify({approved,points:250})}),data=await res.json();if(!res.ok)return alert(data.error);message.textContent=approved?'Бонус нараховано й записано в аудит.':'Запит відхилено.';load()}load().catch(e=>list.innerHTML=`<p class="err-text" style="display:block">${esc(e.message)}</p>`);</script></body></html>
