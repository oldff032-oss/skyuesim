<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport і Club — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.member{display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(90px,1fr));gap:12px;padding:14px 0;border-top:1px solid var(--glass-border);font-size:12px;align-items:center}.member b{display:block;font-size:13px}@media(max-width:760px){.member{grid-template-columns:1fr 1fr}.member>div:first-child{grid-column:1/-1}}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">✦</div><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Signal Passport і Club</h1><p class="lead">Реальні штампи за видані eSIM, Points, рівні та контроль винагород.</p><div id="stats" class="stat-grid" style="margin-top:20px"></div><section class="glass glass-card" style="margin-top:18px"><h2 style="font-size:17px">Правила нарахування</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><label class="muted">Points за $1<input id="perDollar" type="number" min="1" max="100"></label><label class="muted">Бонус за штамп<input id="stampBonus" type="number" min="0" max="1000"></label><label class="muted" style="display:flex;align-items:center;gap:10px;margin-top:22px"><input id="enabled" type="checkbox"> Club увімкнено</label></div><button id="save" class="btn" style="width:auto;margin-top:12px">Зберегти правила</button><p class="muted" style="font-size:11px">Зміна потребує Super Admin, 2FA і права settings.manage.</p></section><section class="glass glass-card" style="margin-top:18px"><h2 style="font-size:17px">Учасники</h2><div id="list"><div class="shimmer" style="height:120px"></div></div></section></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>requireAdminAuth();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const res=await adminFetch('/api/admin/engagement'),data=await res.json();if(!res.ok)throw Error(data.error);stats.innerHTML=`<div class="glass stat-card"><div class="num">${data.summary.members}</div><div class="lbl">Учасників</div></div><div class="glass stat-card"><div class="num">${data.summary.pointsInCirculation}</div><div class="lbl">Points у балансах</div></div><div class="glass stat-card"><div class="num">${data.summary.stamps}</div><div class="lbl">Штампів</div></div><div class="glass stat-card"><div class="num">${data.summary.rewards}</div><div class="lbl">Винагород</div></div>`;perDollar.value=data.settings.pointsPerDollar;stampBonus.value=data.settings.stampBonus;enabled.checked=data.settings.enabled!==false;list.innerHTML=data.items.length?data.items.map(item=>`<div class="member"><div><b>${esc(item.displayName||item.email)}</b><span class="muted">${esc(item.email)}</span></div><div><b>${item.points}</b><span class="muted">Points</span></div><div><b>${esc(item.tier)}</b><span class="muted">Рівень</span></div><div><b>${item.countries}</b><span class="muted">Країн</span></div><div><b>${item.rewards}</b><span class="muted">Винагород</span></div></div>`).join(''):'<p class="muted">Учасників ще немає.</p>'}save.onclick=async()=>{const res=await adminFetch('/api/admin/engagement/settings',{method:'PATCH',body:JSON.stringify({enabled:enabled.checked,pointsPerDollar:Number(perDollar.value),stampBonus:Number(stampBonus.value)})}),data=await res.json();if(!res.ok)return alert(data.error);alert('Правила збережено');load()};load().catch(e=>list.innerHTML=`<p class="err-text" style="display:block">${esc(e.message)}</p>`);</script></body></html>
