<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — E7 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand"><div class="mark" style="width:32px;height:32px;font-size:15px;">🛠️</div><span style="font-size:15px;">E7 Admin</span></div>
      <nav class="admin-nav">
        <a href="admin-plan-changes.html">🔄 Зміни тарифів</a>
        <a href="admin-dashboard.html" class="active">📊 Dashboard</a>
        <a href="admin-tickets.html">🎫 Support</a>
        <a href="admin-users.html">👥 Users</a>
        <a href="admin-team.html" id="teamNavLink">🔑 Команда</a>
        <a href="admin-audit.html" id="auditNavLink">🛡️ Audit Log</a>
        <a href="#" onclick="logout()">⎋ Вийти</a>
        <a href="admin-operations.html">⚙️ Операції</a>
      </nav>
    </aside>
    <main class="admin-main">
      <h1 style="font-size:22px;">Dashboard</h1>
      <p class="lead" id="whoami"></p>
      <script>document.getElementById('whoami').textContent = localStorage.getItem('signal_admin_email') + ' · ' + localStorage.getItem('signal_admin_role');</script>

      <div id="loading" class="shimmer" style="height:100px; margin-top:20px;"></div>
      <div class="stat-grid" id="stats" style="display:none;"></div>
      <div id="ops" style="margin-top:22px;"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="admin-common.js"></script>
  <script>
    requireAdminAuth();

    async function load(){
      try{
        const [ticketsRes, usersRes] = await Promise.all([
          adminFetch('/api/admin/tickets'),
          adminFetch('/api/admin/users'),
        ]);
        const tickets = await ticketsRes.json();
        const users = await usersRes.json();

        document.getElementById('loading').style.display = 'none';
        const statsEl = document.getElementById('stats');
        statsEl.style.display = 'grid';

        const open = tickets.filter(t => t.status === 'open').length;
        const inProgress = tickets.filter(t => t.status === 'in_progress').length;
        const activeSubs = users.filter(u => u.subscription?.status === 'active').length;

        statsEl.innerHTML = `
          <div class="glass stat-card"><div class="num">${users.length}</div><div class="lbl">Усього користувачів</div></div>
          <div class="glass stat-card"><div class="num" style="color:var(--success);">${activeSubs}</div><div class="lbl">Активних підписок</div></div>
          <div class="glass stat-card"><div class="num">${tickets.length}</div><div class="lbl">Усього тікетів</div></div>
          <div class="glass stat-card"><div class="num" style="color:var(--blue);">${open}</div><div class="lbl">Відкритих</div></div>
          <div class="glass stat-card"><div class="num" style="color:var(--violet);">${inProgress}</div><div class="lbl">В роботі</div></div>`;
      }catch(e){
        document.getElementById('loading').style.display = 'none';
      }
    }
    async function loadOps(){
      try{
        const res = await adminFetch('/api/admin/dashboard');
        const data = await res.json(); if(!res.ok) return;
        document.getElementById('ops').innerHTML = `
          <div class="glass glass-card"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;">Операційна увага</div>
            <div class="stat-grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));">
              <div class="stat-card"><div class="num">${data.users.registeredToday}</div><div class="lbl">Реєстрацій за 24 год</div></div>
              <div class="stat-card"><div class="num" style="color:var(--danger);">${data.esim.failed}</div><div class="lbl">Помилок eSIM</div></div>
              <div class="stat-card"><div class="num" style="color:#f5a623;">${data.esim.highUsage}</div><div class="lbl">Трафік 80%+</div></div>
              <div class="stat-card"><div class="num" style="color:var(--blue);">${data.tickets.unassigned}</div><div class="lbl">Тікетів без виконавця</div></div>
              <div class="stat-card"><div class="num">${data.esim.expiringSoon}</div><div class="lbl">eSIM завершаться ≤7 днів</div></div>
              <a href="admin-travel.html" class="stat-card" style="color:inherit;text-decoration:none"><div class="num" style="color:#67e8f9">${data.travel?.upcoming14Days||0}</div><div class="lbl">Подорожей ≤14 днів</div></a>
              <a href="admin-travel.html" class="stat-card" style="color:inherit;text-decoration:none"><div class="num" style="color:var(--danger)">${data.travel?.withoutEsim||0}</div><div class="lbl">Подорожей без eSIM</div></a>
              <a href="admin-engagement.html" class="stat-card" style="color:inherit;text-decoration:none"><div class="num" style="color:#a78bfa">${data.engagement?.members||0}</div><div class="lbl">Учасників Signal Club</div></a>
              <a href="admin-rescue.html" class="stat-card" style="color:inherit;text-decoration:none"><div class="num" style="color:#ffd071">${data.rescue?.pending||0}</div><div class="lbl">Запитів порятунку</div></a>
            </div>
            ${data.recentTickets.length ? `<div style="margin-top:16px;">${data.recentTickets.map(ticket => `<a href="admin-ticket.html?id=${ticket.id}" style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--glass-border);color:var(--text);text-decoration:none;font-size:13px;"><span>#${ticket.id} · ${ticket.subject}</span><span class="muted">${ticket.assignedTo || 'не призначено'}</span></a>`).join('')}</div>` : ''}
          </div>`;
      }catch(e){}
    }
    load(); loadOps();
  </script>
</body>
</html>
