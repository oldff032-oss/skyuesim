<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Витрати — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="pwa.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
</head>
<body class="has-bottomnav">
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Сигнал</span></div>
    <h1 style="margin-top:20px;">Витрати трафіку</h1>
    <p class="lead">Скільки даних ти використав(ла) цього циклу</p>

    <div id="loading" class="shimmer" style="height:160px; margin-top:20px;"></div>
    <div id="content" style="display:none;"></div>
  </div>

  <nav class="bottomnav">
    <a href="dashboard.html"><span class="ic">🏠</span>Головна</a>
    <a href="plans.html"><span class="ic">📶</span>Тариф</a>
    <a href="usage.html" class="active"><span class="ic">📊</span>Витрати</a>
    <a href="profile.html"><span class="ic">👤</span>Профіль</a>
  </nav>

  <script src="config.js"></script>
  <script>
    const email = localStorage.getItem('signal_email');
    if(!email){ window.location.href = 'login.html'; }

    function providerDate(value){
      if(value == null || value === '') return null;
      const numeric = Number(value);
      const date = Number.isFinite(numeric) && String(value).trim() !== ''
        ? new Date(numeric < 1e11 ? numeric * 1000 : numeric)
        : new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatGb(value){
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toLocaleString('uk-UA', { maximumFractionDigits: 2 })} ГБ` : '—';
    }

    async function load(){
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');
      try{
        const res = await fetch(`${API_URL}/api/status?email=${encodeURIComponent(email)}`);
        const data = await res.json();
        loading.style.display = 'none';
        content.style.display = 'block';

        if(data.status !== 'active' || !data.esim){
          content.innerHTML = `<div class="card"><p class="muted">Немає активної підписки. <a href="plans.html" style="color:var(--cyan);">Обрати тариф</a></p></div>`;
          return;
        }

        const limitGb = data.esim.dataLimitGb;
        let usedGb = data.esim.usedGb || 0;
        let apn = data.esim.apn;
        let expiredTime = data.esim.expiredTime;
        let activateTime = data.esim.activateTime;
        let remainingGb = data.esim.remainingGb ?? (limitGb == null ? null : Math.max(0, limitGb - usedGb));
        let lastUpdateTime = data.esim.lastUpdateTime;

        // Тягнемо СВІЖІ дані використання з eSIM Access (не з кешу)
        try{
          const usageRes = await fetch(`${API_URL}/api/usage?email=${encodeURIComponent(email)}`);
          const usageData = await usageRes.json();
          if(usageRes.ok){
            usedGb = usageData.usedGb;
            remainingGb = usageData.remainingGb;
            apn = usageData.apn || apn;
            expiredTime = usageData.expiredTime || expiredTime;
            activateTime = usageData.activateTime || activateTime;
            lastUpdateTime = usageData.lastUpdateTime || lastUpdateTime;
          }
        }catch(e){ /* якщо не вдалось оновити — показуємо останнє відоме значення */ }

        const pct = limitGb ? Math.min(100, Math.round((usedGb / limitGb) * 100)) : 0;
        const isLow = limitGb && pct >= 80;

        // Дні до закінчення eSIM
        let daysLeftHtml = '';
        const expiresAt = providerDate(expiredTime);
        if(expiresAt){
          const daysLeft = Math.ceil((expiresAt - new Date()) / 86400000);
          daysLeftHtml = daysLeft >= 0
            ? `<div class="card"><div style="display:flex; justify-content:space-between; align-items:center;"><span class="muted">Днів до закінчення eSIM</span><b style="font-family:'Space Mono',monospace;">${daysLeft}</b></div></div>`
            : `<div class="card"><span class="status-pill off"><span class="dot"></span>Термін дії eSIM завершився</span></div>`;
        }

        // Прогноз закінчення трафіку за поточним темпом
        let forecastHtml = '';
        if(limitGb && usedGb > 0 && activateTime){
          const daysSinceActivation = Math.max(1, (Date.now() - new Date(activateTime).getTime()) / 86400000);
          const dailyAvg = usedGb / daysSinceActivation;
          if(dailyAvg > 0){
            const remainingGb = Math.max(0, limitGb - usedGb);
            const daysUntilOut = remainingGb / dailyAvg;
            const projectedDate = new Date(Date.now() + daysUntilOut * 86400000);
            const dateStr = projectedDate.toLocaleDateString('uk-UA', { day:'numeric', month:'long' });
            forecastHtml = `<div class="card"><p class="muted">При такому темпі використання (~${dailyAvg.toFixed(2)} ГБ/день) трафіку вистачить приблизно до <b style="color:var(--text);">${dateStr}</b>.</p></div>`;
          }
        } else if(limitGb) {
          forecastHtml = `<div class="card"><p class="muted">Прогноз з'явиться, коли назбирається трохи даних про використання.</p></div>`;
        }

        content.innerHTML = `
          ${isLow ? `<div class="card" style="border-color:var(--danger);"><p style="color:var(--danger); font-size:13px; display:flex; align-items:center; gap:8px;">⚠️ Використано понад 80% трафіку тарифу</p></div>` : ''}

          <div class="card">
            <div class="usage-top"><span>Використано</span><b>${limitGb ? `${formatGb(usedGb)} / ${formatGb(limitGb)}` : 'Безліміт'}</b></div>
            ${limitGb ? `<div class="usage-track"><div class="usage-fill" style="width:${pct}%; ${isLow ? 'background:linear-gradient(90deg,#f5a623,var(--danger));' : ''}"></div></div>` : ''}
            ${remainingGb != null ? `<p class="muted" style="margin-top:12px;">Залишилось: <b style="color:var(--text);">${formatGb(remainingGb)}</b></p>` : ''}
            ${apn ? `<p class="muted" style="margin-top:14px;">📡 Мережа: <span style="color:var(--text);">${apn}</span></p>` : ''}
            <p class="muted" style="margin-top:8px;font-size:11px;">${lastUpdateTime ? `Дані оновлено: ${providerDate(lastUpdateTime)?.toLocaleString('uk-UA') || '—'}` : 'Дані оновлюються провайдером протягом кількох годин.'}</p>
          </div>

          ${daysLeftHtml}
          <div id="billingCard" class="card"><p class="muted">Завантажуємо дату списання...</p></div>
          ${forecastHtml}`;

        // Дата наступного списання — окремий запит до Stripe
        try{
          const billingRes = await fetch(`${API_URL}/api/billing?email=${encodeURIComponent(email)}`);
          const billingData = await billingRes.json();
          const billingCard = document.getElementById('billingCard');
          if(billingRes.ok && billingData.nextBillingDate){
            const d = new Date(billingData.nextBillingDate).toLocaleDateString('uk-UA', { day:'numeric', month:'long', year:'numeric' });
            billingCard.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;"><span class="muted">Наступне списання</span><b>${d}</b></div>`;
          } else {
            billingCard.remove();
          }
        }catch(e){ document.getElementById('billingCard')?.remove(); }
      }catch(e){
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = `<div class="card"><p class="err-text">Не вдалося завантажити дані</p></div>`;
      }
    }
    load();
  </script>
</body>
</html>
