<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>eSIM для близьких — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><script src="pwa.js"></script><style>.family-card{padding:20px;margin-top:15px}.family-top{display:flex;justify-content:space-between;gap:12px}.family-badge{font-size:10px;padding:5px 9px;border-radius:999px;background:rgba(52,228,184,.12);color:var(--success)}.family-qr{width:174px;height:174px;object-fit:contain;background:#fff;padding:9px;border-radius:15px;display:block;margin:18px auto}.family-code{display:block;padding:11px;border-radius:11px;background:#070917;border:1px solid var(--border);font-size:10.5px;line-height:1.5;word-break:break-all}.family-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}@media(max-width:430px){.family-actions{grid-template-columns:1fr}}</style></head><body class="has-bottomnav"><main class="wrap"><div class="brand"><div class="mark">👨‍👩‍👧</div><span>Signal</span></div><h1 style="margin-top:22px">eSIM для близьких</h1><p class="lead">Окремі eSIM, які ви придбали для друзів або сім’ї. Ваша власна eSIM не змінюється.</p><a class="btn" href="travel-plans.html" style="margin-top:18px">+ Купити для близької людини</a><div id="content" style="margin-top:18px"><div class="shimmer" style="height:180px"></div></div></main><nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html"><span class="nav-icon"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html"><span class="nav-icon"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html"><span class="nav-icon"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html" class="active"><span class="nav-icon"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav><script src="config.js"></script><script src="offline-esim.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=new Map();
function card(item){return `<article class="glass family-card"><div class="family-top"><div><div class="muted" style="font-size:10px;letter-spacing:1px">ДЛЯ ${esc(String(item.recipientName||'БЛИЗЬКОЇ ЛЮДИНИ').toUpperCase())}</div><h2 style="font-size:20px;margin-top:5px">${esc(item.packageName)}</h2><p class="muted" style="font-size:11px;margin-top:4px">${esc(item.location||'Подорож')} ${item.durationDays?`· ${item.durationDays} днів`:''}</p></div><span class="family-badge">Готова</span></div>${item.esim.qrCodeUrl?`<img class="family-qr" src="${esc(item.esim.qrCodeUrl)}" alt="QR-код eSIM">`:'<p class="muted" style="margin-top:15px">QR тимчасово недоступний — скористайтеся кодом.</p>'}${item.esim.activationCode?`<p class="muted">Код активації</p><code class="family-code">${esc(item.esim.activationCode)}</code>`:''}${item.esim.apn?`<p class="muted" style="margin-top:12px">APN: <b style="color:var(--text)">${esc(item.esim.apn)}</b></p>`:''}<div class="family-actions"><button class="btn ghost" onclick="copyCode('${esc(item.id)}')">Скопіювати код</button><button class="btn" onclick="saveOffline('${esc(item.id)}')">Зберегти офлайн</button></div><p class="muted" style="font-size:10.5px;line-height:1.45;margin-top:12px">Покажіть QR одержувачу особисто. Не публікуйте його та не надсилайте незнайомим людям.</p></article>`}
async function load(){try{const response=await fetch(`${API_URL}/api/account/family-esims`,{headers:{'x-session-token':token}}),data=await response.json();if(!response.ok)throw new Error(data.error);items=new Map(data.items.map(item=>[item.id,item]));content.innerHTML=data.items.length?data.items.map(card).join(''):'<div class="glass family-card"><h2 style="font-size:18px">Поки порожньо</h2><p class="muted" style="margin-top:7px">Придбайте туристичний пакет і виберіть «Для близьких».</p></div>'}catch(e){content.innerHTML=`<div class="err-text" style="display:flex">${esc(e.message)}</div>`}}function copyCode(id){const value=items.get(id)?.esim?.activationCode;if(!value)return alert('Код поки недоступний');navigator.clipboard?.writeText(value).then(()=>alert('Код скопійовано')).catch(()=>prompt('Скопіюйте код:',value))}
async function saveOffline(id){const item=items.get(id);if(!item)return;const first=!SignalOfflineEsimVault.exists(),pin=prompt(first?'Створіть окремий 6-значний PIN для офлайн-карток:':'Введіть PIN офлайн-карток:');if(!pin)return;if(!/^\d{6}$/.test(pin))return alert('PIN має містити 6 цифр.');if(first){const repeat=prompt('Повторіть офлайн-PIN:');if(repeat!==pin)return alert('PIN-коди не збігаються.')}try{await SignalOfflineEsimVault.saveCard({id:`family:${item.id}`,ownerLabel:`Для ${item.recipientName}`,packageName:item.packageName,location:item.location,...item.esim},pin);alert('Зашифровану картку збережено. Вона працюватиме без інтернету.')}catch(e){alert(e.message)}}load();
</script></body></html>
