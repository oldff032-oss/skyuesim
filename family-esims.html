<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>eSIM для близьких — Signal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <script src="pwa.js"></script>
  <style>
    .family-card{padding:20px;margin-top:15px;overflow:hidden}.family-top{display:flex;justify-content:space-between;gap:12px}.family-badge{height:max-content;font-size:10px;padding:5px 9px;border-radius:999px;background:rgba(52,228,184,.12);color:var(--success)}
    .family-qr{width:174px;height:174px;object-fit:contain;background:#fff;padding:9px;border-radius:15px;display:block;margin:18px auto;box-shadow:0 0 32px rgba(61,213,255,.18)}.family-code{display:block;padding:11px;border-radius:11px;background:#070917;border:1px solid var(--border);font-size:10.5px;line-height:1.5;word-break:break-all}
    .family-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.family-guide{display:none;margin-top:16px;padding:15px;border:1px solid rgba(91,198,255,.26);border-radius:16px;background:linear-gradient(145deg,rgba(29,75,126,.16),rgba(82,44,135,.13))}.family-guide.open{display:block;animation:guideIn .35s ease both}.guide-step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}.guide-step:last-child{border:0}.guide-no{width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,#2c8cff,#835cff);font-size:11px;font-weight:800}.guide-step b{display:block;font-size:12.5px}.guide-step span span{display:block;color:var(--text-muted);font-size:11px;line-height:1.5;margin-top:3px}.privacy-note{font-size:10.5px;line-height:1.45;margin-top:12px;padding:10px;border-radius:12px;background:rgba(245,166,35,.08);color:#c8b98e}
    @keyframes guideIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}@media(max-width:430px){.family-actions{grid-template-columns:1fr}.family-card{padding:17px}}
  </style>
</head>
<body class="has-bottomnav">
  <main class="wrap">
    <div class="brand"><div class="mark">👨‍👩‍👧</div><span>Signal</span></div>
    <h1 style="margin-top:22px">eSIM для близьких</h1>
    <p class="lead">Окремі eSIM, які ви придбали для друзів або сім’ї. Ваша власна eSIM не змінюється.</p>
    <a class="btn" href="travel-plans.html" style="margin-top:18px">+ Купити для близької людини</a>
    <div id="content" style="margin-top:18px"><div class="shimmer" style="height:180px"></div></div>
  </main>
  <nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html"><span class="nav-icon"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html"><span class="nav-icon"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html"><span class="nav-icon"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html" class="active"><span class="nav-icon"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav>
  <script src="config.js"></script>
  <script src="offline-esim.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const isAppleMobile=/iPhone|iPad|iPod/i.test(navigator.userAgent);let items=new Map();
    function guide(item){return `<div id="guide-${esc(item.id)}" class="family-guide"><h3 style="font-size:15px">Як ${esc(item.recipientName||'одержувачу')} встановити eSIM</h3><div class="guide-step"><i class="guide-no">1</i><span><b>Відкрийте QR на вашому телефоні</b><span>Людина, для якої придбано eSIM, відкриває на своєму телефоні «Налаштування → Мобільний зв’язок/SIM → Додати eSIM» і сканує цей QR.</span></span></div><div class="guide-step"><i class="guide-no">2</i><span><b>Якщо картку відкрито на телефоні одержувача</b><span>${isAppleMobile?'Натисніть «Встановити на цьому iPhone» нижче.':'Скопіюйте код активації, відкрийте додавання eSIM вручну та вставте код.'}</span></span></div><div class="guide-step"><i class="guide-no">3</i><span><b>Увімкніть лінію та мобільні дані</b><span>Оберіть нову eSIM для мобільного інтернету й увімкніть «Роумінг даних».</span></span></div><div class="guide-step"><i class="guide-no">4</i><span><b>Перевірте APN</b><span>${item.esim.apn?`APN: ${esc(item.esim.apn)}.`:'APN має встановитися автоматично.'} Вимкніть Wi‑Fi та відкрийте будь-який сайт.</span></span></div></div>`}
    function card(item){const installUrl=item.esim.activationCode?`https://esimsetup.apple.com/esim_qrcode_provisioning?carddata=${encodeURIComponent(item.esim.activationCode)}`:'',shareState=item.share?.installedAt?'Одержувач підтвердив встановлення ✓':item.share?.viewedAt?'Посилання відкрито одержувачем':item.share?.active?'Захищене посилання створено':'';return `<article class="glass family-card"><div class="family-top"><div><div class="muted" style="font-size:10px;letter-spacing:1px">ДЛЯ ${esc(String(item.recipientName||'БЛИЗЬКОЇ ЛЮДИНИ').toUpperCase())}</div><h2 style="font-size:20px;margin-top:5px">${esc(item.packageName)}</h2><p class="muted" style="font-size:11px;margin-top:4px">${esc(item.location||'Подорож')} ${item.durationDays?`· ${item.durationDays} днів`:''}</p></div><span class="family-badge">Готова</span></div>${item.esim.qrCodeUrl?`<img class="family-qr" src="${esc(item.esim.qrCodeUrl)}" alt="QR-код eSIM">`:'<p class="muted" style="margin-top:15px">QR тимчасово недоступний — скористайтеся кодом.</p>'}${item.esim.activationCode?`<p class="muted">Код активації</p><code class="family-code">${esc(item.esim.activationCode)}</code>`:''}${item.esim.apn?`<p class="muted" style="margin-top:12px">APN: <b style="color:var(--text)">${esc(item.esim.apn)}</b></p>`:''}${shareState?`<p class="notice" style="margin-top:12px">${esc(shareState)}</p>`:''}<div class="family-actions"><button class="btn" onclick="toggleGuide('${esc(item.id)}')">Як встановити</button>${isAppleMobile&&installUrl?`<a class="btn ghost" href="${installUrl}">Встановити на цьому iPhone</a>`:`<button class="btn ghost" onclick="copyCode('${esc(item.id)}')">Скопіювати код</button>`}<button class="btn ghost" onclick="createShareLink('${esc(item.id)}')">Захищене посилання</button><button class="btn ghost" onclick="saveOffline('${esc(item.id)}')">Зберегти офлайн</button></div>${guide(item)}<p class="privacy-note">🔐 Захищене посилання діє 7 днів. Створення нового посилання автоматично робить попереднє недійсним.</p></article>`}
    async function load(){try{const response=await fetch(`${API_URL}/api/account/family-esims`,{headers:{'x-session-token':token}}),data=await response.json();if(!response.ok)throw new Error(data.error);items=new Map(data.items.map(item=>[item.id,item]));content.innerHTML=data.items.length?data.items.map(card).join(''):'<div class="glass family-card"><h2 style="font-size:18px">Поки порожньо</h2><p class="muted" style="margin-top:7px">Придбайте туристичний пакет і виберіть «Для близьких».</p></div>'}catch(e){content.innerHTML=`<div class="err-text" style="display:flex">${esc(e.message)}</div>`}}
    function toggleGuide(id){const guide=document.getElementById(`guide-${id}`);guide?.classList.toggle('open');guide?.scrollIntoView({behavior:'smooth',block:'nearest'})}
    function copyCode(id){const value=items.get(id)?.esim?.activationCode;if(!value)return alert('Код поки недоступний');navigator.clipboard?.writeText(value).then(()=>alert('Код скопійовано')).catch(()=>prompt('Скопіюйте код:',value))}
    async function createShareLink(id){const item=items.get(id);if(!item?.esim?.activationCode&&!item?.esim?.qrCodeUrl)return alert('Дані встановлення поки недоступні');if(!confirm('Створити приватне посилання на 7 днів? Попереднє посилання для цієї eSIM перестане працювати.'))return;try{const response=await fetch(`${API_URL}/api/account/family-esims/${encodeURIComponent(id)}/share`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({days:7})}),data=await response.json();if(!response.ok)throw new Error(data.error);const text=`Signal eSIM для ${item.recipientName}. Відкрийте приватне посилання та виконайте інструкцію: ${data.url}`;if(navigator.share){try{await navigator.share({title:'Ваша Signal eSIM',text,url:data.url});await load();return}catch(error){if(error.name==='AbortError')return}}await navigator.clipboard.writeText(data.url);alert('Захищене посилання скопійовано.');await load()}catch(error){alert(error.message)}}
    async function saveOffline(id){const item=items.get(id);if(!item)return;const first=!SignalOfflineEsimVault.exists(),pin=prompt(first?'Створіть окремий 6-значний PIN для офлайн-карток:':'Введіть PIN офлайн-карток:');if(!pin)return;if(!/^\d{6}$/.test(pin))return alert('PIN має містити 6 цифр.');if(first){const repeat=prompt('Повторіть офлайн-PIN:');if(repeat!==pin)return alert('PIN-коди не збігаються.')}try{const saved=await SignalOfflineEsimVault.saveCard({id:`family:${item.id}`,ownerLabel:`Для ${item.recipientName}`,packageName:item.packageName,location:item.location,...item.esim,qrDownloadUrl:`${API_URL}/api/account/esim/qr-image?scope=family&id=${encodeURIComponent(item.id)}`,qrAuthToken:token},pin);alert(saved.qrDataUrl?'Зашифровану картку разом із QR-кодом збережено офлайн.':'Картку збережено, але оператор не передав QR. Код і APN доступні офлайн.')}catch(e){alert(e.message)}}
    load();
  </script>
</body>
</html>
