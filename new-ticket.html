<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нове звернення — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
<script src="pwa.js"></script>
<style>
  select{
    width:100%; background: rgba(255,255,255,0.04); border:1.5px solid var(--border); border-radius:14px;
    padding:15px 16px; color:var(--text); font-family:'Inter',sans-serif; font-size:15px; appearance:none;
  }
  textarea{
    width:100%; background: rgba(255,255,255,0.04); border:1.5px solid var(--border); border-radius:14px;
    padding:15px 16px; color:var(--text); font-family:'Inter',sans-serif; font-size:15px; min-height:120px; resize:vertical;
  }
  textarea:focus, select:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 4px rgba(59,130,246,0.15); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Сигнал</span></div>
    <h1 style="margin-top:20px;">Нове звернення</h1>
    <p class="lead">Опиши проблему — ми відповімо на email</p>

    <div class="field-group">
      <label class="field-label">Категорія</label>
      <select id="category">
        <option>eSIM не активується</option>
        <option>Немає інтернету</option>
        <option>Оплата / пакет не активувався</option>
        <option>Питання про підписку</option>
        <option>Інше</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Тема</label>
      <input type="text" id="subject" placeholder="Коротко опиши проблему" />
    </div>

    <div class="field-group">
      <label class="field-label">Опис</label>
      <textarea id="message" placeholder="Детальніше — що сталося, коли, на якому пристрої..."></textarea>
    </div>

    <div class="field-group">
      <label class="field-label">Скріншот або файл (необов'язково)</label>
      <input type="file" id="attachment" accept="image/*,.pdf" style="width:100%; background:rgba(255,255,255,0.04); border:1.5px solid var(--border); border-radius:14px; padding:12px 14px; color:var(--text-muted); font-size:13px;" />
      <p class="hint-text">Максимум 550 КБ, PNG/JPG/WEBP або PDF</p>
    </div>

    <div class="err-text" id="err" style="display:none;"></div>

    <button class="btn" id="sendBtn" style="margin-top:22px;" onclick="submitTicket()">Надіслати звернення</button>
    <a class="btn ghost" href="support.html" style="margin-top:10px;">Скасувати</a>
  </div>

  <script src="config.js"></script>
  <script>
    const email = localStorage.getItem('signal_email');
    const sessionToken = localStorage.getItem('signal_session_token');
    if(!email||!sessionToken){ window.location.href = 'login.html'; }

    function fileToAttachment(file){
      return new Promise((resolve, reject) => {
        if(!file) return resolve(null);
        if(file.size > 550 * 1024){ reject(new Error('Файл завеликий (максимум 550 КБ)')); return; }
        const reader = new FileReader();
        reader.onload = () => resolve({ name: file.name, type: file.type, dataUrl: reader.result });
        reader.onerror = () => reject(new Error('Не вдалося прочитати файл'));
        reader.readAsDataURL(file);
      });
    }

    async function submitTicket(){
      const category = document.getElementById('category').value;
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();
      const fileInput = document.getElementById('attachment');
      const err = document.getElementById('err');
      const btn = document.getElementById('sendBtn');
      err.style.display = 'none';

      if(!subject || !message){
        err.textContent = 'Заповни тему й опис проблеми';
        err.style.display = 'flex';
        return;
      }

      btn.classList.add('loading');
      btn.textContent = 'Надсилаємо...';

      try{
        const attachment = await fileToAttachment(fileInput.files[0]);
        const res = await fetch(`${API_URL}/api/support/tickets`, {
          method:'POST', headers:{'Content-Type':'application/json','x-session-token':sessionToken},
          body: JSON.stringify({ category, subject, message, attachment })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Помилка сервера');
        window.location.href = `ticket.html?id=${data.id}`;
      }catch(e){
        err.textContent = e.message;
        err.style.display = 'flex';
        btn.classList.remove('loading');
        btn.textContent = 'Надіслати звернення';
      }
    }
  </script>
</body>
</html>
