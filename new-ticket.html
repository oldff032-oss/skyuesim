<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Нове звернення — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#05060d"><style>
.head{display:flex;align-items:center;gap:12px}.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);text-decoration:none;font-size:20px}.form-card{padding:20px;margin-top:18px}.form-card select,.form-card textarea,.file{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:14px;padding:14px 15px;color:var(--text);font:inherit}.form-card textarea{min-height:140px;resize:vertical}.form-card select:focus,.form-card textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #3b82f626}.privacy{display:flex;gap:9px;padding:12px;border-radius:12px;background:#4f75ff12;color:var(--text-muted);font-size:11.5px;line-height:1.55;margin-top:16px}@media(max-width:380px){.form-card{padding:16px}}
</style></head><body><div class="wrap"><div class="head"><a class="back" href="support.html">←</a><div class="brand" style="margin:0"><div class="mark">S</div><span>Signal</span></div></div><h1 style="margin-top:22px">Нове звернення</h1><p class="lead">Опишіть проблему якомога точніше — це допоможе відповісти швидше.</p><section class="glass form-card"><div class="field-group"><label class="field-label">Категорія</label><select id="category"><option>eSIM не активується</option><option>Немає інтернету</option><option>Оплата або пакет не активувався</option><option>Питання про підписку</option><option>Інше</option></select></div><div class="field-group"><label class="field-label">Тема</label><input id="subject" maxlength="140" placeholder="Коротко опишіть проблему"></div><div class="field-group"><label class="field-label">Що сталося?</label><textarea id="message" maxlength="5000" placeholder="Напишіть, коли виникла проблема, що ви натискали та яке повідомлення побачили…"></textarea></div><div class="field-group"><label class="field-label">Скриншот або PDF <span class="muted">(необов’язково)</span></label><input class="file" type="file" id="attachment" accept="image/png,image/jpeg,image/webp,application/pdf"><p class="hint-text">PNG, JPG, WEBP або PDF до 550 КБ</p></div><div class="err-text" id="err" style="display:none;margin-top:14px"></div><button class="btn" id="sendBtn" style="margin-top:18px" onclick="submitTicket()">Надіслати звернення</button></section></div><script src="config.js"></script><script src="pwa.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';function deviceModel(){const ua=navigator.userAgent||'',android=ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build\/|;|\))/i);if(android)return android[1].trim().slice(0,100);if(/iPhone/i.test(ua))return'iPhone';if(/iPad/i.test(ua))return'iPad';return String(navigator.userAgentData?.platform||navigator.platform||'Не визначено').slice(0,100)}function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>550*1024)return reject(new Error('Файл завеликий — максимум 550 КБ.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,dataUrl:reader.result});reader.onerror=()=>reject(new Error('Не вдалося прочитати файл.'));reader.readAsDataURL(file)})}async function submitTicket(){const category=document.getElementById('category').value,subject=document.getElementById('subject').value.trim(),message=document.getElementById('message').value.trim(),error=document.getElementById('err'),button=document.getElementById('sendBtn');error.style.display='none';if(!subject||!message){error.textContent='Заповніть тему й опис проблеми.';error.style.display='flex';return}button.disabled=true;button.textContent='Надсилаємо…';try{const attachment=await fileData(document.getElementById('attachment').files[0]),diagnostics={deviceModel:deviceModel(),appVersion:window.SIGNAL_APP_VERSION||'unknown',platform:navigator.standalone?'ios-pwa':matchMedia('(display-mode: standalone)').matches?'pwa':'web'};const response=await fetch(`${API_URL}/api/support/tickets`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({category,subject,message,attachment,diagnostics})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Помилка сервера');location.href=`ticket.html?id=${encodeURIComponent(data.id)}`}catch(e){error.textContent=e.message;error.style.display='flex';button.disabled=false;button.textContent='Надіслати звернення'}}
</script></body></html>
