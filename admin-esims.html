<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Облік eSIM — Signal Admin</title><link rel="stylesheet" href="style.css"><style>header{display:flex;justify-content:space-between;gap:20px;align-items:center}.inventory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin:24px 0}.sim-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}.sim-card h2{font-size:18px}.sim-card p{overflow-wrap:anywhere;line-height:1.7}.sim-card .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions button{padding:9px;border:1px solid var(--border);border-radius:8px;cursor:pointer}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.filters input,.filters select{padding:12px;max-width:100%}dialog{max-width:480px;width:90%;background:#132033;color:white;border:1px solid #657da4;border-radius:18px;padding:25px}dialog label{display:block;margin:16px 0}dialog input,dialog select{display:block;width:100%;padding:10px}#error{color:#ffaeae;white-space:pre-wrap}small{color:var(--text-muted)}</style>
<div class="admin-shell"><aside class="admin-sidebar"><div class="brand">Signal Admin</div><nav class="admin-nav"></nav></aside><main class="admin-main"><header><div><h1>Облік eSIM</h1><p>Куплені картки, встановлення та прив’язки</p></div><button id="refresh">Оновити з провайдера</button></header><p>Відкликання припиняє послугу. Запис eSIM у налаштуваннях телефона видаляє користувач. Чинна платна підписка керується окремо в оплатах.</p><div class="filters"><input id="search" placeholder="ICCID, пакет або email" aria-label="Пошук"><select id="filter" aria-label="Фільтр"><option value="all">Усі на сторінці</option><option value="free">Вільні для встановлення</option><option value="assigned">Прив’язані</option><option value="used">Встановлені / використані</option></select></div><p id="error" role="status"></p><small id="checked"></small><div id="cards" class="inventory-grid"></div><button id="prev">Попередня</button> <span id="page"></span> <button id="next">Наступна</button></main></div>
<dialog id="confirm"><h2 id="actionTitle"></h2><p id="explanation"></p><label id="customerWrap">Користувач<select id="customer"></select></label><label>Введіть ICCID для підтвердження<input id="confirmation" autocomplete="off"></label><button id="back">Скасувати</button> <button id="submit">Підтвердити дію</button></dialog>
<script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=1,data={items:[],customers:[]},pending=null,busy=false;
const labels={assign:'Призначити наявну eSIM',suspend:'Призупинити інтернет',unsuspend:'Відновити інтернет',revoke:'Остаточно відкликати',cancel:'Скасувати невикористану'};
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;$('cards').innerHTML=data.items.filter(x=>JSON.stringify([x.iccid,x.packageName,x.owners]).toLowerCase().includes(q)).filter(x=>f==='all'||f==='free'&&x.canInstall&&!x.owners.length||f==='assigned'&&x.owners.length||f==='used'&&x.installedBefore).map(x=>`<article class="sim-card"><small>${esc(x.providerStatus)} · ${esc(x.installationStatus)}</small><h2>${esc(x.packageName||'eSIM')}</h2><p>ICCID: ${esc(x.iccid)}<br>Трафік: ${esc(x.usedGb)} / ${esc(x.dataLimitGb)} ГБ<br>Діє до: ${esc(x.expiredTime)}</p><p>${x.owners.length?x.owners.map(o=>esc(o.email)+' · '+esc(o.kind)).join('<br>'):'Немає прив’язки в застосунку'}</p><small>${x.canInstall?'Готова до першого встановлення':'Не підтверджено придатність для нового встановлення'}</small><div class="actions">${(x.canInstall&&!x.owners.length?['assign','cancel']:['suspend','unsuspend','revoke']).map(a=>`<button data-iccid="${esc(x.iccid)}" data-action="${a}">${labels[a]}</button>`).join('')}</div></article>`).join('')||'<p>Немає карток за цим фільтром на поточній сторінці.</p>';$('page').textContent='Сторінка '+page;$('prev').disabled=page<=1||busy;$('next').disabled=busy||data.items.length<50;}
async function load(){busy=true;$('refresh').disabled=true;$('error').textContent='Завантаження…';try{const r=await adminFetch('/api/admin/esim-inventory?page='+page),d=await r.json();if(!r.ok)throw Error(d.error);data=d;$('checked').textContent='Перевірено: '+new Date(d.checkedAt).toLocaleString('uk-UA');$('error').textContent='';}catch(e){data.items=[];$('error').textContent=e.message;}finally{busy=false;$('refresh').disabled=false;render();}}
$('cards').onclick=e=>{const b=e.target.closest('button[data-action]');if(!b||busy)return;pending={iccid:b.dataset.iccid,action:b.dataset.action};$('actionTitle').textContent=labels[pending.action];$('explanation').textContent=pending.action==='assign'?'Буде прив’язана вже куплена вільна картка. Користувач має бути без поточної eSIM і платної підписки.':pending.action==='revoke'?'Послугу буде остаточно припинено без повернення коштів. Це не видаляє запис із телефона.':'Операція змінить послугу у провайдера. Статус буде перевірено після запиту.';$('customerWrap').hidden=pending.action!=='assign';$('customer').innerHTML='<option value="">Оберіть користувача</option>'+data.customers.map(email=>`<option>${esc(email)}</option>`).join('');$('confirmation').value='';$('confirm').showModal();};
$('submit').onclick=async()=>{if(!pending||busy)return;if($('confirmation').value!==pending.iccid)return alert('ICCID не збігається');if(pending.action==='assign'&&!$('customer').value)return alert('Оберіть користувача');busy=true;$('submit').disabled=true;try{const r=await adminFetch('/api/admin/esim-inventory/'+encodeURIComponent(pending.iccid)+'/'+pending.action,{method:'POST',body:JSON.stringify({confirmation:$('confirmation').value,email:$('customer').value})}),d=await r.json();if(!r.ok)throw Error(d.error);$('confirm').close();await load();$('error').textContent=d.message;}catch(e){$('confirm').close();$('error').textContent=e.message;}finally{busy=false;$('submit').disabled=false;}};
$('back').onclick=()=>$('confirm').close();$('refresh').onclick=load;$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('search').oninput=render;$('filter').onchange=render;load();
</script></html>
