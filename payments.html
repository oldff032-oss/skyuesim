<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплати й підписка — Signal</title><link rel="stylesheet" href="style.css"><script src="pwa.js"></script><style>.receipt{padding:16px;margin-top:12px}.head{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style></head><body class="has-bottomnav"><main class="wrap"><div class="brand"><div class="mark">S</div><span>Signal</span></div><h1 style="margin-top:22px">Оплати й підписка</h1><p class="lead">Чеки, картка, поновлення та скасування в одному місці.</p><button id="portal" class="btn" style="margin-top:18px">Керувати карткою та підпискою</button><div id="message" class="muted" style="margin-top:10px"></div><section id="list" style="margin-top:16px"><div class="shimmer" style="height:160px"></div></section></main><nav class="bottomnav"><a href="dashboard.html">Головна</a><a href="plans.html">Тарифи</a><a href="usage.html">Моя eSIM</a><a href="profile.html">Профіль</a></nav><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
portal.onclick=async()=>{portal.disabled=true;message.textContent='Відкриваємо захищену сторінку Stripe…';try{const response=await fetch(`${API_URL}/api/billing/portal`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:'{}'}),data=await response.json();if(!response.ok)throw new Error(data.error);location.href=data.url}catch(error){message.textContent=error.message;portal.disabled=false}};
(async()=>{try{const response=await fetch(`${API_URL}/api/account/billing-history`,{headers:{'x-session-token':token}}),data=await response.json();if(!response.ok)throw new Error(data.error);list.innerHTML=data.invoices.length?data.invoices.map(item=>`<article class="glass receipt"><div class="head"><div><b>${esc(item.name||'Оплата Signal')}</b><div class="muted">${new Date(item.createdAt).toLocaleString('uk-UA')} · № ${esc(item.id)}</div></div><b>${Number(item.amount||0).toFixed(2)} ${esc(String(item.currency||'').toUpperCase())}</b></div><div class="actions">${item.receiptUrl?`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(item.receiptUrl)}">Відкрити чек</a>`:''}${item.fulfillmentStatus==='failed'?'<a class="btn" href="new-ticket.html">Потрібна допомога</a>':''}</div></article>`).join(''):'<div class="glass receipt"><p class="muted">Оплат ще немає.</p></div>'}catch(error){list.innerHTML=`<div class="glass receipt"><p class="err-text">${esc(error.message)}</p></div>`}})();
</script></body></html>
