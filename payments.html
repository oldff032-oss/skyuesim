<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Історія оплат — Сигнал</title><link rel="stylesheet" href="style.css"><script src="pwa.js"></script><style>.row{padding:14px 0;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;gap:12px}.row:last-child{border:0}</style></head><body class="has-bottomnav"><div class="wrap"><div class="brand"><div class="mark">📶</div><span>Сигнал</span></div><h1 style="margin-top:20px">Історія оплат</h1><p class="lead">Квитанції та статус твоїх платежів Stripe</p><div class="glass" id="list" style="margin-top:20px;padding:0 16px"><p class="muted" style="padding:16px 0">Завантаження...</p></div></div><nav class="bottomnav"><a href="dashboard.html">🏠 Головна</a><a href="plans.html">📶 Тариф</a><a href="usage.html">📊 Витрати</a><a href="profile.html" class="active">👤 Профіль</a></nav><script src="config.js"></script><script>const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';(async()=>{const box=document.getElementById('list');try{const r=await fetch(`${API_URL}/api/account/billing-history`,{headers:{'x-session-token':token}}),d=await r.json();if(!r.ok)throw Error(d.error);box.innerHTML=d.invoices.length?d.invoices.map(i=>`<div class="row"><div><b>${new Date(i.createdAt).toLocaleDateString('uk-UA')}</b><div class="muted" style="font-size:12px;margin-top:4px">${i.status}</div></div><div style="text-align:right"><b>${i.amount.toFixed(2)} ${i.currency.toUpperCase()}</b>${i.receiptUrl?`<a href="${i.receiptUrl}" target="_blank" style="display:block;color:var(--cyan);font-size:12px;margin-top:4px">Квитанція</a>`:''}</div></div>`).join(''):'<p class="muted" style="padding:16px 0">Оплат ще немає.</p>'}catch(e){box.innerHTML=`<p class="err-text" style="padding:16px 0">${e.message}</p>`}})()</script></body></html>
