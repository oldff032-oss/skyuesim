<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Чеки та оплати — Сигнал</title><link rel="stylesheet" href="style.css"><script src="pwa.js"></script><style>.receipt{box-sizing:border-box;max-width:100%;padding:18px;margin-bottom:12px;overflow:hidden}.receipt-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}.receipt-head>div:first-child{min-width:0}.receipt-name{font-weight:700;font-size:15px;overflow-wrap:anywhere}.amount{font-weight:800;white-space:nowrap;text-align:right}.meta{font-size:12px;color:var(--text-muted);line-height:1.6;margin-top:7px;overflow-wrap:anywhere;word-break:break-word}.status{display:inline-block;max-width:100%;box-sizing:border-box;margin-top:10px;padding:5px 9px;border-radius:999px;background:rgba(46,204,113,.12);color:#55d98b;font-size:11px;font-weight:700}.receipt-actions{display:flex;gap:9px;margin-top:14px}.receipt-actions .btn{width:auto;padding:9px 13px;font-size:12px}@media(max-width:520px){.wrap{width:auto;max-width:100%;padding-left:14px;padding-right:14px}.receipt{padding:15px}.receipt-head{grid-template-columns:1fr}.amount{grid-row:1;text-align:left;font-size:18px;color:var(--accent,#7c6cff)}.receipt-head>div:first-child{grid-row:2}.receipt-actions .btn{box-sizing:border-box;width:100%;text-align:center}.status{border-radius:9px}}</style></head><body class="has-bottomnav"><div class="wrap"><div class="brand"><div class="mark">📶</div><span>Сигнал</span></div><h1 style="margin-top:20px">Чеки та оплати</h1><p class="lead">Усі покупки зберігаються тут. Офіційний чек Stripe можна відкрити або завантажити.</p><div id="list" style="margin-top:20px"><div class="glass receipt"><p class="muted">Завантаження...</p></div></div></div><nav class="bottomnav"><a href="dashboard.html">🏠 Головна</a><a href="plans.html">📶 Тариф</a><a href="usage.html">📊 Витрати</a><a href="profile.html" class="active">👤 Профіль</a></nav><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const box=document.getElementById('list');try{const r=await fetch(`${API_URL}/api/account/billing-history`,{headers:{'x-session-token':token}}),d=await r.json();if(!r.ok)throw Error(d.error);box.innerHTML=d.invoices.length?d.invoices.map(i=>`<article class="glass receipt"><div class="receipt-head"><div><div class="receipt-name">${esc(i.name||'Оплата Сигнал')}</div><div class="meta">${new Date(i.createdAt).toLocaleString('uk-UA')}${i.detail?`<br>${esc(i.detail)}`:''}<br>№ ${esc(i.id)}</div></div><div class="amount">${Number(i.amount||0).toFixed(2)} ${esc(String(i.currency||'').toUpperCase())}</div></div><span class="status">${i.fulfillmentStatus==='failed'?'Оплачено · потрібна допомога':i.status==='paid'?'Оплачено':esc(i.status||'Оплачено')}</span><div class="receipt-actions">${i.receiptUrl?`<a class="btn primary" href="${esc(i.receiptUrl)}" target="_blank" rel="noopener">Відкрити чек</a>`:'<span class="muted" style="font-size:12px">Stripe ще готує посилання на чек</span>'}</div></article>`).join(''):'<div class="glass receipt"><p class="muted">Оплат ще немає.</p></div>'}catch(e){box.innerHTML=`<div class="glass receipt"><p class="err-text">${esc(e.message)}</p></div>`}})();
</script></body></html>
