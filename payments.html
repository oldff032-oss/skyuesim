<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплати й підписка — Signal</title><link rel="stylesheet" href="style.css"><script src="pwa.js"></script><style>
/* Керувати карткою та підпискою */
.profile-state{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(130,155,220,.15);font-size:12px;line-height:1.5}.profile-state .state-dot{width:9px;height:9px;flex:0 0 auto;margin-top:4px;border-radius:50%;background:var(--text-muted)}.profile-state.linked .state-dot{background:var(--success);box-shadow:0 0 12px var(--success)}.profile-state.warning .state-dot{background:#f6b84a}
html,body{max-width:100%;overflow-x:hidden}.billing{width:min(100%,680px);margin-inline:auto}.billing-head{display:flex;align-items:center;gap:14px;margin-top:4px}.billing-icon{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1bd7ff,#665cff);box-shadow:0 14px 36px rgba(54,118,255,.3)}.billing-icon svg{width:25px}.subscription-card{position:relative;overflow:hidden;padding:22px;margin-top:22px;border-radius:25px;background:linear-gradient(145deg,rgba(20,37,75,.96),rgba(15,20,45,.98));border:1px solid rgba(113,146,255,.28);box-shadow:0 24px 60px rgba(0,0,0,.24)}.subscription-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-100px;background:#3b8cff;filter:blur(55px);opacity:.24}.subscription-card>*{position:relative;z-index:1}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#78e4ff}.subscription-card h2{font-size:21px;margin-top:8px}.subscription-card p{color:var(--text-muted);line-height:1.55;margin-top:7px}.receipt{padding:18px;margin-top:12px;min-width:0;overflow:hidden}.receipt-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:14px}.receipt-copy{min-width:0}.receipt-title{display:block;overflow-wrap:anywhere}.receipt-meta{margin-top:6px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}.receipt-amount{text-align:right;white-space:nowrap;font-size:17px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .btn{width:auto;max-width:100%}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}.section-title h2{font-size:18px}.secure{font-size:11px;color:var(--success)}
@media(max-width:460px){.wrap{padding-left:15px!important;padding-right:15px!important}.billing-head h1{font-size:26px}.subscription-card{padding:19px;border-radius:22px}.receipt{padding:16px}.receipt-head{grid-template-columns:minmax(0,1fr)}.receipt-amount{text-align:left;font-size:20px}.actions,.actions .btn{width:100%}.section-title{align-items:flex-start;flex-direction:column;gap:4px}}
</style></head><body class="has-bottomnav"><main class="wrap billing"><header class="billing-head"><span class="billing-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg></span><div><h1>Оплати й підписка</h1><p class="lead">Усе важливе — без дрібного шрифту й зайвих екранів.</p></div></header><section class="subscription-card"><div class="eyebrow">Захищено Stripe</div><h2>Картка та підписка</h2><p>Змінюйте спосіб оплати, переглядайте рахунки або скасовуйте поновлення на захищеній сторінці.</p><div id="profileState" class="profile-state"><span class="state-dot"></span><span>Перевіряємо зв’язок зі Stripe…</span></div><button id="portal" class="btn" style="margin-top:14px">Керувати оплатою</button><div id="message" class="muted" style="margin-top:10px"></div></section><div class="section-title"><h2>Історія оплат</h2><span class="secure">● Безпечні чеки</span></div><section id="list"><div class="shimmer" style="height:160px"></div></section></main><nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" aria-label="Головна" title="Головна" data-nav="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="home-roof" d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><rect class="home-window" x="9.7" y="13" width="4.6" height="7" rx="1" fill="currentColor" stroke="none"/><circle class="home-spark" cx="19" cy="5" r="1.25" fill="currentColor" stroke="none"/></svg></span></a><a href="plans.html" aria-label="Тарифи" title="Тарифи" data-nav="plans"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect class="plan-back" x="5.5" y="3" width="15" height="14" rx="2.5"/><rect class="plan-front" x="3" y="6.5" width="16" height="14" rx="2.5"/><path class="plan-scan" d="M3.8 11h14.4"/><path d="M7 16h5"/></svg></span></a><a href="usage.html" aria-label="Витрати" title="Витрати" data-nav="usage"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="usage-bar bar-one" d="M5 19V13"/><path class="usage-bar bar-two" d="M12 19V7"/><path class="usage-bar bar-three" d="M19 19V10"/><path d="M3 21h18"/><circle class="usage-pulse" cx="19" cy="7.5" r="1.45" fill="currentColor" stroke="none"/></svg></span></a><a href="profile.html" aria-label="Профіль" title="Профіль" data-nav="profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle class="profile-head" cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/><path class="profile-orbit" d="M5.5 8c1.8-5.6 11.2-7.2 15-1.6" stroke-dasharray="2 3"/><circle class="profile-star" cx="20.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg></span></a></nav><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const r=await fetch(`${API_URL}/api/account/billing-profile`,{headers:{'x-session-token':token}}),d=await r.json();if(!r.ok)throw new Error(d.error);profileState.className=`profile-state ${d.linked?'linked':'warning'}`;profileState.querySelector('span:last-child').textContent=d.linked?`Stripe-профіль прив’язано${d.activeSubscription?' · підписка активна':' · платежі доступні'}${d.customerReference?` · ${d.customerReference}`:''}`:'Профіль створиться автоматично під час першої оплати';portal.textContent=d.activeSubscription?'Керувати карткою та підпискою':'Переглянути оплату в Stripe'}catch(error){profileState.className='profile-state warning';profileState.querySelector('span:last-child').textContent=error.message}})();
portal.onclick=async()=>{portal.disabled=true;message.textContent='Відкриваємо захищену сторінку Stripe…';try{const response=await fetch(`${API_URL}/api/billing/portal`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:'{}'}),data=await response.json();if(!response.ok)throw new Error(data.error);location.href=data.url}catch(error){message.textContent=error.message;portal.disabled=false}};
(async()=>{try{const response=await fetch(`${API_URL}/api/account/billing-history`,{headers:{'x-session-token':token}}),data=await response.json();if(!response.ok)throw new Error(data.error);list.innerHTML=data.invoices.length?data.invoices.map(item=>{const id=String(item.id||''),shortId=id.length>14?`…${id.slice(-12)}`:id;return `<article class="glass receipt"><div class="receipt-head"><div class="receipt-copy"><b class="receipt-title">${esc(item.name||'Оплата Signal')}</b><div class="muted receipt-meta">${new Date(item.createdAt).toLocaleString('uk-UA')} · № ${esc(shortId)}</div></div><b class="receipt-amount">${Number(item.amount||0).toFixed(2)} ${esc(String(item.currency||'').toUpperCase())}</b></div><div class="actions">${item.receiptUrl?`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(item.receiptUrl)}">Відкрити чек</a>`:''}${item.fulfillmentStatus==='failed'?'<a class="btn" href="new-ticket.html">Потрібна допомога</a>':''}</div></article>`}).join(''):'<div class="glass receipt"><p class="muted">Оплат ще немає.</p></div>'}catch(error){list.innerHTML=`<div class="glass receipt"><p class="err-text">${esc(error.message)}</p></div>`}})();
</script></body></html>
