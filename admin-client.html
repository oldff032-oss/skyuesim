<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Центр клієнта — Signal Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .client-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.back-link{color:var(--cyan);text-decoration:none;font-size:13px;font-weight:700}.role-chip,.status-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--glass-border);border-radius:999px;font-size:11px;font-weight:800}.role-chip.super{color:#ffd76c;background:rgba(255,191,50,.09)}.status-chip:before{content:"";width:7px;height:7px;border-radius:50%;background:#8f9ab6}.status-chip.active:before{background:#42ebb7;box-shadow:0 0 10px #42ebb7}.status-chip.blocked:before,.status-chip.canceled:before,.status-chip.esim_revoked:before{background:#ff647f}.status-chip.payment_ok_esim_failed:before,.status-chip.renewal_failed:before{background:#ffc45c}
    .client-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:20px;margin-top:15px;overflow:hidden;position:relative}.client-hero:after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-90px;border-radius:50%;background:linear-gradient(135deg,#2dcfff,#8a5cff);filter:blur(62px);opacity:.22;pointer-events:none}.client-avatar{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#167de9,#794ef0);background-size:cover;background-position:center;border:1px solid rgba(113,219,255,.42);box-shadow:0 0 30px rgba(45,169,255,.18);font-size:25px;font-weight:800}.client-hero h1{font-size:24px;margin:0;overflow-wrap:anywhere}.client-hero p{margin:5px 0 0;color:var(--text-muted);overflow-wrap:anywhere}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1}.hero-actions .btn{width:auto}
    .access-note{display:flex;gap:12px;padding:14px 16px;margin:14px 0;border:1px solid rgba(76,208,255,.19);border-radius:15px;background:rgba(29,120,220,.07);color:var(--text-muted);font-size:12px;line-height:1.55}.access-note strong{color:var(--text)}.access-note.warn{border-color:rgba(255,191,66,.25);background:rgba(255,174,34,.07)}
    .client-tabs{display:flex;gap:7px;overflow:auto;padding:4px;margin:15px 0;border:1px solid var(--glass-border);border-radius:15px;background:rgba(255,255,255,.025);scrollbar-width:none}.client-tabs::-webkit-scrollbar{display:none}.client-tabs button{width:auto;flex:none;padding:10px 13px;border:0;border-radius:11px;background:transparent;color:var(--text-muted);font:700 12px inherit;cursor:pointer}.client-tabs button.active{color:#effcff;background:linear-gradient(135deg,rgba(47,136,255,.3),rgba(125,79,247,.25));box-shadow:inset 0 0 0 1px rgba(100,217,255,.19)}
    .client-panel{display:none}.client-panel.active{display:block}.client-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.client-card{padding:18px}.client-card h2{font-size:17px;margin:0 0 13px}.client-card h3{font-size:14px;margin:0}.metric strong{display:block;font:700 27px 'Space Grotesk',sans-serif;margin-top:7px}.metric small,.muted{color:var(--text-muted);font-size:12px}.detail-list{display:grid;gap:0}.detail-row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}.detail-row:last-child{border-bottom:0}.detail-row span:first-child{color:var(--text-muted)}.detail-row b{text-align:right;overflow-wrap:anywhere}.action-grid{display:flex;flex-wrap:wrap;gap:8px}.action-grid .btn{width:auto;padding:9px 12px;font-size:12px}.danger-outline{color:#ff8195!important;border-color:rgba(255,88,116,.34)!important}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-head .btn{width:auto}
    .form-grid{display:grid;grid-template-columns:1fr 170px;gap:10px}.field-label{display:block;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.client-card input,.client-card select,.client-card textarea{width:100%;box-sizing:border-box;border:1px solid var(--glass-border);border-radius:12px;background:rgba(255,255,255,.045);color:var(--text);padding:12px;font:inherit}.client-card textarea{resize:vertical;min-height:100px}.client-card option{background:#101522;color:#fff}
    .record{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}.record:last-child{border-bottom:0}.record-title{display:flex;gap:11px}.record-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,rgba(43,184,255,.2),rgba(125,76,249,.22));border:1px solid rgba(78,195,255,.3)}.record-icon svg{width:22px;stroke:#75ddff}.record b{display:block}.record small{display:block;color:var(--text-muted);margin-top:4px;line-height:1.45}.record-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px}.record-actions .btn{width:auto;padding:8px 10px;font-size:11px}.empty{padding:22px;text-align:center;color:var(--text-muted);border:1px dashed var(--glass-border);border-radius:14px}.purchase-status{display:inline-flex;margin-top:6px;padding:4px 8px;border-radius:999px;background:rgba(65,232,179,.1);color:#58e9bc;font-size:10px;font-weight:800}.purchase-status.failed{color:#ff7c8d;background:rgba(255,82,110,.1)}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:1px;background:linear-gradient(#43d9ff,#7555ef,transparent)}.timeline-item{position:relative;padding:0 0 17px 12px}.timeline-item:before{content:"";position:absolute;left:-17px;top:6px;width:7px;height:7px;border-radius:50%;background:#58dfff;box-shadow:0 0 11px #58dfff}.timeline-item b{font-size:13px}.timeline-item small{display:block;color:var(--text-muted);margin-top:4px}.notes{display:grid;gap:8px}.note{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.035);font-size:12px}.note small{display:block;color:var(--text-muted);margin-top:6px}.toast{position:fixed;right:20px;bottom:20px;z-index:20000;max-width:390px;padding:14px 16px;border:1px solid rgba(79,220,255,.25);border-radius:14px;background:#121827;color:#fff;box-shadow:0 20px 70px rgba(0,0,0,.5);transform:translateY(120px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}.toast.error{border-color:rgba(255,84,112,.35)}
    @media(max-width:900px){.client-hero{grid-template-columns:auto 1fr}.hero-actions{grid-column:1/-1;justify-content:flex-start}.span-4,.span-6,.span-8{grid-column:span 12}}
    @media(max-width:620px){.admin-main{padding-left:14px!important;padding-right:14px!important}.client-hero{grid-template-columns:1fr;text-align:center}.client-avatar{margin:auto}.hero-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.hero-actions .btn{width:100%}.form-grid{grid-template-columns:1fr}.record{grid-template-columns:1fr}.record-actions{justify-content:flex-start}.record-actions .btn{flex:1}.client-card{padding:15px}.detail-row{display:block}.detail-row b{display:block;text-align:left;margin-top:4px}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar"><div class="brand"><div class="mark">🛡️</div><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside>
    <main class="admin-main">
      <div class="client-top"><a class="back-link" href="admin-users.html">← Усі клієнти</a><span id="roleChip" class="role-chip">Перевірка доступу…</span></div>
      <section class="glass client-hero">
        <div id="avatar" class="client-avatar">S</div>
        <div><h1 id="clientName">Центр клієнта</h1><p id="clientEmail">Завантаження…</p><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"><span id="statusChip" class="status-chip">—</span><span id="planChip" class="role-chip">Тариф —</span></div></div>
        <div id="heroActions" class="hero-actions"></div>
      </section>
      <div id="accessNote" class="access-note"><div>🔐</div><div><strong>Права перевіряються на сервері.</strong> Інтерфейс покаже тільки доступні для вашої ролі дії.</div></div>
      <nav class="client-tabs" aria-label="Розділи клієнта">
        <button data-tab="overview" onclick="selectTab('overview')">Огляд</button>
        <button data-tab="esim" onclick="selectTab('esim')">eSIM і новий QR</button>
        <button data-tab="billing" onclick="selectTab('billing')">Пакети й оплати</button>
        <button data-tab="support" onclick="selectTab('support')">Підтримка</button>
        <button data-tab="security" onclick="selectTab('security')">Доступ</button>
        <button data-tab="timeline" onclick="selectTab('timeline')">Історія</button>
      </nav>
      <div id="loading" class="shimmer" style="height:260px"></div>
      <section id="overview" class="client-panel"></section>
      <section id="esim" class="client-panel"></section>
      <section id="billing" class="client-panel"></section>
      <section id="support" class="client-panel"></section>
      <section id="security" class="client-panel"></section>
      <section id="timeline" class="client-panel"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="config.js"></script><script src="admin-common.js"></script>
  <script>
    requireAdminAuth();
    const email=String(new URLSearchParams(location.search).get('email')||'').trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email))location.href='admin-users.html';
    const encodedEmail=encodeURIComponent(email),E=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),D=value=>value?new Date(value).toLocaleString('uk-UA'):'—',U=value=>encodeURIComponent(String(value||''));
    const simIcon='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 7h6v5H9zM9 16h.01M12 16h.01M15 16h.01"/></svg>';
    let me={role:localStorage.getItem('signal_admin_role')||'viewer',permissions:[]},client=null,timelineData={events:[]},inventory={records:[]};
    const isSuper=()=>me.role==='super_admin',can=permission=>isSuper()||me.permissions.includes(permission),hasRole=(...roles)=>roles.includes(me.role);
    async function json(path,options){const response=await adminFetch(path,options),data=await response.json();if(!response.ok)throw new Error(data.error||'Операцію не виконано');return data}
    function message(text,error=false){const box=document.getElementById('toast');box.textContent=text;box.className=`toast show${error?' error':''}`;clearTimeout(message.timer);message.timer=setTimeout(()=>box.className='toast',4300)}
    async function load(){try{[me,client,timelineData,inventory]=await Promise.all([json('/api/admin/me'),json(`/api/admin/users/${encodedEmail}`),json(`/api/admin/users/${encodedEmail}/timeline`),json('/api/admin/esims')]);render()}catch(error){message(error.message,true);document.getElementById('loading').outerHTML=`<div class="empty">${E(error.message)}</div>`}}
    function render(){document.getElementById('loading').style.display='none';const user=client.subscription||{},name=client.account?.displayName||user.displayName||email.split('@')[0];clientName.textContent=name;clientEmail.textContent=email;statusChip.textContent=statusLabel(user.status);statusChip.className=`status-chip ${E(user.status||'registered')}`;planChip.textContent=`Тариф · ${user.plan||'не обрано'}`;avatar.style.backgroundImage=client.account?.avatarDataUrl?`url("${client.account.avatarDataUrl}")`:'';avatar.textContent=client.account?.avatarDataUrl?'':name[0].toUpperCase();roleChip.textContent=isSuper()?'Super Admin · повний доступ':me.role==='admin'?'Admin · операційний доступ':me.role==='support'?'Support · підтримка':'Viewer · перегляд';roleChip.className=`role-chip${isSuper()?' super':''}`;heroActions.innerHTML=`${can('support.reply')?'<button class="btn ghost" onclick="notifyClient(\'push\')">Push</button><button class="btn ghost" onclick="notifyClient(\'email\')">Email</button>':''}<button class="btn" onclick="selectTab('esim')">${isSuper()?'Керувати eSIM':'Переглянути eSIM'}</button>`;accessNote.className=`access-note${isSuper()&&!me.twoFactorVerified?' warn':''}`;accessNote.innerHTML=isSuper()?`<div>${me.twoFactorVerified?'🛡️':'⚠️'}</div><div><strong>Super Admin: повний контроль клієнта.</strong> ${me.twoFactorVerified?'Критичні операції підтверджені 2FA та записуються в журнал.':'Для видачі нового QR, відкликання eSIM, повернення коштів і видалення акаунта увійдіть із увімкненою 2FA.'}</div>`:`<div>🔐</div><div><strong>${E(roleChip.textContent)}.</strong> Доступні тільки безпечні щоденні операції; критичні зміни виконує Super Admin.</div>`;renderOverview();renderEsim();renderBilling();renderSupport();renderSecurity();renderTimeline();selectTab(location.hash.slice(1)||'overview',false)}
    function statusLabel(value){return ({active:'Активний',blocked:'Заблокований',registered:'Зареєстрований',payment_ok_esim_failed:'Оплачено · помилка eSIM',renewal_failed:'Помилка поновлення',esim_revoked:'eSIM відкликана',esim_transferred:'eSIM передана',canceled:'Скасований'})[value]||value||'Без підписки'}
    function selectTab(name,update=true){const target=document.getElementById(name)?name:'overview';document.querySelectorAll('.client-panel').forEach(item=>item.classList.toggle('active',item.id===target));document.querySelectorAll('.client-tabs button').forEach(item=>item.classList.toggle('active',item.dataset.tab===target));if(target==='esim'&&client?.subscription?.esim)document.querySelectorAll('#esim button').forEach(button=>{if(button.textContent.includes('Видати нову eSIM + QR')){button.disabled=true;button.title='Спочатку звільніть поточну eSIM клієнта'}});if(update)history.replaceState(null,'',`${location.pathname}${location.search}#${target}`)}
    function metric(value,label){return `<div class="glass client-card metric span-4"><small>${E(label)}</small><strong>${E(value)}</strong></div>`}
    function row(label,value){return `<div class="detail-row"><span>${E(label)}</span><b>${E(value??'—')}</b></div>`}
    function renderOverview(){const user=client.subscription||{},esim=user.esim||{},remaining=esim.remainingGb??(esim.dataLimitGb!=null?Math.max(0,Number(esim.dataLimitGb)-Number(esim.usedGb||0)):null),canEdit=hasRole('super_admin','admin')&&can('users.manage');overview.innerHTML=`<div class="client-grid">${metric(statusLabel(user.status),'Стан акаунта')}${metric(user.plan||'—','Поточний пакет')}${metric(remaining==null?'—':`${Number(remaining).toFixed(2)} ГБ`,'Залишок інтернету')}<div class="glass client-card span-6"><h2>Профіль</h2><div class="form-grid"><label><span class="field-label">Ім’я</span><input id="profileName" maxlength="80" value="${E(client.account?.displayName||user.displayName||'')}" ${canEdit?'':'disabled'}></label><label><span class="field-label">Мова</span><select id="profileLanguage" ${canEdit?'':'disabled'}><option value="uk" ${(user.language||'uk')==='uk'?'selected':''}>Українська</option><option value="en" ${user.language==='en'?'selected':''}>English</option></select></label></div>${canEdit?'<button class="btn" style="width:auto;margin-top:12px" onclick="saveProfile()">Зберегти профіль</button>':''}</div><div class="glass client-card span-6"><h2>Акаунт</h2><div class="detail-list">${row('Реєстрація',D(client.account?.createdAt||user.createdAt))}${row('Останній вхід',D(client.account?.lastLoginAt))}${row('Активні входи',client.security?.activeSessions??0)}${row('Push-пристрої',client.security?.pushDevices??0)}${row('Запросив',user.referredBy||'—')}</div></div></div>`}
    async function saveProfile(){try{await json(`/api/admin/users/${encodedEmail}/profile`,{method:'PATCH',body:JSON.stringify({displayName:profileName.value,language:profileLanguage.value})});message('Профіль клієнта оновлено');await reloadClient()}catch(error){message(error.message,true)}}
    function esimRecord(item){
      const actions=[];
      if(can('esim.retry')&&item.canSync)actions.push(`<button class="btn ghost" onclick="syncEsim('${U(item.id)}')">Синхронізувати</button>`);
      if(isSuper()){
        if(item.canTransfer)actions.push(`<button class="btn" onclick="transferEsim('${U(item.id)}',false)">Передати іншому</button>`);
        if(item.canReplace)actions.push(`<button class="btn" onclick="transferEsim('${U(item.id)}',true)">Передати з новим QR</button>`);
        if(item.canSuspend)actions.push(`<button class="btn ghost" onclick="esimAction('${U(item.id)}','suspend')">Призупинити</button>`);
        if(item.canUnsuspend)actions.push(`<button class="btn" onclick="esimAction('${U(item.id)}','unsuspend')">Відновити</button>`);
        if(item.canDetach)actions.push(`<button class="btn ghost" onclick="esimAction('${U(item.id)}','detach')">На склад</button>`);
        if(item.canCancel)actions.push(`<button class="btn ghost danger-outline" onclick="esimAction('${U(item.id)}','cancel')">Скасувати</button>`);
        if(item.canRevoke)actions.push(`<button class="btn ghost danger-outline" onclick="esimAction('${U(item.id)}','revoke')">Відкликати</button>`)
      }
      return `<div class="record"><div class="record-title"><span class="record-icon">${simIcon}</span><div><b>${E(item.packageName||item.plan||'eSIM')}</b><small>${E(item.stateLabel||item.state)} · ICCID •••• ${E(item.iccidLast4||'—')}</small><small>eSIM: ${E(item.esimStatus||'—')} · SM-DP+: ${E(item.smdpStatus||'—')}</small></div></div><div class="record-actions">${actions.join('')}</div></div>`
    }
    function renderEsim(){const records=inventory.records||[],owned=records.filter(item=>item.ownerEmail===email),replacement=records.filter(item=>item.previousOwnerEmail===email&&item.canReplace),available=records.filter(item=>item.canAssign&&item.state==='available').slice(0,8),user=client.subscription||{};const controls=hasRole('super_admin','admin')?`<div class="action-grid">${can('esim.retry')?'<button class="btn ghost" onclick="simpleUserAction(\'resync-esim\',\'Дані eSIM оновлено\')">Оновити трафік</button>':''}${can('activation_code.read')?'<button class="btn ghost" onclick="simpleUserAction(\'resend-esim-instructions\',\'Інструкцію надіслано клієнту\')">Надіслати інструкцію</button>':''}<a class="btn ghost" href="admin-esims.html?email=${encodedEmail}">Весь склад eSIM</a></div>`:'';const replaceHtml=isSuper()?`<div class="glass client-card span-12"><div class="section-head"><div><h2>Новий профіль і новий QR</h2><div class="muted">Використаний QR не відновлюється. Провайдер створює іншу eSIM того самого пакета.</div></div></div>${replacement.length?replacement.map(item=>`<div class="record"><div class="record-title"><span class="record-icon">${simIcon}</span><div><b>${E(item.packageName||item.plan||'Пакет')}</b><small>Старий профіль •••• ${E(item.iccidLast4)} більше не встановлюється</small></div></div><div class="record-actions"><button class="btn" onclick="issueEsim('${U(item.id)}',true)">Видати нову eSIM + QR</button></div></div>`).join(''):'<div class="empty">Для цього клієнта немає старого профілю, який можна безпечно замінити.</div>'}</div><div class="glass client-card span-12"><div class="section-head"><div><h2>Вільні eSIM зі складу</h2><div class="muted">Можна безкоштовно видати лише профіль, який провайдер підтвердив як невстановлений.</div></div><button class="btn ghost" onclick="syncProvider()">Оновити склад</button></div>${user.esim?'<div class="access-note warn"><div>⚠️</div><div>У клієнта вже є eSIM. Спочатку визначте долю поточного профілю — передача поверх нього заблокована сервером.</div></div>':available.length?available.map(item=>`<div class="record"><div class="record-title"><span class="record-icon">${simIcon}</span><div><b>${E(item.packageName||item.plan||'eSIM')}</b><small>Готова до видачі · ICCID •••• ${E(item.iccidLast4)}</small></div></div><div class="record-actions"><button class="btn" onclick="issueEsim('${U(item.id)}',false)">Видати безкоштовно</button></div></div>`).join(''):'<div class="empty">Вільних підтверджених eSIM немає. Синхронізуйте склад із провайдером.</div>'}</div>`:'';esim.innerHTML=`<div class="client-grid"><div class="glass client-card span-12"><div class="section-head"><div><h2>eSIM клієнта</h2><div class="muted">QR та код активації не показуються у списках і надсилаються тільки власнику.</div></div>${controls}</div>${owned.length?owned.map(esimRecord).join(''):'<div class="empty">До акаунта зараз не прив’язана eSIM.</div>'}</div>${replaceHtml}</div>`}
    async function syncEsim(id){try{await json(`/api/admin/esims/${id}/sync`,{method:'POST'});message('Стан eSIM синхронізовано');await reloadAll()}catch(error){message(error.message,true)}}
    async function syncProvider(){try{const data=await json('/api/admin/esims/sync-provider',{method:'POST'});message(`Склад оновлено: отримано ${data.received}, додано ${data.pooled}`);await reloadAll()}catch(error){message(error.message,true)}}
    async function issueEsim(id,replacement){const text=replacement?'Створити у провайдера нову eSIM цього пакета та видати клієнту? З балансу eSIM Access буде списана вартість пакета.':'Безкоштовно видати клієнту цю вже придбану невстановлену eSIM?';if(!confirm(text))return;try{const path=replacement?`/api/admin/esims/${id}/replace-and-assign`:`/api/admin/esims/${id}/assign`,body=replacement?{email,confirmProviderCharge:true}:{email,grantType:'admin_promo',acknowledgeBilling:true},data=await json(path,{method:'POST',body:JSON.stringify(body)});message(data.message||'eSIM видано клієнту');await reloadAll()}catch(error){message(error.message,true)}}
    async function transferEsim(id,replacement){const target=String(prompt(`Email нового власника eSIM:\n\nПоточний власник: ${email}`)||'').trim().toLowerCase();if(!target)return;if(target===email)return message('Вкажіть email іншого користувача',true);const warning=replacement?'Старий QR уже використаний. Створити за рахунок балансу eSIM Access новий профіль того самого пакета та передати його іншому користувачу?':'Передати цю невстановлену eSIM іншому користувачу? Stripe-підписка не переноситься.';if(!confirm(warning))return;try{const path=replacement?`/api/admin/esims/${id}/replace-and-assign`:`/api/admin/esims/${id}/assign`,body=replacement?{email:target,confirmProviderCharge:true}:{email:target,grantType:'admin_transfer',acknowledgeBilling:true},data=await json(path,{method:'POST',body:JSON.stringify(body)});message(data.message||'eSIM передано іншому користувачу');await reloadAll()}catch(error){message(error.message,true)}}
    async function esimAction(id,action){const labels={detach:'Повернути невстановлену eSIM на склад?',suspend:'Призупинити мобільний інтернет?',unsuspend:'Відновити мобільний інтернет?',cancel:'Скасувати невстановлену eSIM? Дію не можна повернути.',revoke:'Назавжди відкликати eSIM у провайдера? Інтернет припиниться.'};if(!confirm(labels[action]))return;if(action==='revoke'&&!confirm('Останнє підтвердження: відкликати eSIM назавжди?'))return;try{const path=action==='detach'?`/api/admin/esims/${id}/detach`:`/api/admin/esims/${id}/${action}`;await json(path,{method:'POST',body:JSON.stringify(action==='detach'?{}:{confirmation:action.toUpperCase()})});message('Стан eSIM змінено');await reloadAll()}catch(error){message(error.message,true)}}
    function purchaseCard(item){const failed=item.fulfillmentStatus==='failed',actions=[];if(failed&&can('esim.retry')&&hasRole('super_admin','admin'))actions.push(`<button class="btn" onclick="retryPurchase('${U(item.id)}')">Повторити видачу</button>`);return `<div class="record"><div><b>${E(item.packageName||item.plan||'Пакет eSIM')}</b><small>${E(item.location||'Регіон не вказано')} · ${item.dataLimitGb==null?'Безліміт':E(item.dataLimitGb)+' ГБ'} · ${E(item.durationDays||'—')} днів</small><small>${item.amountCents==null?'—':(Number(item.amountCents)/100).toFixed(2)} ${E(String(item.currency||'').toUpperCase())} · ${D(item.paidAt||item.createdAt)}</small><span class="purchase-status${failed?' failed':''}">${E(item.paymentStatus||'—')} · ${E(item.fulfillmentStatus||'—')}</span>${item.fulfillmentError?`<small style="color:#ff8295">${E(item.fulfillmentError)}</small>`:''}</div><div class="record-actions">${actions.join('')}</div></div>`}
    function renderBilling(){const user=client.subscription||{},purchases=Array.isArray(user.purchases)?user.purchases:[],adminOps=hasRole('super_admin','admin')&&can('operations.manage');billing.innerHTML=`<div class="client-grid"><div class="glass client-card span-6"><h2>Платіжний профіль</h2><div class="detail-list">${row('Stripe',client.billing?.linked?'Прив’язано':'Не прив’язано')}${row('Customer ID',client.billing?.customerId||'—')}${row('Subscription ID',client.billing?.subscriptionId||'—')}${row('Дублі профілю',client.billing?.duplicateProfiles||0)}${row('Остання перевірка',D(client.billing?.lastCheckedAt))}</div>${adminOps?`<div class="action-grid" style="margin-top:13px"><button class="btn ghost" onclick="simpleUserAction('sync-stripe-status','Stripe перевірено')">Синхронізувати Stripe</button><button class="btn ghost" onclick="syncPurchases()">Завантажити покупки</button></div>`:''}</div><div class="glass client-card span-6"><h2>Операції з оплатою</h2><div class="access-note"><div>✓</div><div>Тариф не змінюється вручну. Він оновлюється тільки після підтвердженої покупки або безкоштовної видачі eSIM.</div></div><div class="action-grid">${adminOps?'<button class="btn" onclick="createCheckout()">Створити посилання на оплату</button>':''}${isSuper()?'<button class="btn ghost danger-outline" onclick="refundPayment()">Повернути кошти</button>':''}</div></div><div class="glass client-card span-12"><h2>Історія пакетів і покупок</h2>${purchases.length?purchases.map(purchaseCard).join(''):'<div class="empty">Покупок ще немає.</div>'}</div></div>`}
    async function syncPurchases(){try{const data=await json(`/api/admin/users/${encodedEmail}/sync-purchases`,{method:'POST'});message(`Імпортовано покупок: ${data.imported}`);await reloadClient()}catch(error){message(error.message,true)}}
    async function retryPurchase(id){if(!confirm('Повторити видачу оплаченої eSIM? Нова оплата не створюється, але провайдер може списати вартість профілю з балансу.'))return;try{await json(`/api/admin/users/${encodedEmail}/purchases/${id}/retry-provision`,{method:'POST'});message('eSIM видано за оплаченою покупкою');await reloadAll()}catch(error){message(error.message,true)}}
    async function createCheckout(){const packageCode=prompt('Package code з eSIM Access:');if(!packageCode)return;const packageName=prompt('Назва пакета для клієнта:',packageCode);if(!packageName)return;const price=prompt('Ціна в USD:','4.99');if(price===null)return;const amountCents=Math.round(Number(String(price).replace(',','.'))*100);if(!Number.isInteger(amountCents)||amountCents<50)return message('Мінімальна коректна ціна — $0.50',true);const dataLimitGb=prompt('Обсяг у ГБ (необов’язково):','');if(dataLimitGb===null)return;const durationDays=prompt('Строк дії у днях:','30');if(durationDays===null)return;const locationName=prompt('Країна або регіон:','Europe');if(locationName===null)return;try{const data=await json(`/api/admin/users/${encodedEmail}/custom-package-checkout`,{method:'POST',body:JSON.stringify({packageCode:packageCode.trim(),packageName:packageName.trim(),amountCents,currency:'usd',dataLimitGb:dataLimitGb===''?null:Number(dataLimitGb),durationDays:durationDays===''?null:Number(durationDays),location:locationName.trim()})});await navigator.clipboard?.writeText(data.url);prompt('Посилання створено та скопійовано:',data.url)}catch(error){message(error.message,true)}}
    async function refundPayment(){try{const data=await json(`/api/admin/users/${encodedEmail}/refundable-payments`);if(!data.payments?.length)return message('Немає платежів для повернення',true);const list=data.payments.map((item,index)=>`${index+1}. ${(item.refundableAmount/100).toFixed(2)} ${String(item.currency).toUpperCase()} · ${item.id}`).join('\n');const choice=prompt(`Оберіть платіж:\n\n${list}`,'1');if(choice===null)return;const payment=data.payments[Number(choice)-1];if(!payment)return message('Невірний номер платежу',true);const amountText=prompt('Сума повернення:',(payment.refundableAmount/100).toFixed(2));if(amountText===null)return;const amount=Math.round(Number(String(amountText).replace(',','.'))*100);if(!Number.isInteger(amount)||amount<1||amount>payment.refundableAmount)return message('Некоректна сума',true);const confirmationEmail=prompt(`Введіть точний email ${email} для підтвердження:`);if(confirmationEmail?.trim().toLowerCase()!==email)return message('Email не збігається',true);if(!confirm('Останнє підтвердження: повернути кошти й скасувати активну підписку?'))return;await json(`/api/admin/users/${encodedEmail}/refund`,{method:'POST',body:JSON.stringify({chargeId:payment.id,amount,reason:'requested_by_customer',confirmationEmail:email,requestId:crypto.randomUUID?.()||`${Date.now()}`})});message('Повернення створено у Stripe');await reloadClient()}catch(error){message(error.message,true)}}
    function renderSupport(){const tickets=client.tickets||[],notes=client.notes||[],canSupport=hasRole('super_admin','admin','support')&&can('support.reply');support.innerHTML=`<div class="client-grid"><div class="glass client-card span-6"><div class="section-head"><h2>Звернення</h2><a class="btn ghost" href="admin-tickets.html?email=${encodedEmail}">Уся підтримка</a></div>${tickets.length?tickets.map(item=>`<div class="record"><div><b>#${E(item.id)} · ${E(item.subject||'Без теми')}</b><small>${E(item.status||'open')} · ${D(item.updatedAt||item.createdAt)}</small></div><div class="record-actions"><a class="btn ghost" href="admin-ticket.html?id=${U(item.id)}">Відкрити</a></div></div>`).join(''):'<div class="empty">Звернень немає.</div>'}</div><div class="glass client-card span-6"><h2>Внутрішні нотатки</h2><div class="notes">${notes.length?notes.slice().reverse().map(item=>`<div class="note">${E(item.text)}<small>${E(item.by)} · ${D(item.createdAt)}</small></div>`).join(''):'<div class="empty">Нотаток немає.</div>'}</div>${canSupport?'<label style="display:block;margin-top:13px"><span class="field-label">Нова нотатка</span><textarea id="noteText" maxlength="1000" placeholder="Це бачить тільки команда"></textarea></label><button class="btn" style="width:auto;margin-top:8px" onclick="addNote()">Додати нотатку</button>':''}</div>${canSupport?`<div class="glass client-card span-12"><h2>Написати клієнту</h2><p class="muted">Повідомлення перекладається відповідно до мови профілю та записується в журнал.</p><div class="action-grid"><button class="btn ghost" onclick="notifyClient('push')">Надіслати push</button><button class="btn" onclick="notifyClient('email')">Надіслати email</button></div></div>`:''}</div>`}
    async function addNote(){const text=noteText.value.trim();if(!text)return message('Введіть нотатку',true);try{await json(`/api/admin/users/${encodedEmail}/note`,{method:'POST',body:JSON.stringify({text})});message('Нотатку збережено');await reloadClient()}catch(error){message(error.message,true)}}
    async function notifyClient(channel){if(!hasRole('super_admin','admin','support'))return message('Для вашої ролі повідомлення недоступні',true);const title=prompt('Заголовок:','Signal');if(title===null)return;const text=prompt(`Повідомлення для ${email}:`);if(!text)return;try{await json(`/api/admin/users/${encodedEmail}/notify`,{method:'POST',body:JSON.stringify({channel,title,message:text})});message(channel==='push'?'Push надіслано':'Email надіслано')}catch(error){message(error.message,true)}}
    function renderSecurity(){const user=client.subscription||{},blocked=user.status==='blocked',canManage=hasRole('super_admin','admin')&&can('users.manage');security.innerHTML=`<div class="client-grid"><div class="glass client-card span-6"><h2>Доступ до акаунта</h2><div class="detail-list">${row('Статус',statusLabel(user.status))}${row('Активні входи',client.security?.activeSessions??0)}${row('Push-пристрої',client.security?.pushDevices??0)}</div>${canManage?`<div class="action-grid" style="margin-top:13px"><button class="btn ghost" onclick="setBlocked(${blocked?'false':'true'})">${blocked?'Розблокувати':'Заблокувати'}</button><button class="btn ghost danger-outline" onclick="revokeSessions()">Завершити всі входи</button></div>`:''}</div><div class="glass client-card span-6"><h2>Критична зона</h2>${isSuper()?'<div class="access-note warn"><div>⚠️</div><div>Видалення скасовує активну Stripe-підписку, стирає локальний акаунт і відв’язує eSIM. Дія потребує Super Admin + 2FA.</div></div><button class="btn danger" style="width:auto" onclick="deleteAccount()">Повністю видалити акаунт</button>':'<div class="empty">Критичні операції доступні лише Super Admin із підтвердженою 2FA.</div>'}</div></div>`}
    async function setBlocked(blocked){if(!confirm(`${blocked?'Заблокувати':'Розблокувати'} акаунт ${email}?`))return;try{await json(`/api/admin/users/${encodedEmail}/block`,{method:'PATCH',body:JSON.stringify({blocked})});message(blocked?'Акаунт заблоковано':'Акаунт розблоковано');await reloadClient()}catch(error){message(error.message,true)}}
    async function revokeSessions(){if(!confirm(`Завершити всі активні входи ${email}?`))return;try{const data=await json(`/api/admin/users/${encodedEmail}/revoke-sessions`,{method:'POST'});message(`Завершено входів: ${data.revoked}`);await reloadClient()}catch(error){message(error.message,true)}}
    async function deleteAccount(){const confirmation=prompt(`Це назавжди видалить акаунт і зупинить підписку. Введіть точний email ${email}:`);if(confirmation?.trim().toLowerCase()!==email)return message('Email не збігається',true);if(!confirm('Останнє підтвердження: видалити акаунт без можливості відновлення локальних даних?'))return;try{await json(`/api/admin/users/${encodedEmail}`,{method:'DELETE',body:JSON.stringify({confirmationEmail:email})});alert(`Акаунт ${email} видалено`);location.href='admin-users.html'}catch(error){message(error.message,true)}}
    function renderTimeline(){const events=timelineData.events||[];timeline.innerHTML=`<div class="glass client-card"><div class="section-head"><div><h2>Повна історія клієнта</h2><div class="muted">Акаунт, входи, платежі, eSIM, підтримка та адміністративні дії.</div></div><a class="btn ghost" href="admin-user-timeline.html?email=${encodedEmail}">Розгорнутий вигляд</a></div><div class="timeline">${events.length?events.slice(0,80).map(item=>`<div class="timeline-item"><b>${E(item.title)}</b><small>${D(item.at)}${item.detail?` · ${E(item.detail)}`:''}</small></div>`).join(''):'<div class="empty">Подій ще немає.</div>'}</div></div>`}
    async function simpleUserAction(action,success){try{await json(`/api/admin/users/${encodedEmail}/${action}`,{method:'POST'});message(success);await reloadClient()}catch(error){message(error.message,true)}}
    async function reloadClient(){try{[client,timelineData]=await Promise.all([json(`/api/admin/users/${encodedEmail}`),json(`/api/admin/users/${encodedEmail}/timeline`)]);render()}catch(error){message(error.message,true)}}
    async function reloadAll(){try{[client,timelineData,inventory]=await Promise.all([json(`/api/admin/users/${encodedEmail}`),json(`/api/admin/users/${encodedEmail}/timeline`),json('/api/admin/esims')]);render()}catch(error){message(error.message,true)}}
    load();
  </script>
</body>
