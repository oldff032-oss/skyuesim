<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Travel Pass — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="signal-universe.html">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Signal Travel Pass</b></header><div id="pass"><div class="xp-skeleton"></div></div><div id="actions" class="xp-form" style="margin-top:16px"></div><div class="xp-note" style="margin-top:14px">Travel Pass навмисно не містить QR-код eSIM, ICCID, PIN або код активації. Повна офлайн-картка залишається тільки у захищеному розділі Signal.</div></main><script src="config.js"></script><script src="experience.js"></script><script>document.body.insertAdjacentHTML('beforeend',xpNav());xpFetch('/api/account/wallet-pass').then(data=>{const c=data.card;pass.innerHTML=`<section class="xp-pass"><div style="display:flex;align-items:center;justify-content:space-between"><img src="signal-premium-logo.png" width="48" height="48" style="border-radius:14px" alt="Signal"><span class="xp-badge">${c.status==='active'?'ACTIVE':'PLANNED'}</span></div><h2>${xpEsc(c.holder)}</h2><small>SIGNAL TRAVEL PASS</small><div class="xp-pass-grid"><span>НАПРЯМОК<b>${xpEsc(c.destination)}</b></span><span>ПАКЕТ<b>${xpEsc(c.plan)}</b></span><span>ДІЄ ДО<b>${xpDate(c.validUntil)}</b></span><span>КАРТКА<b>${xpEsc(c.serial.slice(-8).toUpperCase())}</b></span></div></section>`;actions.innerHTML=`${data.appleUrl?`<a class="xp-btn" href="${xpEsc(data.appleUrl)}"> Додати в Apple Wallet</a>`:'<button class="xp-btn secondary" disabled>Apple Wallet · очікує сертифікат</button>'}${data.googleUrl?`<a class="xp-btn" href="${xpEsc(data.googleUrl)}">Додати в Google Wallet</a>`:'<button class="xp-btn secondary" disabled>Google Wallet · очікує Issuer ID</button>'}<a class="xp-btn secondary" href="offline-esim.html">Відкрити захищену офлайн-картку</a>`}).catch(e=>pass.innerHTML=`<div class="xp-note">${xpEsc(e.message)}</div>`);</script></body></html>
