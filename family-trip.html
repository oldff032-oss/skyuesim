<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сімейна подорож — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script><style>.member-edit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:9px}.member-edit select{padding:9px;font-size:10px}.editor{display:none}.editor.open{display:block;animation:xpBar .25s ease both}</style></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="family-center.html">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Сімейна подорож</b></header><section class="xp-hero"><div class="xp-kicker">УСІ ГОТОВІ ДО ЗВ’ЯЗКУ</div><div class="xp-orb">∞</div><h1 class="xp-title" style="text-align:center">Одна поїздка. Усі поруч.</h1><p class="xp-lead" style="text-align:center">Призначай eSIM, додавай учасників і бач готовність кожного.</p></section><section class="xp-section"><h2>Нова подорож</h2><form id="form" class="xp-panel xp-form"><input class="xp-input" id="tripName" maxlength="80" placeholder="Назва, наприклад Літо разом"><input class="xp-input" id="destination" maxlength="80" required placeholder="Країна або місто"><label class="xp-muted">Виїзд<input class="xp-input" id="startDate" type="date" required></label><label class="xp-muted">Повернення<input class="xp-input" id="endDate" type="date" required></label><button class="xp-btn">Створити подорож</button></form></section><section id="editor" class="xp-section editor"><h2>Додати близьку людину</h2><form id="memberForm" class="xp-panel xp-form"><input id="memberName" class="xp-input" required maxlength="60" placeholder="Ім’я"><input id="memberEmail" class="xp-input" type="email" maxlength="254" placeholder="Email (необов’язково)"><select class="xp-input" id="sharedEsim"><option value="">Без призначеної eSIM</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="xp-btn">Додати</button><button id="cancelMember" class="xp-btn secondary" type="button">Скасувати</button></div></form></section><section class="xp-section"><h2>Мої поїздки</h2><div id="trips" class="xp-list"><div class="xp-skeleton"></div></div></section><div class="xp-note" style="margin-top:14px">Твій телефон не потрібен під час встановлення. Надішли близькій людині захищене посилання з екрана «eSIM для близьких».</div></main><script src="config.js"></script><script src="experience.js"></script><script>
document.body.insertAdjacentHTML('beforeend',xpNav());const today=new Date().toISOString().slice(0,10);startDate.min=today;endDate.min=today;startDate.onchange=()=>{endDate.min=startDate.value||today;if(endDate.value&&endDate.value<startDate.value)endDate.value=startDate.value};let dataset={trips:[],availableEsims:[]},editingTripId=null;const stateLabel={invited:'Запрошено',ready:'eSIM призначено',installed:'Встановлено',attention:'Потрібна увага'};
function options(value){return Object.entries(stateLabel).map(([key,label])=>`<option value="${key}" ${key===value?'selected':''}>${label}</option>`).join('')}
function card(item){return `<article class="xp-card wide"><span class="xp-badge">${xpEsc(xpDate(item.startDate))}</span><strong style="font-size:20px">${xpEsc(item.destination)}</strong><p>${xpEsc(item.name)} · до ${xpEsc(xpDate(item.endDate))}</p><div class="xp-list" style="margin-top:12px">${item.members.length?item.members.map(member=>`<div class="xp-family-member"><span class="xp-family-avatar">${xpEsc((member.name||'?')[0].toUpperCase())}</span><span class="xp-family-copy"><b>${xpEsc(member.name)}</b><span>${member.sharedEsimId?'eSIM призначено':'Без eSIM'}</span></span></div><div class="member-edit"><select class="xp-input" data-trip="${xpEsc(item.id)}" data-member="${xpEsc(member.id)}">${options(member.status)}</select><button class="xp-btn secondary" data-remove="${xpEsc(item.id)}:${xpEsc(member.id)}" style="width:auto;padding:10px" aria-label="Видалити учасника">×</button></div>`).join(''):'<span class="xp-muted">Додай учасника, щоб бачити готовність.</span>'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px"><button class="xp-btn" data-add="${xpEsc(item.id)}">+ Учасник</button><button class="xp-btn secondary" data-delete="${xpEsc(item.id)}">Завершити</button></div></article>`}
async function updateTrip(trip){await xpFetch(`/api/account/family-trips/${encodeURIComponent(trip.id)}`,{method:'PUT',body:JSON.stringify(trip)})}
function wire(){document.querySelectorAll('[data-add]').forEach(button=>button.onclick=()=>openEditor(button.dataset.add));document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('Завершити й видалити цю поїздку? eSIM близьких залишаться без змін.'))return;await xpFetch(`/api/account/family-trips/${encodeURIComponent(button.dataset.delete)}`,{method:'DELETE'});xpToast('Подорож завершено');load()});document.querySelectorAll('[data-member]').forEach(select=>select.onchange=async()=>{const trip=dataset.trips.find(x=>x.id===select.dataset.trip),member=trip?.members.find(x=>x.id===select.dataset.member);if(!member)return;member.status=select.value;await updateTrip(trip);xpToast('Готовність оновлено');load()});document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=async()=>{const [tripId,memberId]=button.dataset.remove.split(':'),trip=dataset.trips.find(x=>x.id===tripId);if(!trip)return;trip.members=trip.members.filter(x=>x.id!==memberId);await updateTrip(trip);xpToast('Учасника видалено');load()})}
async function load(){dataset=await xpFetch('/api/account/family-trips');sharedEsim.innerHTML='<option value="">Без призначеної eSIM</option>'+dataset.availableEsims.map(item=>`<option value="${xpEsc(item.id)}">${xpEsc(item.recipientName||item.packageName)} · ${xpEsc(item.status)}</option>`).join('');trips.innerHTML=dataset.trips.length?dataset.trips.map(card).join(''):`<div class="xp-empty xp-panel"><i>∞</i><b>Сімейних подорожей ще немає</b><p class="xp-muted">Створи першу — Signal збере готовність усіх в одному місці.</p></div>`;wire()}
function openEditor(id){editingTripId=id;memberForm.reset();editor.classList.add('open');editor.scrollIntoView({behavior:'smooth',block:'start'});memberName.focus()}cancelMember.onclick=()=>{editor.classList.remove('open');editingTripId=null};memberForm.onsubmit=async event=>{event.preventDefault();const trip=dataset.trips.find(x=>x.id===editingTripId);if(!trip)return;trip.members.push({name:memberName.value.trim(),email:memberEmail.value.trim()||null,sharedEsimId:sharedEsim.value||null,status:sharedEsim.value?'ready':'invited'});await updateTrip(trip);editor.classList.remove('open');editingTripId=null;xpToast('Учасника додано');load()};form.onsubmit=async event=>{event.preventDefault();try{await xpFetch('/api/account/family-trips',{method:'POST',body:JSON.stringify({name:tripName.value,destination:destination.value,startDate:startDate.value,endDate:endDate.value,members:[]})});form.reset();startDate.min=today;endDate.min=today;xpToast('Сімейну подорож створено');load()}catch(error){xpToast(error.message)}};load().catch(error=>trips.innerHTML=`<div class="xp-note">${xpEsc(error.message)}</div>`);
</script></body></html>
