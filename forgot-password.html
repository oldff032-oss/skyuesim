<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Забув(ла) пароль — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
<script src="pwa.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Сигнал</span></div>
    <h1 style="margin-top:20px;">Забув(ла) пароль?</h1>
    <p class="lead">Введи email — надішлемо код для відновлення</p>

    <div class="field-group">
      <label class="field-label">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      <div class="err-text" id="err" style="display:none;"></div>
    </div>

    <button class="btn" id="btn" style="margin-top:24px;" onclick="submit()">Надіслати код</button>
    <p class="muted" style="text-align:center; margin-top:16px;"><a href="login.html" style="color:var(--cyan); text-decoration:none;">← Повернутись до входу</a></p>
  </div>

  <script src="config.js"></script>
  <script>
    async function submit(){
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      err.style.display = 'none';
      emailInput.classList.remove('error');

      if(!email || !email.includes('@')){
        err.textContent = 'Введи коректний email';
        err.style.display = 'flex';
        emailInput.classList.add('error');
        return;
      }

      btn.classList.add('loading');
      btn.textContent = 'Надсилаємо...';

      try{
        const res = await fetch(`${API_URL}/api/auth/forgot-password`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Помилка сервера');

        localStorage.setItem('signal_reset_email', email);
        window.location.href = 'reset-code.html';
      }catch(e){
        err.textContent = e.message;
        err.style.display = 'flex';
        btn.classList.remove('loading');
        btn.textContent = 'Надіслати код';
      }
    }
    document.getElementById('email').addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
  </script>
</body>
</html>
