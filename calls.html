<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal-зв'язок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
<style>
  .chat-item{padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}.chat-item:last-child{border:0}.chat-item.active{color:var(--cyan)}
  .bubble{max-width:82%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:13px;line-height:1.35}.bubble.mine{margin-left:auto;background:rgba(52,228,184,.16);border:1px solid rgba(52,228,184,.22)}.bubble.theirs{background:rgba(255,255,255,.06)}
</style>
</head>
<body class="has-bottomnav">
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Signal-зв'язок</span></div>
    <div class="card" style="margin-top:18px;">
      <div class="muted" style="font-size:12px;">Твій Signal ID</div>
      <div id="mySignalId" style="font-family:'Space Mono',monospace;font-size:14px;margin-top:6px;">Завантаження…</div>
      <button class="btn ghost" style="margin-top:12px;padding:8px 12px;font-size:12px;" onclick="copyMyId()">Скопіювати ID</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;"><h1 style="font-size:18px;">Повідомлення</h1><button class="btn" style="width:auto;padding:8px 12px;font-size:12px;" onclick="newChat()">Новий чат</button></div>
    <div id="conversationList" class="card" style="margin-top:10px;"></div>
    <section id="chatPanel" class="card" style="display:none;margin-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;"><div><b id="chatTitle">Чат</b><div id="callStatus" class="muted" style="font-size:11px;margin-top:3px;"></div></div><button class="btn ghost" style="width:auto;padding:8px 12px;font-size:12px;" onclick="startCall()">📞 Дзвінок</button></div>
      <audio id="remoteAudio" autoplay></audio>
      <div id="messages" style="min-height:160px;max-height:42vh;overflow:auto;margin-top:12px;"></div>
      <div style="display:flex;gap:8px;margin-top:12px;"><input id="messageText" placeholder="Написати повідомлення…" style="flex:1;"><button class="btn" style="width:auto;padding:9px 14px;" onclick="sendMessage()">➤</button></div>
    </section>
  </div>
  <nav class="bottomnav"><a href="dashboard.html"><span class="ic">🏠</span>Головна</a><a href="plans.html"><span class="ic">📶</span>Тариф</a><a href="usage.html"><span class="ic">📊</span>Витрати</a><a href="profile.html" class="active"><span class="ic">👤</span>Профіль</a></nav>
  <script src="config.js"></script><script src="pwa.js"></script>
  <script>
    const token = localStorage.getItem('signal_session_token');
    if(!token) window.location.href = 'login.html';
    const api = (path, options = {}) => fetch(`${API_URL}${path}`, {...options, headers:{'Content-Type':'application/json','X-Session-Token':token,...(options.headers||{})}});
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    let mySignalId = '', conversations = [], selectedId = null, lastSignalId = 0, peer = null, localStream = null, pendingCandidates = [], polling = null;

    async function load(){
      const me = await api('/api/chat/me'); if(!me.ok) return logout();
      mySignalId = (await me.json()).signalId; document.getElementById('mySignalId').textContent = mySignalId;
      await loadConversations();
      polling = setInterval(async () => { if(selectedId){ await loadMessages(); await pollSignals(); } }, 2500);
    }
    async function loadConversations(){
      const res = await api('/api/chat/conversations'); conversations = res.ok ? await res.json() : [];
      document.getElementById('conversationList').innerHTML = conversations.length ? conversations.map(item => `<div class="chat-item ${item.id===selectedId?'active':''}" onclick="openConversation('${item.id}')"><b>${escapeHtml(item.contact?.signalId || 'Signal')}</b><div class="muted" style="font-size:12px;margin-top:3px;">${escapeHtml(item.lastMessage?.text || 'Почніть розмову')}</div></div>`).join('') : '<p class="muted">Ще немає чатів. Додай людину за її Signal ID.</p>';
    }
    async function newChat(){
      const signalId = prompt('Введи Signal ID контакту, наприклад signal-ab12cd34'); if(!signalId) return;
      const res = await api('/api/chat/conversations',{method:'POST',body:JSON.stringify({signalId})}); const data = await res.json();
      if(!res.ok) return alert(data.error || 'Не вдалося створити чат'); selectedId=data.id; lastSignalId=0; await loadConversations(); await openConversation(data.id);
    }
    async function openConversation(id){ selectedId=id; lastSignalId=0; document.getElementById('chatPanel').style.display='block'; const item=conversations.find(x=>x.id===id); document.getElementById('chatTitle').textContent=item?.contact?.signalId||'Signal'; await loadConversations(); await loadMessages(); await pollSignals(); }
    async function loadMessages(){ if(!selectedId) return; const res=await api(`/api/chat/conversations/${selectedId}/messages`); if(!res.ok) return; const messages=await res.json(); const box=document.getElementById('messages'); const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-30; box.innerHTML=messages.map(item=>`<div class="bubble ${item.from===localStorage.getItem('signal_email')?'mine':'theirs'}">${escapeHtml(item.text)}<div class="muted" style="font-size:10px;margin-top:4px;">${new Date(item.createdAt).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''); if(atBottom) box.scrollTop=box.scrollHeight; }
    async function sendMessage(){ const input=document.getElementById('messageText'), text=input.value.trim(); if(!text||!selectedId)return; const res=await api(`/api/chat/conversations/${selectedId}/messages`,{method:'POST',body:JSON.stringify({text})}); if(res.ok){input.value='';await loadMessages();await loadConversations();} }
    async function sendSignal(type,payload){ return api(`/api/chat/conversations/${selectedId}/signals`,{method:'POST',body:JSON.stringify({type,payload})}); }
    async function makePeer(){
      peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}); pendingCandidates=[];
      localStream=await navigator.mediaDevices.getUserMedia({audio:true}); localStream.getTracks().forEach(track=>peer.addTrack(track,localStream));
      peer.ontrack=event=>document.getElementById('remoteAudio').srcObject=event.streams[0];
      peer.onicecandidate=event=>{if(event.candidate)sendSignal('candidate',event.candidate.toJSON());};
      peer.onconnectionstatechange=()=>{document.getElementById('callStatus').textContent=peer?.connectionState==='connected'?'Дзвінок з’єднано':peer?.connectionState||''; if(['failed','disconnected','closed'].includes(peer?.connectionState)) endCall(false);};
    }
    async function startCall(){ if(!selectedId||peer)return; try{await makePeer();const offer=await peer.createOffer();await peer.setLocalDescription(offer);await sendSignal('offer',offer);document.getElementById('callStatus').textContent='Викликаємо…';}catch(error){alert('Не вдалося почати дзвінок. Дозволь доступ до мікрофона.');endCall(false);} }
    async function pollSignals(){ if(!selectedId)return; const res=await api(`/api/chat/conversations/${selectedId}/signals?after=${lastSignalId}`);if(!res.ok)return; for(const signal of await res.json()){lastSignalId=Math.max(lastSignalId,signal.id);try{if(signal.type==='offer'){if(!confirm('Вхідний аудіодзвінок. Прийняти?')){await sendSignal('end',null);continue;}await makePeer();await peer.setRemoteDescription(signal.payload);const answer=await peer.createAnswer();await peer.setLocalDescription(answer);await sendSignal('answer',answer);document.getElementById('callStatus').textContent='З’єднання…';}else if(signal.type==='answer'&&peer){await peer.setRemoteDescription(signal.payload);for(const candidate of pendingCandidates)await peer.addIceCandidate(candidate);pendingCandidates=[];}else if(signal.type==='candidate'&&peer){if(peer.remoteDescription)await peer.addIceCandidate(signal.payload);else pendingCandidates.push(signal.payload);}else if(signal.type==='end'){endCall(false);}}catch(error){console.error(error);endCall(false);}} }
    function endCall(notify=true){if(notify&&selectedId)sendSignal('end',null);if(localStream)localStream.getTracks().forEach(track=>track.stop());if(peer)peer.close();peer=null;localStream=null;pendingCandidates=[];document.getElementById('remoteAudio').srcObject=null;document.getElementById('callStatus').textContent='';}
    function copyMyId(){navigator.clipboard?.writeText(mySignalId);alert('Signal ID скопійовано');}
    function logout(){localStorage.removeItem('signal_session_token');localStorage.removeItem('signal_email');window.location.href='login.html';}
    document.getElementById('messageText').addEventListener('keydown',event=>{if(event.key==='Enter')sendMessage();}); window.addEventListener('beforeunload',()=>endCall(true)); load();
  </script>
</body>
</html>
