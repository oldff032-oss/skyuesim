const token=localStorage.getItem('signal_session_token'),savedEmail=localStorage.getItem('signal_email');if(!token)location.href='login.html';email.textContent=savedEmail||'';fetch(`${API_URL}/api/status`,{headers:{'x-session-token':token}}).then(r=>r.json()).then(user=>{name.textContent=user.displayName||'Профіль';email.textContent=user.email||savedEmail||'';if(user.avatarDataUrl){avatar.textContent='';avatar.style.backgroundImage=`url("${user.avatarDataUrl}")`}else avatar.textContent=(user.displayName||user.email||'?')[0].toUpperCase()}).catch(()=>{});logout.onclick=()=>{localStorage.removeItem('signal_session_token');localStorage.removeItem('signal_email');location.href='login.html'};
