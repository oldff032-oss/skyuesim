<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Профіль — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><link rel="manifest" href="/manifest.json"><script src="pwa.js"></script>
</head>
<body class="xp-page">
  <main class="xp-wrap">
    <header class="xp-head"><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Профіль</b><span class="xp-head-spacer"></span><a class="xp-icon-button" href="notifications.html" aria-label="Сповіщення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="badge" class="xp-notification-dot" hidden></span></a></header>
    <div id="content"><div class="xp-skeleton"></div><div class="xp-skeleton" style="height:250px;margin-top:16px"></div></div>
  </main>
  <nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" aria-label="Головна"><span class="nav-icon"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html" aria-label="Тарифи"><span class="nav-icon"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html" aria-label="Витрати"><span class="nav-icon"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html" class="active" aria-label="Профіль"><span class="nav-icon"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav>
  <script src="config.js"></script><script src="experience.js"></script>
  <script>
    const icon=name=>({
      bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
      history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6V4M4 8.6h4.6M12 7v5l3 2"/></svg>',
      savings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>',
      family:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M14 15.5a4.5 4.5 0 0 1 6.5 4"/></svg>',
      sim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v14H7zM10 11h5v6h-5z"/></svg>',
      card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>',
      help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.5 2.5 0 1 1 3.4 2.3c-.9.4-1.1 1-1.1 1.8M12 17h.01"/></svg>',
      settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>'
    })[name]||'';
    const row=(href,name,title,subtitle)=>`<a class="xp-menu-item" href="${href}"><span class="xp-menu-icon">${icon(name)}</span><span class="xp-menu-copy"><b>${title}</b><span>${subtitle}</span></span><span class="xp-menu-arrow">›</span></a>`;
    const metric=(value,label)=>`<div class="xp-stat-mini"><strong>${xpEsc(value)}</strong><span>${label}</span></div>`;
    Promise.all([xpFetch('/api/account/profile-overview'),xpFetch('/api/account/notifications')]).then(([data,notifications])=>{
      if(notifications.unread){badge.hidden=false;badge.textContent=notifications.unread>9?'9+':notifications.unread;}
      const i=data.identity,s=data.stats,avatar=i.avatarDataUrl?`style="background-image:url('${i.avatarDataUrl.replace(/'/g,'%27')}')"`:'';
      content.innerHTML=`<section class="xp-panel"><div class="xp-profile-hero"><div class="xp-avatar" ${avatar}>${i.avatarDataUrl?'':xpEsc((i.displayName||'?')[0].toUpperCase())}</div><div class="xp-profile-copy"><h1>${xpEsc(i.displayName)}</h1><p>${xpEsc(i.email)}</p><span class="xp-badge" style="display:inline-block;margin-top:8px">${xpEsc(s.tier)}</span></div></div><div class="xp-stat-grid">${metric(s.points,'POINTS')}${metric(s.countries,'КРАЇНИ')}${metric(s.familyEsims,'ДЛЯ БЛИЗЬКИХ')}${metric(s.activeFamilyTrips,'ПОЇЗДКИ')}</div></section><section class="xp-smart-card" style="margin-top:14px"><small>${xpEsc(data.smart.eyebrow)}</small><h2>${xpEsc(data.smart.title)}</h2><p>${xpEsc(data.smart.message)}</p><a class="xp-btn" href="${xpEsc(data.smart.action.url)}">${xpEsc(data.smart.action.label)}</a></section><div class="xp-section-kicker">МІЙ SIGNAL</div><section class="xp-panel xp-menu">${row('notifications.html','bell','Сповіщення',notifications.unread?`${notifications.unread} непрочитаних`:'Усе прочитано')}${row('activity.html','history','Історія активності','Покупки, eSIM, підтримка й Points')}${row('savings.html','savings','Моя економія','Витрати Signal та орієнтовна вигода')}${row('family-center.html','family','Сімейний центр','eSIM близьких і спільні поїздки')}</section><div class="xp-section-kicker">ЗВ’ЯЗОК І ОПЛАТА</div><section class="xp-panel xp-menu">${row('esim-management.html','sim','Моя eSIM','Встановлення, відновлення та статус')}${row('wallet-pass.html','card','Travel Pass','Google Wallet та офлайн-доступ')}${row('payments.html','card','Оплати й підписка','Stripe, картка та історія оплат')}${row('app-tools.html','help','Допомога з підключенням','Мережа, APN і безпечна діагностика')}</section><div class="xp-section-kicker">АКАУНТ</div><section class="xp-panel xp-menu">${row('account-settings.html','settings','Акаунт і безпека','Фото, ім’я, PIN, Face ID та сесії')}${row('support.html','help','Підтримка','Звернення й відповіді команди')}${row('language.html','settings','Мова застосунку','Українська або English')}</section><button id="logout" class="xp-btn danger" style="margin-top:16px">Вийти з акаунта</button>`;
      logout.onclick=()=>{localStorage.removeItem('signal_session_token');localStorage.removeItem('signal_email');location.href='login.html'};
    }).catch(error=>content.innerHTML=`<div class="xp-note">${xpEsc(error.message)}</div>`);
  </script>
</body>
</html>
