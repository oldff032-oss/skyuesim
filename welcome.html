<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Signal — подорожуй без меж</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="signal-v5.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#020713"><script src="pwa.js"></script></head><body class="signal-v5 onboard-v5"><main class="o-shell"><div class="o-brand"><img src="signal-premium-logo.png" alt=""><span><strong>Signal</strong><small>eSIM для подорожей</small></span></div><h1 class="onboard-title">Ласкаво просимо<br>до Signal</h1><p class="onboard-sub">Більше світу. Менше турбот.</p><section class="o-glass language-box"><h2 style="font-size:18px;margin-bottom:10px">Обери мову</h2><button class="language-choice selected" type="button" onclick="choose('uk')"><span class="flag">🇺🇦</span><span><strong>Українська</strong></span><span class="arrow">✓</span></button><button class="language-choice" type="button" onclick="choose('en')"><span class="flag">🇬🇧</span><span><strong>English</strong></span><span class="arrow">○</span></button></section><div class="onboard-bottom"><a id="continue" class="o-btn" href="register-email.html?step=details">Продовжити　→</a><p style="text-align:center;margin:16px 0 0;color:#91a5ca">Вже маєш акаунт? <a class="o-link" href="login.html">Увійти</a></p></div></main><script>function choose(language){localStorage.setItem('signal_language',language);document.documentElement.lang=language;document.getElementById('continue').textContent=language==='en'?'Continue　→':'Продовжити　→';document.querySelectorAll('.language-choice').forEach((el,i)=>{const active=(language==='uk'&&i===0)||(language==='en'&&i===1);el.classList.toggle('selected',active);el.querySelector('.arrow').textContent=active?'✓':'○'})}</script></body></html>
