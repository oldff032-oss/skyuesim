<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Акаунт створено — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="signal-v5.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
<script src="pwa.js"></script>
</head>
<body class="signal-v5 created-v5">
  <div class="o-shell">
    <div class="o-brand" style="align-self:flex-start"><img src="signal-premium-logo.png" alt=""><span><strong>Signal</strong><small>eSIM для подорожей</small></span></div>
    <div class="o-stepper" style="width:100%" aria-label="Крок 4 з 4"><span class="o-step done" data-step="1">Мова</span><span class="o-step done" data-step="2">Акаунт</span><span class="o-step done" data-step="3">Підтвердження</span><span class="o-step active" data-step="4">Готово</span></div>
    <div class="done-orb">✓</div>
    <h1 data-i18n-uk="Ваш профіль готовий" data-i18n-en="Your profile is ready" style="font:700 32px 'Space Grotesk'">Ваш профіль готовий</h1>
    <p class="lead" data-i18n-uk="Тепер ви можете підключати eSIM і залишатися на зв’язку в будь-якій точці світу." data-i18n-en="Now you can connect an eSIM and stay online anywhere in the world." style="max-width:360px">Тепер ви можете підключати eSIM і залишатися на зв’язку в будь-якій точці світу.</p>
    <div id="referralNotice" class="glass" style="display:none;max-width:320px;padding:14px;margin-bottom:18px;font-size:13px;line-height:1.5;"></div>

    <div class="finish-list"><a class="o-card" href="profile.html"><i>◉</i><span><b>Додати фото</b><small>Це необов’язково — можна зробити пізніше.</small></span>›</a><a class="o-card" href="security.html"><i>♙</i><span><b>Налаштувати захист</b><small>PIN, Face ID або графічний ключ.</small></span>›</a></div>
    <a class="o-btn" href="device-check.html" data-i18n-uk="Почати подорож" data-i18n-en="Start your journey">Почати подорож　→</a>
  </div>
  <script src="config.js"></script>
  <script>
    (async()=>{ try { const response=await fetch(`${API_URL}/api/account/referral-status`,{headers:{'x-session-token':localStorage.getItem('signal_session_token')}}); const data=await response.json(); if(data.referredBy){const notice=document.getElementById('referralNotice');notice.style.display='block';notice.innerHTML='🎁 <b>Код запрошення прийнято</b><br>Винагорода буде нарахована протягом 12–24 годин.';} }catch(e){} })();
  </script>
</body>
</html>
