<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Зміни тарифів — Signal Admin</title><link rel="stylesheet" href="style.css"><style>
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:18px 0}.metric{padding:17px}.metric strong{display:block;font-size:24px}.metric span,.muted{color:var(--text-muted);font-size:12px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.filters input,.filters select{min-width:180px}.changes{display:grid;gap:12px}.change{padding:18px;display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(160px,1fr) minmax(150px,.8fr) auto;gap:16px;align-items:center}.route{font-weight:700;margin:5px 0}.meta{font-size:12px;color:var(--text-muted);line-height:1.6}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700}.scheduled{background:#3b82f622;color:#77adff}.provisioning{background:#f59e0b22;color:#f8bc54}.completed{background:#22c55e22;color:#55d886}.failed,.needs_attention{background:#ef444422;color:#ff7373}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:36px;text-align:center;color:var(--text-muted)}@media(max-width:760px){.admin-main{padding:18px 14px}.change{grid-template-columns:1fr}.actions .btn{width:100%}.filters>*{width:100%;min-width:0}}
</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">🛡️</div><span>Signal Admin</span></div><nav class="admin-nav"><a href="admin-dashboard.html">📊 Dashboard</a><a href="admin-purchases.html">🧾 Покупки</a><a class="active" href="admin-plan-changes.html">🔄 Зміни тарифів</a><a href="admin-users.html">👥 Користувачі</a><a href="admin-diagnostics.html">🩺 Діагностика</a><a href="#" onclick="logout()">⏏ Вийти</a></nav></aside><main class="admin-main"><h1>🔄 Зміни тарифів</h1><p class="lead">Видно, хто змінив тариф, коли буде активація, чи видано нову eSIM і чи скасовано стару підписку.</p><div id="summary" class="summary"></div><div class="filters"><input id="search" placeholder="Email, тариф або пакет…"><select id="status"><option value="">Усі статуси</option><option value="scheduled">Заплановано</option><option value="provisioning">Виконується</option><option value="completed">Завершено</option><option value="needs_attention">Потрібна увага</option><option value="failed">Помилка</option></select><button class="btn ghost" style="width:auto" onclick="load()">Оновити</button></div><div id="changes" class="changes"><div class="shimmer" style="height:150px"></div></div></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();let all=[];const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=value=>value?new Date(value).toLocaleString('uk-UA'):'—';const labels={scheduled:'Заплановано',provisioning:'Виконується',completed:'Завершено',failed:'Помилка',needs_attention:'Потрібна увага'};
async function load(){try{const response=await adminFetch('/api/admin/plan-changes');const data=await response.json();if(!response.ok)throw new Error(data.error||'Не вдалося завантажити зміни');all=data.changes||[];document.getElementById('summary').innerHTML=[['Усього',data.totals.all],['Заплановано',data.totals.scheduled],['Виконується',data.totals.provisioning],['Завершено',data.totals.completed],['Потрібна увага',data.totals.failed]].map(x=>`<div class="glass metric"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');render()}catch(error){document.getElementById('changes').innerHTML=`<div class="glass empty">${esc(error.message)}</div>`}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),status=document.getElementById('status').value;const list=all.filter(x=>(!status||x.displayStatus===status)&&(!q||`${x.email} ${x.packageName} ${x.packageCode} ${x.previousPlan}`.toLowerCase().includes(q)));document.getElementById('changes').innerHTML=list.length?list.map(x=>`<article class="glass change"><div><div class="muted">${esc(x.email)}</div><div class="route">${esc(x.previousPlan||'Попередній тариф')} → ${esc(x.packageName||x.packageCode||'Новий тариф')}</div><div class="meta">${x.dataLimitGb==null?'Безліміт':esc(x.dataLimitGb)+' ГБ'} · ${esc(x.durationDays||'—')} днів · ${esc(x.location||'усі регіони')}</div></div><div><span class="badge ${esc(x.displayStatus)}">${labels[x.displayStatus]||esc(x.displayStatus)}</span><div class="meta" style="margin-top:8px">Режим: ${x.changeMode==='after_expiry'?'після завершення':'негайно'}<br>Заплановано: ${fmt(x.scheduledFor)}<br>Оплачено: ${fmt(x.paidAt)}</div></div><div class="meta">Сума: ${x.amountCents==null?'—':(x.amountCents/100).toFixed(2)+' '+String(x.currency||'usd').toUpperCase()}<br>Покупка: ${esc(x.id)}${x.fulfillmentError?`<br><span style="color:#ff7373">${esc(x.fulfillmentError)}</span>`:''}</div><div class="actions"><button class="btn ghost" style="width:auto" onclick="location.href='admin-purchases.html?email=${encodeURIComponent(x.email)}'">Покупки</button>${x.fulfillmentStatus==='failed'?`<button class="btn primary" style="width:auto" onclick="retry('${encodeURIComponent(x.email)}','${encodeURIComponent(x.id)}')">Повторити</button>`:''}<button class="btn ghost" style="width:auto" onclick="location.href='admin-diagnostics.html?email=${encodeURIComponent(x.email)}'">Діагностика</button></div></article>`).join(''):'<div class="glass empty">Змін тарифу за цим фільтром немає.</div>'}
async function retry(email,id){if(!confirm('Повторити видачу вже оплаченої eSIM? Нова оплата не створюється.'))return;const response=await adminFetch(`/api/admin/users/${email}/purchases/${id}/retry-provision`,{method:'POST'});const data=await response.json();if(!response.ok)return alert(data.error||'Не вдалося повторити');alert(data.cancellationError?'Нову eSIM видано, але стара підписка потребує перевірки.':'Зміну тарифу завершено.');load()}document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);load();
</script></body></html>
