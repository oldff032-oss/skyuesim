<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поповнення SIM — Signal Admin</title><link rel="stylesheet" href="style.css"><style>
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{min-width:210px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:10px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.metric{padding:15px}.metric b{display:block;font-size:22px;margin-top:5px}.provider{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:14px;background:rgba(245,184,75,.08);border:1px solid rgba(245,184,75,.22)}.provider.ready{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.22)}.dot{width:9px;height:9px;border-radius:50%;background:#f5b84b}.ready .dot{background:#34d399;box-shadow:0 0 10px #34d399}.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;background:rgba(245,184,75,.1);color:#f5c46b}.status.delivered{background:rgba(52,211,153,.1);color:#59dfa9}.status.failed,.status.checkout_failed{background:rgba(248,113,113,.1);color:#ff9090}.phone{font-family:'Space Mono',monospace}.error{max-width:330px;color:var(--danger);font-size:11px;line-height:1.4;margin-top:4px}.empty{padding:28px;text-align:center;color:var(--text-muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{width:auto;padding:7px 9px;font-size:11px}@media(max-width:700px){.toolbar>*{width:100%;min-width:0!important}.summary{grid-template-columns:1fr 1fr}}
</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">S</div><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Поповнення SIM</h1><p class="lead">Пакети мобільного інтернету для фізичних SIM через партнерську мережу.</p><div id="provider" class="provider"><i class="dot"></i><span>Перевіряємо партнера…</span></div><div class="summary"><div class="glass metric">Усього<b id="all">0</b></div><div class="glass metric">Зараховано<b id="delivered">0</b></div><div class="glass metric">В обробці<b id="processing">0</b></div><div class="glass metric">Помилки<b id="failed">0</b></div></div><div class="toolbar"><input id="search" placeholder="Email, номер, оператор, транзакція"><select id="statusFilter"><option value="">Усі статуси</option><option value="awaiting_payment">Очікує оплату</option><option value="processing">В обробці</option><option value="delivered">Зараховано</option><option value="failed">Помилка</option><option value="checkout_failed">Помилка Checkout</option></select><button class="btn ghost" style="width:auto" onclick="load()">Оновити</button></div><div class="glass" style="overflow:auto"><table class="admin-table" style="display:table;min-width:1180px"><thead><tr><th>Створено / клієнт</th><th>Номер / оператор</th><th>Пакет</th><th>Оплата</th><th>Зарахування</th><th>Ідентифікатори</th><th>Дії</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" hidden>Поповнень ще немає.</div></div></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();let orders=[];const role=localStorage.getItem('signal_admin_role');const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const money=(cents,currency)=>{try{return new Intl.NumberFormat('uk-UA',{style:'currency',currency:String(currency||'usd').toUpperCase()}).format(Number(cents||0)/100)}catch{return `${(Number(cents||0)/100).toFixed(2)} ${String(currency||'').toUpperCase()}`}};const label=value=>({awaiting_payment:'Очікує оплату',paid:'Оплачено',processing:'В обробці',delivered:'Зараховано',failed:'Помилка',checkout_failed:'Checkout не створено'}[value]||value||'—');
async function load(){try{const response=await adminFetch('/api/admin/mobile-topups'),data=await response.json();if(!response.ok)throw new Error(data.error||'Не вдалося завантажити поповнення');orders=data.orders||[];provider.classList.toggle('ready',data.provider?.configured);provider.querySelector('span').textContent=data.provider?.configured?`${data.provider.provider} підключено · ${data.provider.live?'робочий режим':'pre-production'}`:'DT One не налаштовано · нові оплати заблоковані';all.textContent=data.totals?.all||0;delivered.textContent=data.totals?.delivered||0;processing.textContent=data.totals?.processing||0;failed.textContent=data.totals?.failed||0;render()}catch(error){provider.querySelector('span').textContent=error.message}}
function render(){const query=search.value.trim().toLowerCase(),status=statusFilter.value;const rows=orders.filter(item=>(!status||item.status===status)&&(!query||[item.email,item.phone,item.phoneMasked,item.operatorName,item.productName,item.providerTransactionId,item.stripeSessionId].some(value=>String(value||'').toLowerCase().includes(query))));empty.hidden=Boolean(rows.length);tbody.innerHTML=rows.map(item=>`<tr><td>${new Date(item.createdAt).toLocaleString('uk-UA')}<br><b>${esc(item.email)}</b></td><td><span class="phone">${esc(item.phone||item.phoneMasked)}</span><br><span class="muted">${esc(item.operatorName||'—')} · ${esc(item.countryName||'—')}</span></td><td><b>${esc(item.data||item.productName||'Пакет даних')}</b><br><span class="muted">${esc(item.validity||item.productName||'')}</span></td><td>${esc(money(item.amountCents,item.currency))}<br><span class="muted">${esc(item.paymentStatus||'—')}</span></td><td><span class="status ${esc(item.status)}">${esc(label(item.status))}</span>${item.providerStatus?`<div class="muted" style="margin-top:5px">${esc(item.providerStatus)}</div>`:''}${item.fulfillmentError?`<div class="error">${esc(item.fulfillmentError)}</div>`:''}</td><td><span class="muted">Order:</span> ${esc(item.id)}<br><span class="muted">DT One:</span> ${esc(item.providerTransactionId||'—')}<br><span class="muted">Stripe:</span> ${esc(item.stripeSessionId||'—')}</td><td><div class="actions"><button class="btn ghost" onclick="location.href='admin-users.html?email=${encodeURIComponent(item.email)}'">Клієнт</button>${item.phone?`<button class="btn ghost" onclick="copyPhone('${encodeURIComponent(item.phone)}')">Копіювати номер</button>`:''}${role==='super_admin'&&item.paymentStatus==='paid'&&item.status!=='delivered'?`<button class="btn" onclick="retry('${encodeURIComponent(item.id)}')">Повторити</button>`:''}</div></td></tr>`).join('')}
async function retry(id){if(!confirm('Повторно перевірити або виконати оплачене поповнення? Дія доступна лише Super Admin із підтвердженою 2FA.'))return;try{const response=await adminFetch(`/api/admin/mobile-topups/${id}/retry`,{method:'POST',body:'{}'}),data=await response.json();if(!response.ok)throw new Error(data.error);alert(data.state==='delivered'?'Пакет зараховано.':'Оператор ще обробляє поповнення.');load()}catch(error){alert(error.message)}}
function copyPhone(value){navigator.clipboard.writeText(decodeURIComponent(value)).then(()=>alert('Номер скопійовано')).catch(()=>alert('Не вдалося скопіювати номер'))}search.oninput=render;statusFilter.onchange=render;load();
</script></body></html>
