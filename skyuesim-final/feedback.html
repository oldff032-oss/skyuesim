<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Оцінити застосунок — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#05060d"><script src="pwa.js"></script><style>
.feedback-wrap{max-width:560px;margin:auto;padding-bottom:42px}.feedback-card{padding:22px;margin-top:20px}.rating-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.rating-button{height:58px;border:1.5px solid var(--border);border-radius:16px;background:rgba(255,255,255,.035);color:#8d98b4;font-size:28px;cursor:pointer;transition:.18s}.rating-button.selected{border-color:#ffd35a;background:rgba(255,198,54,.12);color:#ffd35a;transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,190,44,.13)}.rating-label{text-align:center;min-height:20px;color:var(--text-muted);font-size:13px;margin-top:11px}.feedback-text{width:100%;min-height:145px;margin-top:18px;padding:16px;border:1.5px solid var(--border);border-radius:17px;background:rgba(255,255,255,.035);color:var(--text);font:inherit;line-height:1.55;resize:vertical;box-sizing:border-box}.feedback-text:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.14)}.success-panel{display:none;text-align:center;padding:34px 20px;margin-top:20px}.success-icon{width:66px;height:66px;margin:auto;border-radius:50%;display:grid;place-items:center;background:rgba(39,211,164,.14);color:#45e6b9;font-size:30px}
</style></head><body><main class="wrap feedback-wrap"><div class="brand"><div class="mark">⭐</div><span>Signal</span></div><a href="profile.html" class="muted" style="display:inline-block;margin-top:22px;text-decoration:none" data-i18n-uk="← Профіль" data-i18n-en="← Profile">← Профіль</a><section id="feedbackForm" class="glass feedback-card"><h1 data-i18n-uk="Оцінити застосунок" data-i18n-en="Rate the app" style="font-size:26px">Оцінити застосунок</h1><p class="lead" data-i18n-uk="Твоя думка допомагає нам робити Signal кращим" data-i18n-en="Your feedback helps us make Signal better">Твоя думка допомагає нам робити Signal кращим</p><div class="rating-grid" role="radiogroup" aria-label="Оцінка"><button class="rating-button" data-value="1" type="button">★</button><button class="rating-button" data-value="2" type="button">★</button><button class="rating-button" data-value="3" type="button">★</button><button class="rating-button" data-value="4" type="button">★</button><button class="rating-button" data-value="5" type="button">★</button></div><div id="ratingLabel" class="rating-label" data-i18n-uk="Обери оцінку від 1 до 5" data-i18n-en="Choose a rating from 1 to 5">Обери оцінку від 1 до 5</div><textarea id="feedbackText" class="feedback-text" maxlength="1000" data-i18n-placeholder-uk="Що тобі подобається або що можна покращити?" data-i18n-placeholder-en="What do you like, or what could we improve?" placeholder="Що тобі подобається або що можна покращити?"></textarea><div id="error" class="err-text" style="display:none;margin-top:12px"></div><button id="send" class="btn" type="button" style="margin-top:16px" data-i18n-uk="Надіслати відгук" data-i18n-en="Send feedback">Надіслати відгук</button></section><section id="success" class="glass success-panel"><div class="success-icon">✓</div><h2 data-i18n-uk="Дякуємо за відгук!" data-i18n-en="Thank you for your feedback!" style="margin-top:15px">Дякуємо за відгук!</h2><p class="lead" data-i18n-uk="Команда Signal обов’язково його перегляне." data-i18n-en="The Signal team will review it.">Команда Signal обов’язково його перегляне.</p><a class="btn" href="profile.html" data-i18n-uk="Повернутися в профіль" data-i18n-en="Return to profile" style="margin-top:18px">Повернутися в профіль</a></section></main><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';let selectedRating=0;const labels={uk:['','Дуже погано','Погано','Нормально','Добре','Чудово'],en:['','Very poor','Poor','Average','Good','Excellent']};document.querySelectorAll('.rating-button').forEach(button=>button.onclick=()=>{selectedRating=Number(button.dataset.value);document.querySelectorAll('.rating-button').forEach(item=>item.classList.toggle('selected',Number(item.dataset.value)<=selectedRating));const lang=localStorage.getItem('signal_language')==='en'?'en':'uk';document.getElementById('ratingLabel').textContent=`${selectedRating}/5 · ${labels[lang][selectedRating]}`});document.getElementById('send').onclick=async()=>{const error=document.getElementById('error'),button=document.getElementById('send'),message=document.getElementById('feedbackText').value.trim(),english=localStorage.getItem('signal_language')==='en';error.style.display='none';if(!selectedRating){error.textContent=english?'Choose a rating first':'Спочатку обери оцінку';error.style.display='flex';return}button.disabled=true;button.textContent=english?'Sending…':'Надсилаємо…';try{const response=await fetch(`${API_URL}/api/account/feedback`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({rating:selectedRating,message})});if(!response.ok)throw new Error();document.getElementById('feedbackForm').style.display='none';document.getElementById('success').style.display='block'}catch{error.textContent=english?'Could not send feedback. Try again.':'Не вдалося надіслати відгук. Спробуй ще раз.';error.style.display='flex';button.disabled=false;button.textContent=english?'Send feedback':'Надіслати відгук'}};
</script></body></html>
