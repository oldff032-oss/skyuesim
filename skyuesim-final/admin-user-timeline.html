<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хронологія користувача — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.timeline{border-left:2px solid var(--glass-border);margin:24px 10px;padding-left:22px}.event{position:relative;padding:0 0 20px}.event:before{content:'';position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}.event time{color:var(--text-muted);font-size:12px}.event p{margin:5px 0;color:var(--text-muted)}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><img src="signal-premium-logo.png" style="width:34px;border-radius:10px"><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><a href="admin-users.html" class="btn ghost">← Користувачі</a><h1>Хронологія користувача</h1><p class="lead" id="email"></p><div id="loading" class="shimmer" style="height:180px"></div><div id="timeline" class="timeline"></div></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>requireAdminAuth();const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const user=new URLSearchParams(location.search).get('email');email.textContent=user||'Email не вказано';(async()=>{const r=await adminFetch(`/api/admin/users/${encodeURIComponent(user)}/timeline`),d=await r.json();loading.style.display='none';if(!r.ok){timeline.textContent=d.error;return}timeline.innerHTML=d.events.map(x=>`<div class="event"><b>${E(x.title)}</b><time> · ${new Date(x.at).toLocaleString('uk-UA')}</time>${x.detail?`<p>${E(x.detail)}</p>`:''}<span>${E(x.type)}</span></div>`).join('')||'<p>Подій поки немає.</p>'})()</script></body></html>
