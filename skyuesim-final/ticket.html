<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Звернення — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#05060d"><style>
.head{display:flex;align-items:center;gap:12px}.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);text-decoration:none;font-size:20px}.ticket-head{padding:18px;margin-top:18px}.conversation{display:flex;flex-direction:column;gap:11px;margin-top:16px}.msg{max-width:86%;padding:13px 15px;border-radius:17px;font-size:13.5px;line-height:1.58;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--violet));border-bottom-right-radius:5px;color:#fff}.msg.admin{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-border);border-bottom-left-radius:5px}.msg-time{font-size:9.5px;opacity:.7;margin-top:6px}.reply{position:sticky;bottom:10px;padding:13px;margin-top:16px}.reply textarea{width:100%;min-height:76px;padding:13px;border-radius:13px;background:#ffffff0b;border:1px solid var(--border);color:var(--text);font:inherit;resize:vertical}.reply textarea:focus{outline:0;border-color:var(--blue)}.file{width:100%;margin-top:8px;padding:9px;border:1px solid var(--border);border-radius:11px;color:var(--text-muted);font-size:11px}.status{display:inline-flex;padding:4px 9px;border-radius:999px;background:#4f75ff1c;color:#82a6ff;font-size:10px;font-weight:800}@media(max-width:380px){.msg{max-width:94%}}
</style></head><body><div class="wrap"><div class="head"><a class="back" href="support.html">←</a><div class="brand" style="margin:0"><div class="mark">S</div><span>Signal</span></div></div><div id="loading" class="shimmer" style="height:120px;margin-top:20px"></div><div id="content" style="display:none"></div><section id="replyBox" class="glass reply" style="display:none"><textarea id="replyText" maxlength="5000" placeholder="Напишіть відповідь…"></textarea><input class="file" type="file" id="replyAttachment" accept="image/png,image/jpeg,image/webp,application/pdf"><button class="btn" id="replyBtn" style="margin-top:9px" onclick="sendReply()">Надіслати</button></section></div><script src="config.js"></script><script src="pwa.js"></script><script>
const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';const id=new URLSearchParams(location.search).get('id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={open:'Відкрито',in_progress:'У роботі',waiting_customer:'Очікує вас',resolved:'Вирішено',closed:'Закрито'};function attachment(a){if(!a)return'';return a.type?.startsWith('image/')?`<img src="${a.dataUrl}" alt="${esc(a.name||'Файл')}" style="max-width:100%;border-radius:10px;margin-top:8px;display:block">`:`<a href="${a.dataUrl}" download="${esc(a.name||'Файл')}" style="display:block;margin-top:8px;color:inherit;text-decoration:underline">📎 ${esc(a.name||'Файл')}</a>`}function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>550*1024)return reject(new Error('Файл завеликий — максимум 550 КБ.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,dataUrl:reader.result});reader.onerror=()=>reject(new Error('Не вдалося прочитати файл.'));reader.readAsDataURL(file)})}async function load(){const loading=document.getElementById('loading'),content=document.getElementById('content');try{const response=await fetch(`${API_URL}/api/support/tickets/${encodeURIComponent(id)}`,{headers:{'x-session-token':token}}),ticket=await response.json();if(!response.ok)throw new Error(ticket.error||'Не вдалося відкрити звернення');loading.style.display='none';content.style.display='block';content.innerHTML=`<section class="glass ticket-head"><span class="status">${esc(labels[ticket.status]||ticket.status)}</span><h1 style="font-size:20px;margin-top:10px">#${esc(ticket.id)} · ${esc(ticket.subject)}</h1><p class="muted" style="margin-top:6px">${esc(ticket.category)}</p></section><div class="conversation">${ticket.messages.map(m=>`<div class="msg ${m.from==='user'?'user':'admin'}">${esc(m.text).replace(/\n/g,'<br>')}${attachment(m.attachment)}<div class="msg-time">${new Date(m.createdAt).toLocaleString('uk-UA')}</div></div>`).join('')}</div>`;document.getElementById('replyBox').style.display=['closed','resolved'].includes(ticket.status)?'none':'block'}catch(e){loading.style.display='none';content.style.display='block';content.innerHTML=`<div class="glass ticket-head"><div class="err-text">${esc(e.message)}</div></div>`}}async function sendReply(){const text=document.getElementById('replyText').value.trim(),button=document.getElementById('replyBtn');if(!text)return;button.disabled=true;button.textContent='Надсилаємо…';try{const file=await fileData(document.getElementById('replyAttachment').files[0]);const response=await fetch(`${API_URL}/api/support/tickets/${encodeURIComponent(id)}/reply`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({message:text,attachment:file})});if(!response.ok){const data=await response.json();throw new Error(data.error||'Не вдалося надіслати')}document.getElementById('replyText').value='';document.getElementById('replyAttachment').value='';await load()}catch(e){alert(e.message)}finally{button.disabled=false;button.textContent='Надіслати'}}load();
</script></body></html>
