<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Звернення — Signal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#05060d">
  <style>
    html,body{max-width:100%;min-height:100%;overflow-x:hidden}body{margin:0}
    .ticket-page{box-sizing:border-box;display:block!important;width:100%;max-width:650px;min-height:100dvh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
    .ticket-top{display:flex!important;align-items:center;gap:12px;min-height:48px;margin:0 0 18px}.ticket-back{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);text-decoration:none;font-size:22px}.ticket-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:850;color:var(--text)}.ticket-brand img{width:42px;height:42px;display:block;border-radius:12px;object-fit:cover;filter:drop-shadow(0 0 10px #287cff66)}
    #ticketShell{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;width:100%;height:auto!important;min-height:0!important;margin:0!important}#ticketShell[hidden]{display:none!important}
    .ticket-card{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;box-sizing:border-box;width:100%;height:auto!important;min-height:0!important;padding:18px;margin:0!important;border:1px solid var(--glass-border);border-radius:22px;background:var(--glass);box-shadow:0 18px 50px #00000024}.ticket-status{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:#4f75ff1c;color:#91b0ff;font-size:11px;font-weight:800}.ticket-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.ticket-card h1{display:block!important;visibility:visible!important;color:var(--text)!important;font-size:21px;line-height:1.28;margin:11px 0 0;overflow-wrap:anywhere;word-break:break-word}.ticket-meta{display:block!important;color:var(--text-muted)!important;font-size:13px;margin:7px 0 0;overflow-wrap:anywhere}.ticket-loading{height:124px;border-radius:22px;margin:0}#ticketError{display:none;margin:0;padding:16px;border:1px solid #ff6d8a55;border-radius:16px;background:#ff31551a;color:#ff9bad;line-height:1.45}
    #ticketConversation{display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;flex-direction:column;gap:12px;width:100%;height:auto!important;min-height:0!important;margin:16px 0 0!important;padding:0!important}.ticket-message{box-sizing:border-box;display:block!important;position:relative!important;max-width:86%;height:auto!important;min-height:0!important;padding:13px 15px;border-radius:18px;color:var(--text);font-size:14px;line-height:1.55;overflow-wrap:anywhere;word-break:break-word}.ticket-message.user{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--violet));border-bottom-right-radius:6px;color:#fff;box-shadow:0 12px 32px #675cff24}.ticket-message.admin{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-border);border-bottom-left-radius:6px}.ticket-message-time{font-size:10px;opacity:.7;margin-top:7px}.ticket-empty{box-sizing:border-box;width:100%;padding:18px;border:1px dashed var(--glass-border);border-radius:16px;color:var(--text-muted);text-align:center}
    #replyBox{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;inset:auto!important;box-sizing:border-box;width:100%;height:auto!important;min-height:0!important;margin:18px 0 0!important;padding:14px;border:1px solid var(--glass-border);border-radius:22px;background:var(--glass);box-shadow:0 18px 50px #00000024}#replyBox[hidden]{display:none!important}.reply-hint{display:none;margin:0 0 10px;color:#9eb5ef;font-size:12px;line-height:1.45}#replyText{box-sizing:border-box;display:block;width:100%;min-height:96px;margin:0;padding:14px;border-radius:14px;background:#ffffff0b;border:1px solid var(--border);color:var(--text);font:inherit;font-size:16px;line-height:1.45;resize:vertical;-webkit-appearance:none}#replyText:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #3e77ff1f}.ticket-file{box-sizing:border-box;display:block;width:100%;min-width:0;max-width:100%;overflow:hidden;margin:9px 0 0;padding:10px;border:1px solid var(--border);border-radius:12px;color:var(--text-muted);font-size:12px}#replyBtn{box-sizing:border-box;width:100%;min-height:50px;margin:10px 0 0}
    @media(max-width:600px){.ticket-page{padding-left:14px;padding-right:14px}.ticket-top{margin-bottom:14px}.ticket-card{padding:16px;border-radius:19px}.ticket-card h1{font-size:19px}.ticket-message{max-width:92%;font-size:14px}#replyBox{padding:12px;border-radius:19px}.ticket-file{font-size:11px}}
  </style>
</head>
<body>
  <main class="ticket-page">
    <header class="ticket-top"><a class="ticket-back" href="support.html" aria-label="Назад">←</a><div class="ticket-brand"><img class="mark" src="signal-premium-logo.png" alt="Signal"><span>Signal</span></div></header>
    <div id="ticketLoading" class="shimmer ticket-loading" aria-label="Завантаження"></div>
    <div id="ticketError" role="alert"></div>
    <section id="ticketShell" hidden>
      <header id="ticketHeader" class="ticket-card"><span id="ticketStatus" class="ticket-status">Відкрито</span><h1 id="ticketTitle">Звернення</h1><p id="ticketCategory" class="ticket-meta"></p></header>
      <div id="ticketConversation" aria-live="polite"></div>
    </section>
    <section id="replyBox" hidden>
      <p id="replyHint" class="reply-hint">Звернення було вирішено. Ваша відповідь автоматично відкриє його знову.</p>
      <textarea id="replyText" maxlength="5000" placeholder="Напишіть відповідь…"></textarea>
      <input class="ticket-file" type="file" id="replyAttachment" accept="image/png,image/jpeg,image/webp,application/pdf">
      <button class="btn" id="replyBtn" onclick="sendReply()">Надіслати</button>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="pwa.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';
    const id=new URLSearchParams(location.search).get('id'),labels={open:'Відкрито',in_progress:'У роботі',waiting_customer:'Очікує вас',resolved:'Вирішено',closed:'Закрито'},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function attachment(a){if(!a)return'';return a.type?.startsWith('image/')?`<img src="${a.dataUrl}" alt="${esc(a.name||'Файл')}" style="max-width:100%;border-radius:10px;margin-top:8px;display:block">`:`<a href="${a.dataUrl}" download="${esc(a.name||'Файл')}" style="display:block;margin-top:8px;color:inherit;text-decoration:underline">📎 ${esc(a.name||'Файл')}</a>`}
    function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>550*1024)return reject(new Error('Файл завеликий — максимум 550 КБ.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,dataUrl:reader.result});reader.onerror=()=>reject(new Error('Не вдалося прочитати файл.'));reader.readAsDataURL(file)})}
    function showError(message){document.getElementById('ticketLoading').style.display='none';const error=document.getElementById('ticketError');error.textContent=message;error.style.display='block';document.getElementById('ticketShell').hidden=true;document.getElementById('replyBox').hidden=true}
    function renderTicket(ticket){
      document.getElementById('ticketLoading').style.display='none';document.getElementById('ticketError').style.display='none';
      document.getElementById('ticketStatus').textContent=labels[ticket.status]||ticket.status||'Відкрито';document.getElementById('ticketTitle').textContent=`#${ticket.id} · ${ticket.subject||'Звернення'}`;document.getElementById('ticketCategory').textContent=ticket.category||'Підтримка';
      const conversation=document.getElementById('ticketConversation'),messages=Array.isArray(ticket.messages)?ticket.messages.filter(m=>m&&['user','admin'].includes(m.from)):[];
      conversation.innerHTML=messages.length?messages.map(m=>`<article class="ticket-message ${m.from==='user'?'user':'admin'}">${esc(m.text).replace(/\n/g,'<br>')}${attachment(m.attachment)}<div class="ticket-message-time">${new Date(m.createdAt).toLocaleString('uk-UA')}</div></article>`).join(''):'<div class="ticket-empty">Повідомлень у зверненні поки немає.</div>';
      document.getElementById('ticketShell').hidden=false;const replyBox=document.getElementById('replyBox'),resolved=ticket.status==='resolved';replyBox.hidden=ticket.status==='closed';document.getElementById('replyHint').style.display=resolved?'block':'none';document.getElementById('replyBtn').textContent=resolved?'Відповісти та відкрити знову':'Надіслати';
    }
    async function load(){if(!id)return showError('Не вказано номер звернення.');try{const response=await fetch(`${API_URL}/api/support/tickets/${encodeURIComponent(id)}`,{headers:{'x-session-token':token}}),ticket=await response.json();if(!response.ok)throw new Error(ticket.error||'Не вдалося відкрити звернення');renderTicket(ticket)}catch(error){showError(error.message||'Не вдалося відкрити звернення. Перевірте інтернет і спробуйте ще раз.')}}
    async function sendReply(){const text=document.getElementById('replyText').value.trim(),button=document.getElementById('replyBtn');if(!text)return;const oldLabel=button.textContent;button.disabled=true;button.textContent='Надсилаємо…';try{const file=await fileData(document.getElementById('replyAttachment').files[0]);const response=await fetch(`${API_URL}/api/support/tickets/${encodeURIComponent(id)}/reply`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({message:text,attachment:file})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Не вдалося надіслати');document.getElementById('replyText').value='';document.getElementById('replyAttachment').value='';await load();document.getElementById('replyBox').scrollIntoView({behavior:'smooth',block:'end'})}catch(error){alert(error.message)}finally{button.disabled=false;if(button.textContent==='Надсилаємо…')button.textContent=oldLabel}}
    window.scrollTo(0,0);load();
  </script>
</body>
</html>
