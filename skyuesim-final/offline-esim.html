<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Офлайн-картки eSIM — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#05060d"><script src="pwa.js"></script><style>
.offline-wrap{max-width:620px}.offline-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.offline-state{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(52,228,184,.3);border-radius:999px;color:var(--success);font-size:11px}.offline-state i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.unlock{padding:22px;margin-top:20px;text-align:center}.pin{width:180px!important;text-align:center;letter-spacing:10px;font:700 24px 'Space Grotesk',sans-serif!important}.offline-card{padding:20px;margin-top:15px;overflow:hidden}.offline-card header{display:flex;justify-content:space-between;gap:12px}.qr-offline{width:180px;height:180px;object-fit:contain;background:#fff;padding:9px;border-radius:16px;display:block;margin:18px auto}.secret{display:block;padding:12px;border:1px solid var(--border);border-radius:12px;background:#060817;word-break:break-all;font-size:11px;line-height:1.55}.wizard{display:grid;gap:9px;margin-top:16px}.wizard label{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.025);font-size:13px;line-height:1.45}.wizard input{width:20px;height:20px;accent-color:#6c6dff;flex:none}.danger-link{border:0;background:transparent;color:#ff7b8b;font:inherit;font-size:11px;cursor:pointer}
</style></head><body class="has-bottomnav"><main class="wrap offline-wrap"><div class="offline-head"><div class="brand"><div class="mark">🛡️</div><span>Signal Offline</span></div><span class="offline-state"><i></i><span id="networkState">Готово офлайн</span></span></div><h1 style="margin-top:24px">Офлайн-картки eSIM</h1><p class="lead">QR-код, APN та інструкція доступні без мережі. Дані зашифровані вашим окремим PIN.</p><section id="unlock" class="glass unlock"><div id="unlockEmpty" style="display:none"><h2 style="font-size:19px">Карток ще немає</h2><p class="muted" style="margin-top:8px">Відкрийте «Моя eSIM» або «eSIM для близьких» і натисніть «Зберегти офлайн».</p><a class="btn ghost" href="esim-management.html" style="margin-top:15px">До моєї eSIM</a></div><div id="unlockForm"><h2 style="font-size:19px">Розблокувати картки</h2><p class="muted" style="margin-top:7px">Введіть 6-значний офлайн-PIN.</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" style="margin-top:15px"><button class="btn" onclick="unlockCards()" style="margin-top:12px">Відкрити</button><div id="error" class="err-text" style="display:none;margin-top:12px"></div></div></section><div id="cards"></div></main><nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" aria-label="Головна"><span class="nav-icon"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html" aria-label="Тарифи"><span class="nav-icon"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html" aria-label="Витрати"><span class="nav-icon"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html" aria-label="Профіль"><span class="nav-icon"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav><script src="offline-esim.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activePin='';
function network(){networkState.textContent=navigator.onLine?'Захищено локально':'Працює без мережі'}addEventListener('online',network);addEventListener('offline',network);network();
if(!SignalOfflineEsimVault.exists()){unlockForm.style.display='none';unlockEmpty.style.display='block'}
function wizard(){return `<div class="wizard"><label><input type="checkbox"><span><b>1. Додайте eSIM</b><br><span class="muted">Відскануйте QR або введіть код активації вручну.</span></span></label><label><input type="checkbox"><span><b>2. Увімкніть лінію</b><br><span class="muted">Виберіть нову eSIM у налаштуваннях мобільного зв’язку.</span></span></label><label><input type="checkbox"><span><b>3. Мобільні дані</b><br><span class="muted">Призначте цю eSIM для мобільного інтернету.</span></span></label><label><input type="checkbox"><span><b>4. Роумінг даних</b><br><span class="muted">Для туристичної eSIM роумінг повинен бути увімкнений.</span></span></label><label><input type="checkbox"><span><b>5. Перевірте APN</b><br><span class="muted">Якщо інтернет не з’явився, введіть APN з картки.</span></span></label></div>`}
async function unlockCards(){error.style.display='none';try{activePin=pin.value;const vault=await SignalOfflineEsimVault.unlock(activePin);unlock.style.display='none';cards.innerHTML=vault.cards.map(card=>`<article class="glass offline-card"><header><div><div class="muted" style="font-size:10px;letter-spacing:1px">${esc(card.ownerLabel)}</div><h2 style="font-size:20px;margin-top:5px">${esc(card.packageName)}</h2><div class="muted" style="font-size:11px;margin-top:4px">${esc(card.location||'')} ${card.iccidLast4?`· ICCID •••• ${esc(card.iccidLast4)}`:''}</div></div><button class="danger-link" onclick="removeCard('${esc(card.id)}')">Видалити</button></header>${card.qrDataUrl?`<img class="qr-offline" src="${card.qrDataUrl}" alt="QR-код eSIM">`:'<p class="muted" style="margin-top:16px">QR не вдалося зберегти, використайте код активації.</p>'}${card.activationCode?`<p class="muted" style="margin-top:15px">Код активації</p><code class="secret">${esc(card.activationCode)}</code><button class="btn ghost" style="margin-top:9px" onclick="copyText('${encodeURIComponent(card.activationCode)}')">Скопіювати код</button>`:''}${card.apn?`<p class="muted" style="margin-top:15px">APN</p><code class="secret">${esc(card.apn)}</code>`:''}<h3 style="font-size:16px;margin-top:20px">Майстер встановлення</h3>${wizard()}</article>`).join('')||'<div class="glass unlock"><p class="muted">Карток немає.</p></div>';}catch(e){error.textContent=e.message;error.style.display='flex'}}
function copyText(value){const text=decodeURIComponent(value);navigator.clipboard?.writeText(text).then(()=>alert('Скопійовано')).catch(()=>prompt('Скопіюйте:',text))}
async function removeCard(id){if(!confirm('Видалити цю офлайн-картку з телефона? Онлайн eSIM не зміниться.'))return;await SignalOfflineEsimVault.removeCard(id,activePin);location.reload()}
</script></body></html>
