<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сповіщення — Signal Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark">🛡️</div><span>Signal Admin</span></div><nav class="admin-nav"><a href="admin-dashboard.html">📊 Dashboard</a><a href="admin-tickets.html">🎫 Підтримка</a><a href="admin-users.html">👥 Користувачі</a><a href="#" onclick="logout()">⏏ Вийти</a></nav></aside><main class="admin-main"><h1>🔔 Сповіщення працівника</h1><p class="lead">Нові звернення для Super Admin та призначені тікети для Admin.</p><section class="glass" style="max-width:620px;padding:22px;margin-top:18px"><h2 style="font-size:18px">Push на цьому пристрої</h2><p id="status" class="muted" style="margin-top:10px;line-height:1.55">Перевіряємо…</p><button id="enableBtn" class="btn" style="margin-top:16px;width:auto" onclick="enablePush()">Увімкнути / перепідключити push</button><button id="testBtn" class="btn ghost" style="margin-top:16px;width:auto;display:none" onclick="testPush()">Надіслати тест</button><p class="muted" style="margin-top:18px;font-size:12px;line-height:1.5">Кожен адміністратор вмикає push окремо у своєму браузері або телефоні. Не передавайте іншим свій admin-акаунт.</p></section></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();const b64=value=>{const padding='='.repeat((4-value.length%4)%4),raw=atob((value+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(char=>char.charCodeAt(0)))};
async function registration(){if(!('serviceWorker'in navigator))throw new Error('Браузер не підтримує Service Worker');return navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(async reg=>{await reg.update();return navigator.serviceWorker.ready})}
async function load(){try{const reg=await registration(),sub=await reg.pushManager.getSubscription();if(!sub){document.getElementById('status').textContent='Push ще не підключено.';return}const response=await adminFetch(`/api/admin/push/status?endpoint=${encodeURIComponent(sub.endpoint)}`),data=await response.json();document.getElementById('status').textContent=data.registered?'Push підключено до цього admin-акаунта.':'Підписка застаріла — перепідключіть push.';document.getElementById('testBtn').style.display=data.registered?'inline-block':'none'}catch(error){document.getElementById('status').textContent=error.message}}
async function enablePush(){const button=document.getElementById('enableBtn');button.disabled=true;try{if(!('PushManager'in window)||!('Notification'in window))throw new Error('Цей браузер не підтримує push');const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('Дозвіл на сповіщення не надано');const keyResponse=await adminFetch('/api/admin/push/public-key'),key=await keyResponse.json();if(!keyResponse.ok)throw new Error(key.error||'VAPID не налаштовано');const reg=await registration(),old=await reg.pushManager.getSubscription();if(old)await old.unsubscribe();const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key.publicKey)}),response=await adminFetch('/api/admin/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Не вдалося зберегти push');document.getElementById('status').textContent='Push підключено. Натисніть «Надіслати тест».';document.getElementById('testBtn').style.display='inline-block'}catch(error){document.getElementById('status').textContent=error.message}finally{button.disabled=false}}
async function testPush(){try{const response=await adminFetch('/api/admin/push/test',{method:'POST'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Тест не надіслано');document.getElementById('status').textContent=data.delivered?'Тестове сповіщення надіслано.':'Підключений пристрій не знайдено — перепідключіть push.'}catch(error){document.getElementById('status').textContent=error.message}}load();
</script></body></html>
