    body{background:radial-gradient(circle at 50% -15%,#153e7c52,transparent 34%),radial-gradient(circle at 90% 56%,#31145e3c,transparent 40%),#030713;overflow-x:hidden}.premium-home{width:min(100%,520px);padding:calc(max(18px,env(safe-area-inset-top))) 16px calc(104px + env(safe-area-inset-bottom))}.home-head{display:flex;align-items:center;gap:11px}.home-logo{width:48px;height:48px;border-radius:15px;box-shadow:0 0 28px #37aaff66}.wordmark{min-width:0}.wordmark b{display:block;font:700 19px/1 'Space Grotesk',sans-serif;letter-spacing:.22em}.wordmark small{display:block;margin-top:6px;color:#42dcff;font-size:7px;letter-spacing:.34em}.head-space{flex:1}.head-action{position:relative;width:43px;height:43px;flex:none;display:grid;place-items:center;border:1px solid var(--home-line);border-radius:14px;background:#0c1223cc;color:#d7e4ff;text-decoration:none;box-shadow:inset 0 1px #ffffff0d}.head-action svg{width:21px;height:21px}.head-actions{display:flex;gap:7px}.head-badge{position:absolute;right:3px;top:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;display:grid;place-items:center;background:#36ddff;color:#03101a;font-size:8px;font-weight:900;box-shadow:0 0 14px #36ddffaa}.announcement-home{margin-top:14px;padding:12px 14px;border:1px solid #ffc66140;border-radius:16px;background:linear-gradient(135deg,#3d2a123d,#2d17353d);font-size:10px;line-height:1.45}.announcement-home b{display:block;color:#ffd88f;font-size:11px;margin-bottom:3px}
    .loading-card{height:440px;margin-top:20px;border-radius:32px;background:linear-gradient(100deg,#ffffff08 20%,#ffffff16 44%,#ffffff08 68%);background-size:240% 100%;animation:shimmerMove 1.4s linear infinite}@keyframes shimmerMove{to{background-position:-240% 0}}
    .deck-wrap{position:relative;margin-top:21px;padding:0 5px}.deck-shadow{position:absolute;z-index:0;inset:19px -4px -10px;border:1px solid #6899ff2e;border-radius:35px;background:#0b1130;transform:rotate(-2.2deg)}.travel-card{position:relative;isolation:isolate;z-index:1;min-height:440px;overflow:hidden;padding:23px 20px 19px;border:1px solid #73deff7a;border-radius:33px;background:#102348;box-shadow:0 30px 80px #000a,0 0 38px #237dff32,inset 0 1px #ffffff55}.scene:before{content:"";position:absolute;z-index:-3;inset:0;background-image:url('signal-card-scenes-v1.png');background-size:100% 400%;background-repeat:no-repeat;filter:saturate(1.06) contrast(1.03);transform:scale(1.015)}.scene.travel:before{background-position:center 0}.scene.basic:before{background-position:center 33.333%}.scene.standard:before{background-position:center 66.666%}.scene.unlimited:before{background-position:center 100%}.travel-card:after{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(180deg,#041126b8 0,#06152b52 34%,#06102273 68%,#020818ed 100%),linear-gradient(100deg,#031128b0,transparent 72%)}.card-corners{position:absolute;inset:9px;border:1px solid #a9e9ff42;border-radius:25px;pointer-events:none}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.esim-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #48dfff65;border-radius:12px;background:#04284fa6;color:#76efff;font-size:10px;font-weight:900;letter-spacing:.08em;backdrop-filter:blur(12px)}.esim-chip:before{content:"";width:7px;height:7px;border-radius:50%;background:#44edc0;box-shadow:0 0 12px #44edc0}.card-status{color:#e4efff;font-size:9px}.card-title{margin-top:40px;max-width:90%;font:700 clamp(32px,10vw,45px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.045em;text-shadow:0 3px 18px #000c}.card-balance{display:flex;align-items:baseline;gap:8px;margin-top:12px}.card-balance strong{font:700 28px 'Space Grotesk',sans-serif}.card-balance span{color:#c4d2eb;font-size:10px}.card-days{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:9px 11px;border:1px solid #a4ccff32;border-radius:13px;background:#07152eb0;color:#ecf5ff;font-size:10.5px;backdrop-filter:blur(10px)}.card-days svg{width:17px;color:#63e9ff}.card-bottom{position:absolute;left:20px;right:20px;bottom:20px}.card-progress{height:7px;border-radius:99px;background:#ffffff20;overflow:hidden}.card-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3ee6ff,#6a9cff,#b16fff);box-shadow:0 0 16px #57dcff;animation:growHome .9s ease both}.active-plan{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;padding:12px;border:1px solid #56ddff54;border-radius:15px;background:#061a34c9;color:#73ecff;font-size:10px;font-weight:900;letter-spacing:.1em;backdrop-filter:blur(13px)}.active-plan svg{width:19px}.deck-dots{display:flex;justify-content:center;gap:7px;margin-top:15px}.deck-dots i{width:7px;height:7px;border-radius:50%;background:#243354}.deck-dots i.active{background:#2be5ff;box-shadow:0 0 12px #2be5ff}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 2px 11px}.section-head h2{font:700 18px 'Space Grotesk',sans-serif}.section-head a{color:#6be9ff;font-size:9px;text-decoration:none}.owned-strip{display:flex;gap:9px;overflow-x:auto;padding:1px 1px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}.owned-strip::-webkit-scrollbar{display:none}.owned-card{position:relative;isolation:isolate;overflow:hidden;min-width:190px;height:112px;padding:14px;border:1px solid var(--home-line);border-radius:20px;color:inherit;text-decoration:none;scroll-snap-align:start}.owned-card:after,.tier-card:after{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(110deg,#020a1aef,#07132c80)}.owned-card b{display:block;font-size:13px}.owned-card strong{display:block;margin-top:7px;color:#69ecff;font-size:18px}.owned-card span{position:absolute;left:14px;bottom:12px;color:#8fa2c4;font-size:8px}.owned-card em{position:absolute;right:11px;top:11px;padding:5px 7px;border-radius:99px;background:#42e8c71a;color:#72efd4;font-size:7px;font-style:normal;font-weight:900}
    .tier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tier-card{position:relative;isolation:isolate;overflow:hidden;min-width:0;height:196px;padding:13px 10px;border:1px solid #7592df42;border-radius:22px;color:inherit;text-decoration:none;text-align:center;box-shadow:0 16px 40px #0005}.tier-card:after{background:linear-gradient(180deg,#041028a6,#07112c9c 52%,#030714f2)}.tier-card.standard{border-color:#4ee9ff8a;box-shadow:0 0 24px #3eaaff2e,0 16px 40px #0006}.tier-symbol{width:34px;height:34px;margin:auto;border:1px solid #5fdfff55;border-radius:50%;display:grid;place-items:center;background:#0a2b58b8;color:#81efff;font-size:13px;box-shadow:0 0 17px #49cfff44}.tier-card b{display:block;margin-top:12px;font-size:12px}.tier-card strong{display:block;margin-top:5px;color:#52e8ff;font-size:16px}.tier-note{position:absolute;left:7px;right:7px;bottom:9px;min-height:34px;padding:8px 4px;border:1px solid #ffffff18;border-radius:11px;background:#071024b8;color:#a9b8d3;font-size:7.5px;line-height:1.2;display:grid;place-items:center}.tier-price{display:block;margin-top:4px;color:#c8d3e9;font-size:8px}
    .reward-card{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:12px;padding:15px;border:1px solid #aebdff2d;border-radius:21px;background:linear-gradient(120deg,#121b33,#0a1021);color:inherit;text-decoration:none}.reward-medal{width:48px;height:48px;border:1px solid #e6c67675;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#47391d,#181a28 69%);color:#ffd884;font-size:22px;box-shadow:0 0 22px #f3c35d26}.reward-copy{min-width:0}.reward-copy b{display:block;font-size:13px}.reward-copy b span{color:#ffd77f}.reward-copy small{display:block;margin-top:4px;color:#8998b6;font-size:8.5px}.reward-progress{height:5px;margin-top:8px;border-radius:99px;background:#ffffff12;overflow:hidden}.reward-progress i{display:block;height:100%;background:linear-gradient(90deg,#eabf69,#ffdf89);border-radius:inherit}.discount-box{padding-left:11px;border-left:1px solid #ffffff19;text-align:center}.discount-box strong{display:block;color:#ffd781;font-size:18px}.discount-box span{display:block;margin-top:2px;color:#8d9ab3;font-size:7px}.gift-count{position:absolute;right:8px;top:7px;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;background:#ffd06a;color:#151003;font-size:8px;font-weight:900}
    .smart-strip{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border:1px solid #61deff38;border-radius:19px;background:linear-gradient(130deg,#12315b99,#291b5999);color:inherit;text-decoration:none}.smart-orb{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#92f8ff,#318dff 50%,#6724aa);box-shadow:0 0 20px #3cd8ff33}.smart-copy{min-width:0;flex:1}.smart-copy small{display:block;color:#72eaff;font-size:7px;font-weight:900;letter-spacing:.12em}.smart-copy b{display:block;margin-top:4px;font-size:11px}.smart-copy span{display:block;margin-top:3px;color:#8fa0bf;font-size:8.5px;line-height:1.3}.space-launch{display:flex;align-items:center;gap:13px;margin-top:12px;padding:14px;border:1px solid #6c91e743;border-radius:20px;background:#0a1022;color:inherit;text-decoration:none}.space-launch img{width:42px;height:42px;border-radius:13px;box-shadow:0 0 22px #389dff55}.space-launch b{display:block;font-size:12px}.space-launch span{display:block;margin-top:3px;color:#8495b4;font-size:8.5px}.space-launch>i{margin-left:auto;color:#6be9ff;font-style:normal}.quick-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.quick-new{min-width:0;padding:11px 4px;border:1px solid var(--home-line);border-radius:16px;background:#0a1021;color:#9eefff;text-decoration:none;text-align:center}.quick-new svg{width:20px;height:20px}.quick-new span{display:block;margin-top:5px;color:#97a7c3;font-size:7.5px;line-height:1.2}
    @keyframes growHome{from{width:0}}@media(max-width:370px){.premium-home{padding-inline:13px}.travel-card{min-height:410px;padding-inline:17px}.card-bottom{left:17px;right:17px}.tier-grid{gap:6px}.tier-card{height:184px;padding-inline:6px}.tier-card b{font-size:10.5px}.reward-card{gap:8px;padding:12px}.reward-medal{width:42px;height:42px}.wordmark b{font-size:17px}.head-action{width:40px;height:40px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body class="has-bottomnav">
  <main class="wrap premium-home">
    <header class="home-head"><img class="home-logo" src="signal-premium-logo.png" alt="Signal"><div class="wordmark"><b>SIGNAL</b><small>eSIM · TRAVEL</small></div><span class="head-space"></span><div class="head-actions"><a class="head-action" href="signal-club.html" aria-label="Винагороди"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16v11H4zM2.5 6.5h19V10h-19zM12 6.5V21M12 6.5c-4 0-5.2-1.2-5.2-2.5S8 2 9.2 2C11 2 12 6.5 12 6.5Zm0 0c4 0 5.2-1.2 5.2-2.5S16 2 14.8 2C13 2 12 6.5 12 6.5Z"/></svg><span id="giftBadge" class="head-badge" hidden></span></a><a class="head-action" href="notifications.html" aria-label="Сповіщення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="noticeBadge" class="head-badge" hidden></span></a></div></header>
    <div id="announcements"></div><div id="loading" class="loading-card"></div><div id="content" hidden></div>
  </main>
  <nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" class="active" aria-label="Головна"><span class="nav-icon"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html" aria-label="Тарифи"><span class="nav-icon"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html" aria-label="Витрати"><span class="nav-icon"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html" aria-label="Профіль"><span class="nav-icon"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav>
  <script src="config.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token'),savedEmail=localStorage.getItem('signal_email'),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));if(!token)location.href='login.html';
    const api=async path=>{const response=await fetch(`${API_URL}${path}`,{cache:'no-store',headers:{'x-session-token':token}}),data=await response.json().catch(()=>({}));if(response.status===401){localStorage.removeItem('signal_session_token');location.href='login.html'}if(!response.ok)throw Error(data.error||'Не вдалося оновити дані');return data};
    const scene=value=>['travel','basic','standard','unlimited'].includes(value)?value:'unlimited',statusLabel=value=>({ready:'ГОТОВО',preparing:'ГОТУЄТЬСЯ',attention:'УВАГА',ordered:'ЗАМОВЛЕНО'})[value]||'ГОТОВО',icon=name=>({sim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v14H7zM10 11h5v6h-5z"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',usage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>',help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.3 2.2c-.9.4-1.1 1-1.1 1.8M12 17h.01"/></svg>'})[name];
    function activeCard(card){const percent=card.usagePercent==null?0:Math.max(0,Math.min(100,Number(card.usagePercent)));return `<section class="deck-wrap"><div class="deck-shadow"></div><article class="travel-card scene ${scene(card.scene)}"><i class="card-corners"></i><div class="card-top"><span class="esim-chip">eSIM</span><span class="card-status">${esc(card.status==='active'?'АКТИВНА КАРТКА':'SIGNAL CARD')}</span></div><h1 class="card-title">${esc(card.title)}</h1><div class="card-balance"><strong>${esc(card.dataLabel)}</strong><span>${esc(card.totalLabel)}</span></div><div class="card-days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(card.daysLabel)}</div><div class="card-bottom"><div class="card-progress"><i style="width:${card.usagePercent==null?100:Math.max(4,100-percent)}%"></i></div><div class="active-plan">${icon('sim')} ${card.status==='active'?'АКТИВНИЙ ПЛАН':'КАРТКА SIGNAL'}</div></div></article><div class="deck-dots"><i class="active"></i><i></i><i></i><i></i></div></section>`}
    function owned(cards){if(!cards.length)return'';return `<div class="section-head"><h2>Мої картки</h2><a href="activity.html">Вся історія →</a></div><div class="owned-strip">${cards.map(card=>`<a class="owned-card scene ${scene(card.scene)}" href="esim-management.html"><b>${esc(card.title)}</b><strong>${esc(card.dataLabel)}</strong><span>${card.createdAt?new Date(card.createdAt).toLocaleDateString('uk-UA'):'Signal eSIM'}</span><em>${statusLabel(card.status)}</em></a>`).join('')}</div>`}
    function tiers(items){return `<div class="section-head"><h2>Обери свій рівень</h2><a href="plans.html">Усі тарифи →</a></div><div class="tier-grid">${items.map((item,index)=>`<a class="tier-card scene ${scene(item.scene)} ${item.key==='standard'?'standard':''}" href="plans.html?plan=${encodeURIComponent(item.key)}"><span class="tier-symbol">${index===0?'◇':index===1?'⬡':'✦'}</span><b>${esc(item.title)}</b><strong>${esc(item.dataLabel)}</strong><span class="tier-price">${esc(item.priceLabel)} / міс</span><span class="tier-note">${esc(item.note)}</span></a>`).join('')}</div>`}
    function rewards(value){const progress=value.tier?.next?Math.min(100,Math.round(value.points/value.tier.next*100)):100,label=value.redeemable?'ЗНИЖКА ДОСТУПНА':value.next?`ЩЕ ${value.next.pointsNeeded} POINTS`:'МАКСИМАЛЬНИЙ РІВЕНЬ',discount=value.redeemable?value.redeemable.name:value.next?.name||'Усі винагороди відкрито';return `<a class="reward-card" href="signal-club.html"><span class="reward-medal">✦</span><span class="reward-copy"><b>${esc(value.tier.name)} · <span>${value.points} Points</span></b><small>${esc(label)}</small><span class="reward-progress"><i style="width:${progress}%"></i></span></span><span class="discount-box"><strong>${value.redeemable?'✓':'↗'}</strong><span>${esc(discount)}</span></span>${value.availableCount?`<i class="gift-count">${value.availableCount}</i>`:''}</a>`}
    function smart(item){return `<a class="smart-strip" href="${esc(item.action.url)}"><span class="smart-orb">✦</span><span class="smart-copy"><small>${esc(item.eyebrow)}</small><b>${esc(item.title)}</b><span>${esc(item.message)}</span></span><span>›</span></a>`}
    function quick(){return `<div class="quick-row"><a class="quick-new" href="esim-management.html">${icon('sim')}<span>Моя eSIM</span></a><a class="quick-new" href="esim-topup.html">${icon('plus')}<span>Додати пакет</span></a><a class="quick-new" href="usage.html">${icon('usage')}<span>Витрати</span></a><a class="quick-new" href="app-tools.html">${icon('help')}<span>Допомога</span></a></div>`}
    function render(deck,smartItem){giftBadge.hidden=!deck.reward.availableCount;giftBadge.textContent=deck.reward.availableCount||'';content.innerHTML=activeCard(deck.active)+owned(deck.cards)+tiers(deck.tiers)+rewards(deck.reward)+smart(smartItem)+quick()+`<a class="space-launch" href="signal-universe.html"><img src="signal-premium-logo.png" alt="Signal"><span><b>Відкрити Signal Space</b><span>Passport, сім’я, Travel Pass, економія та порятунок</span></span><i>↗</i></a>`;loading.style.display='none';content.hidden=false}
    async function announcementsLoad(){try{const data=await api('/api/account/announcements');announcements.innerHTML=(data.announcements||[]).map(item=>`<div class="announcement-home"><b>${esc(item.title)}</b>${esc(item.message)}</div>`).join('')}catch{}}
    async function load(){try{fetch(`${API_URL}/api/usage`,{cache:'no-store',headers:{'x-session-token':token}}).catch(()=>{});const [deck,smartItem,notices]=await Promise.all([api('/api/account/home-deck'),api('/api/account/smart-trip-status'),api('/api/account/notifications')]);if(notices.unread){noticeBadge.hidden=false;noticeBadge.textContent=notices.unread>9?'9+':notices.unread}render(deck,smartItem)}catch(error){offline(error)}}
    function offline(error){loading.style.display='none';content.hidden=false;content.innerHTML=`<section class="deck-wrap"><div class="deck-shadow"></div><article class="travel-card scene unlimited"><i class="card-corners"></i><div class="card-top"><span class="esim-chip">OFFLINE</span><span class="card-status">ЗАХИЩЕНА КАРТКА</span></div><h1 class="card-title">Signal без мережі</h1><div class="card-balance"><strong>Твоя eSIM</strong></div><div class="card-bottom"><a class="active-plan" href="offline-esim.html">ВІДКРИТИ ОФЛАЙН-КАРТКИ</a></div></article></section><div class="announcement-home"><b>Дані не оновлено</b>${esc(error?.message||'Перевір інтернет і спробуй ще раз.')}</div>`}
    announcementsLoad();load();
  </script>
</body>
</html>
