<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Головна — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
</head>
<body class="has-bottomnav">
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="brand"><div class="mark">📶</div><span>Сигнал</span></div>
      <button class="icon-btn" onclick="logout()" style="position:static; color:var(--text-muted);" title="Вийти">⎋</button>
    </div>

    <div id="announcements" style="margin-top:14px;"></div>

    <div id="loading" class="shimmer" style="height:180px; margin-top:20px;"></div>

    <div id="content" style="display:none;"></div>
  </div>

  <nav class="bottomnav">
    <a href="dashboard.html" class="active"><span class="ic">🏠</span>Головна</a>
    <a href="plans.html"><span class="ic">📶</span>Тариф</a>
    <a href="usage.html"><span class="ic">📊</span>Витрати</a>
    <a href="profile.html"><span class="ic">👤</span>Профіль</a>
  </nav>

  <script src="config.js"></script>
  <script src="pwa.js"></script>
  <script>
    const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const sessionToken = localStorage.getItem('signal_session_token');
    const email = localStorage.getItem('signal_email');
    if(!sessionToken || !email){ window.location.href = 'login.html'; }

    let currentUser = null;
    let qrCountdownTimer = null;
    const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const appLanguage = localStorage.getItem('signal_language') === 'en' ? 'en' : 'uk';
    const appLocale = appLanguage === 'en' ? 'en-US' : 'uk-UA';
    const dataUnits = appLanguage === 'en' ? {b:'B',kb:'KB',mb:'MB',gb:'GB'} : {b:'Б',kb:'КБ',mb:'МБ',gb:'ГБ'};

    function formatGb(value){
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toLocaleString(appLocale, { minimumFractionDigits:2, maximumFractionDigits:4 })} ${dataUnits.gb}` : '—';
    }
    function formatBytes(value){const bytes=Number(value);if(!Number.isFinite(bytes)||bytes<0)return '—';if(bytes<1024)return `${Math.round(bytes).toLocaleString(appLocale)} ${dataUnits.b}`;if(bytes<1024**2)return `${(bytes/1024).toLocaleString(appLocale,{maximumFractionDigits:2})} ${dataUnits.kb}`;if(bytes<1024**3)return `${(bytes/1024**2).toLocaleString(appLocale,{minimumFractionDigits:2,maximumFractionDigits:2})} ${dataUnits.mb}`;return `${(bytes/1024**3).toLocaleString(appLocale,{minimumFractionDigits:2,maximumFractionDigits:4})} ${dataUnits.gb}`;}

    function copyActivationCode(){
      const code = currentUser?.esim?.activationCode;
      if(!code) return;
      navigator.clipboard?.writeText(code).then(() => {
        alert(window.signalT('Код eSIM скопійовано. Відкрий Налаштування → Мобільні дані → Додати eSIM → Ввести дані вручну.', 'eSIM code copied. Open Settings → Cellular Data → Add eSIM → Enter details manually.'));
      }).catch(() => alert(`${window.signalT('Скопіюй цей код вручну:', 'Copy this code manually:')}\n${code}`));
    }

    async function loadAnnouncements(){
      try{
        const res = await fetch(`${API_URL}/api/announcements?email=${encodeURIComponent(email)}`);
        const data = await res.json(); if(!res.ok) return;
        const maintenance = (data.announcements || []).find(item => item.type === 'maintenance');
        if(maintenance){
          document.body.innerHTML = `<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#05060d;color:#f5f7ff;font-family:Inter,-apple-system,sans-serif;text-align:center;"><div style="max-width:460px;"><div style="font-size:54px;">🛠️</div><h1 style="font-family:'Space Grotesk',sans-serif;font-size:30px;margin-top:20px;">Технічні роботи</h1><p style="color:#aeb6c9;line-height:1.65;margin-top:14px;">${String(maintenance.message).replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char])).replace(/\n/g,'<br>')}</p><p style="color:#7f8aa3;font-size:12px;margin-top:20px;">Спробуй ще раз пізніше.</p></div></main>`;
          return;
        }
        document.getElementById('announcements').innerHTML = (data.announcements || []).map(item => `<div class="glass" style="padding:13px 15px;border-color:rgba(59,130,246,.45);margin-top:8px;"><div style="font-weight:700;font-size:13px;">📢 ${String(item.title).replace(/[&<>]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]))}</div><p class="muted" style="margin-top:5px;line-height:1.45;">${String(item.message).replace(/[&<>]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[char])).replace(/\n/g,'<br>')}</p></div>`).join('');
      }catch(e){}
    }

    async function load(){
      try{
        const res = await fetch(`${API_URL}/api/status`,{headers:{'x-session-token':sessionToken}});
        const data = await res.json();
        if(!res.ok){
          if(res.status === 404){ renderNoSubscription(); return; }
          throw new Error(data.error);
        }
        currentUser = data;
        render();
      }catch(e){
        renderNoSubscription();
      }
    }

    function renderNoSubscription(){
      document.getElementById('loading').style.display = 'none';
      const content = document.getElementById('content');
      content.style.display = 'block';
      content.innerHTML = `
        <h1 style="margin-top:24px; font-size:22px;">Привіт! 👋</h1>
        <p class="lead">У тебе ще немає активної підписки. Обери тариф, щоб отримати доступ до інтернету по всій Європі.</p>
        <a class="btn" href="device-check.html" style="margin-top:20px;">Обрати тариф</a>`;
    }

    async function render(){
      if(qrCountdownTimer){ clearInterval(qrCountdownTimer); qrCountdownTimer = null; }
      document.getElementById('loading').style.display = 'none';
      const content = document.getElementById('content');
      content.style.display = 'block';

      if(currentUser.status === 'registered'){
        renderNoSubscription();
        return;
      }

      const planNames = { basic:'Базовий · 10 ГБ', standard:'Стандарт · 20 ГБ', unlimited:'Безліміт' };

      if(currentUser.status === 'active' && currentUser.esim){
        let limitGb = currentUser.esim.dataLimitGb;
        let usedGb = currentUser.esim.usedGb || 0;
        let remainingGb = currentUser.esim.remainingGb ?? (limitGb == null ? null : Math.max(0, limitGb - usedGb));
        let lastUpdateTime = currentUser.esim.lastUpdateTime;
        let usedBytes=currentUser.esim.usedBytes??Math.round(Number(usedGb||0)*(1024**3));
        let totalBytes=currentUser.esim.totalBytes??(limitGb==null?null:Math.round(Number(limitGb)*(1024**3)));
        let remainingBytes=currentUser.esim.remainingBytes??(totalBytes==null?null:Math.max(0,totalBytes-usedBytes));
        try{
          const usageRes = await fetch(`${API_URL}/api/usage`,{headers:{'x-session-token':sessionToken}});
          const usageData = await usageRes.json();
          if(usageRes.ok){
            usedGb = usageData.usedGb;
            limitGb = usageData.totalGb ?? limitGb;
            remainingGb = usageData.remainingGb;
            lastUpdateTime = usageData.lastUpdateTime || lastUpdateTime;
            usedBytes=usageData.usedBytes;totalBytes=usageData.totalBytes;remainingBytes=usageData.remainingBytes;
          }
        }catch(e){}
        const pct = totalBytes ? Math.min(100, Math.round((usedBytes / totalBytes) * 100)) : 0;
        const planLabel = limitGb != null
          ? `${(planNames[currentUser.plan] || currentUser.plan).split(' · ')[0]} · ${formatGb(limitGb)}`
          : (planNames[currentUser.plan] || currentUser.plan);
        const activationCode = currentUser.esim.activationCode || '';
        const appleInstallUrl = activationCode
          ? `https://esimsetup.apple.com/esim_qrcode_provisioning?carddata=${encodeURIComponent(activationCode)}`
          : '';
        const installAction = !activationCode ? '' : isAppleMobile
          ? `<a class="btn" href="${appleInstallUrl}" style="margin-top:16px;">Встановити eSIM</a>`
          : `<button class="btn" type="button" onclick="copyActivationCode()" style="margin-top:16px;">Скопіювати код eSIM</button>`;
        const updateText = lastUpdateTime ? `${window.signalT('Дані оновлено:','Data updated:')} ${new Date(lastUpdateTime).toLocaleString(appLocale)}` : window.signalT('Дані оновлюються провайдером протягом кількох годин.','Data is refreshed by the provider within a few hours.');
        const qrExpiresAt = currentUser.esim.dashboardQrExpiresAt ? new Date(currentUser.esim.dashboardQrExpiresAt).getTime() : 0;
        const showFirstInstallQr = Boolean(currentUser.esim.qrCodeUrl && qrExpiresAt && Date.now() < qrExpiresAt);
        const trafficHeadline = totalBytes == null ? 'Безлімітний інтернет' : `${formatBytes(remainingBytes ?? 0)} залишилось`;
        const trafficSubtitle = totalBytes == null ? `Використано ${formatBytes(usedBytes)} · тариф без обмеження` : `Використано ${formatBytes(usedBytes)} з ${formatBytes(totalBytes)}`;

        content.innerHTML = `
          ${currentUser.displayName ? `<p class="lead" style="margin-top:20px;">Привіт, <b style="color:var(--text);">${escapeHtml(currentUser.displayName)}</b> 👋</p>` : ''}
          <div class="card" style="margin-top:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-family:'Space Grotesk',sans-serif; font-weight:700;">${planLabel}</div>
                <div class="muted" style="margin-top:4px;">ICCID: ${currentUser.esim.iccid}</div>
              </div>
              <span class="status-pill on"><span class="dot"></span>Активовано</span>
            </div>
            <div style="margin-top:14px;">
              <div class="usage-top"><span>Використано трафіку</span><b>${formatBytes(usedBytes)}${totalBytes!=null?` / ${formatBytes(totalBytes)}`:' · безліміт'}</b></div>
              ${limitGb ? `<div class="usage-track"><div class="usage-fill" style="width:${pct}%;"></div></div>` : ''}
              ${remainingBytes != null ? `<p class="muted" style="margin-top:10px;">Залишилось: <b style="color:var(--text);">${formatBytes(remainingBytes)}</b></p>` : ''}
              <p class="muted" style="margin-top:8px;font-size:11px;">${updateText}</p>
            </div>
          </div>

          <div id="qrWrap"></div>

          <a class="btn ghost" href="plans.html" style="margin-top:16px;">Змінити тариф</a>`;

        document.getElementById('qrWrap').innerHTML = showFirstInstallQr ? `
          <div class="card" style="margin-top:14px;border-color:rgba(34,211,238,.42);background:linear-gradient(145deg,rgba(34,211,238,.10),rgba(139,92,246,.12));">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;">QR-код для встановлення eSIM</div><span id="qrCountdown" class="status-pill on">05:00</span></div>
            <div style="margin-top:13px;padding:11px 13px;border-radius:10px;background:rgba(255,190,60,.10);border:1px solid rgba(255,190,60,.28);color:#ffd382;font-size:12px;line-height:1.5;"><b>⚠️ Важливо:</b> не надсилай цей QR-код іншим людям і не публікуй його. Він дає доступ до встановлення твоєї eSIM.</div>
            <p class="muted" style="margin-top:13px;line-height:1.5;">Відскануй QR-код пристроєм, на який хочеш встановити eSIM. На головному екрані він автоматично зникне через 5 хвилин.</p>
            ${currentUser.esim.qrCodeUrl ? `<img src="${escapeHtml(currentUser.esim.qrCodeUrl)}" alt="QR-код встановлення eSIM" style="width:180px;height:180px;object-fit:contain;border-radius:14px;margin:14px auto 0;display:block;background:#fff;padding:9px;" />` : ''}
            ${installAction}
            <p class="muted" style="margin-top:14px;font-size:12px;line-height:1.5;">Після зникнення QR завжди можна знайти у <b style="color:var(--text);">Профіль → Керування eSIM</b>.</p>
          </div>` : `
          <a href="esim-management.html" class="card" style="display:block;margin-top:14px;text-decoration:none;border-color:rgba(139,92,246,.30);">
            <div style="display:flex;align-items:center;gap:13px;"><div style="font-size:27px;">📱</div><div><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;">QR-код прибрано з головного екрана</div><p class="muted" style="margin-top:5px;line-height:1.45;">З міркувань безпеки п’ять хвилин минули. Відкрити знову: <b style="color:var(--text);">Профіль → Керування eSIM</b>.</p></div><span style="margin-left:auto;color:var(--cyan);font-size:20px;">→</span></div>
          </a>
          <a href="usage.html" class="card" style="display:block;margin-top:14px;overflow:hidden;text-decoration:none;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.2));border-color:rgba(34,211,238,.34);">
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="width:88px;height:88px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(#22d3ee ${pct * 3.6}deg,rgba(255,255,255,.13) 0);">
                <div style="width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#101326;color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;">${limitGb == null ? '∞' : `${pct}%`}</div>
              </div>
              <div style="min-width:0;">
                <div class="muted" style="font-size:12px;">Трафік</div>
                <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-top:4px;">${trafficHeadline}</div>
                <p class="muted" style="margin-top:6px;line-height:1.4;">${trafficSubtitle}</p>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);color:#67e8f9;font-size:13px;font-weight:700;"><span>Деталі використання</span><span>→</span></div>
          </a>`;
        if(showFirstInstallQr){
          const updateCountdown=()=>{const remaining=Math.max(0,qrExpiresAt-Date.now()),totalSeconds=Math.ceil(remaining/1000),minutes=Math.floor(totalSeconds/60),seconds=totalSeconds%60,element=document.getElementById('qrCountdown');if(element)element.textContent=`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;if(remaining<=0){clearInterval(qrCountdownTimer);qrCountdownTimer=null;render();}};
          updateCountdown(); qrCountdownTimer=setInterval(updateCountdown,1000);
        }
      } else if(currentUser.status === 'pending_payment'){
        content.innerHTML = `<div class="card" style="margin-top:20px;"><span class="status-pill off"><span class="dot pulse"></span>Очікуємо підтвердження оплати...</span></div>`;
      } else if(currentUser.status === 'canceled'){
        content.innerHTML = `
          <div class="card" style="margin-top:20px;"><span class="status-pill off"><span class="dot"></span>Підписку скасовано</span></div>
          <a class="btn" href="plans.html" style="margin-top:16px;">Оформити нову підписку</a>`;
      } else {
        content.innerHTML = `<div class="card" style="margin-top:20px;"><span class="status-pill off"><span class="dot"></span>Статус: ${currentUser.status || 'невідомо'}</span></div>`;
      }
    }

    function logout(){
      localStorage.removeItem('signal_session_token');
      localStorage.removeItem('signal_email');
      window.location.href = 'login.html';
    }

    load(); loadAnnouncements();
  </script>
</body>
</html>
