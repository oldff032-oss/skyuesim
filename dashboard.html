<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Головна — Signal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070914">
  <script src="pwa.js"></script>
  <style>
    .home{max-width:520px;padding-top:max(24px,env(safe-area-inset-top))}.topbar{display:flex;align-items:center;justify-content:space-between}.identity{display:flex;align-items:center;gap:11px}.logo-orbit{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#2563eb,#7c3aed);box-shadow:0 10px 32px rgba(59,130,246,.38);color:#fff}.logo-orbit svg{width:24px}.hello{font-size:12px;color:var(--text-muted)}.person{font:700 17px 'Space Grotesk',sans-serif}.round-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text);display:grid;place-items:center}.round-btn svg{width:20px}
    .hero-esim{position:relative;overflow:hidden;margin-top:22px;padding:22px;border-radius:28px;background:linear-gradient(145deg,rgba(28,43,91,.96),rgba(16,20,49,.97) 55%,rgba(58,27,94,.92));border:1px solid rgba(125,211,252,.22);box-shadow:0 24px 70px rgba(3,7,22,.45)}.hero-esim:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-110px;top:-120px;background:radial-gradient(circle,rgba(34,211,238,.34),transparent 68%)}.hero-esim:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;left:-130px;bottom:-160px;background:radial-gradient(circle,rgba(139,92,246,.34),transparent 70%)}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px}.network{display:flex;align-items:center;gap:8px;color:#a5f3fc;font-size:12px;font-weight:700}.live-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 14px #34d399}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#dbeafe;font-size:11px;border:1px solid rgba(255,255,255,.1)}.plan-name{position:relative;z-index:1;margin-top:21px;color:#bac8e8;font-size:13px}.balance{position:relative;z-index:1;margin-top:4px;font:700 clamp(34px,10vw,48px) 'Space Grotesk',sans-serif;letter-spacing:-.045em;color:#fff}.balance small{font-size:.42em;letter-spacing:0;color:#93a4c8}.progress{position:relative;z-index:1;height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:20px}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa);box-shadow:0 0 18px rgba(34,211,238,.65)}.stats{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;margin-top:17px;gap:12px}.stat{min-width:0}.stat span{display:block;color:#8798bc;font-size:11px}.stat b{display:block;color:#edf4ff;font-size:13px;margin-top:3px;overflow-wrap:anywhere}
    .section-label{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.section-label h2{font:700 17px 'Space Grotesk',sans-serif}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.quick{min-width:0;padding:14px 7px 11px;border-radius:18px;text-decoration:none;text-align:center;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:.2s transform,.2s border-color}.quick:active{transform:scale(.96)}.quick .qicon{width:40px;height:40px;border-radius:13px;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,rgba(34,211,238,.15),rgba(139,92,246,.18));color:var(--cyan)}.quick svg{width:21px;height:21px}.quick span{display:block;margin-top:8px;font-size:10px;line-height:1.25;overflow-wrap:anywhere}.notice{padding:13px 15px;margin-top:10px;border-radius:17px;background:rgba(59,130,246,.11);border:1px solid rgba(59,130,246,.27);font-size:12px;line-height:1.45}
    .signal-hub{position:relative;margin-top:24px;padding:11px;border-radius:29px;background:linear-gradient(145deg,rgba(13,20,48,.94),rgba(16,13,42,.96));border:1px solid rgba(108,165,255,.23);box-shadow:0 24px 62px rgba(0,0,0,.34);overflow:hidden}.signal-hub:before{content:"";position:absolute;width:210px;height:210px;right:-120px;top:-120px;border-radius:50%;background:#2ad9ff;filter:blur(48px);opacity:.18}.signal-launch{position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;min-height:108px;padding:17px;border-radius:22px;text-decoration:none;color:inherit;background:linear-gradient(125deg,rgba(24,75,151,.76),rgba(66,35,136,.77));border:1px solid rgba(93,226,255,.3);overflow:hidden}.signal-launch:after{content:"";position:absolute;z-index:-1;width:130px;height:130px;right:-52px;bottom:-72px;border-radius:50%;background:radial-gradient(circle,#ad5cff88,transparent 68%)}.signal-launch-logo{position:relative;width:62px;height:62px;flex:none;display:grid;place-items:center}.signal-launch-logo:before,.signal-launch-logo:after{content:"";position:absolute;border-radius:20px;border:1px solid rgba(98,225,255,.4);inset:4px;transform:rotate(13deg)}.signal-launch-logo:after{inset:-2px;transform:rotate(-12deg);border-color:rgba(166,104,255,.35)}.signal-launch-logo img{position:relative;z-index:1;width:48px;height:48px;border-radius:15px;box-shadow:0 0 25px rgba(60,191,255,.6)}.signal-launch-copy{min-width:0;flex:1}.signal-launch-copy small{display:block;color:#83efff;font-size:9px;font-weight:800;letter-spacing:.12em}.signal-launch-copy b{display:block;margin-top:5px;font:700 19px 'Space Grotesk',sans-serif}.signal-launch-copy span{display:block;margin-top:4px;color:#b8c9e9;font-size:10.5px;line-height:1.35}.signal-launch-arrow{position:relative;width:31px;height:31px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#dffbff;font-size:16px}
    .signal-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:9px}.signal-tool{position:relative;min-width:0;min-height:82px;display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(144,179,255,.12);color:inherit;text-decoration:none;overflow:hidden;transition:transform .18s ease,border-color .18s ease,background .18s ease}.signal-tool:active{transform:scale(.97)}.signal-tool:hover{border-color:rgba(86,222,255,.32);background:rgba(61,103,188,.13)}.signal-tool.wide{grid-column:1/-1;min-height:72px}.signal-tool-icon{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:#8cefff;background:linear-gradient(145deg,rgba(27,102,177,.32),rgba(94,47,154,.34));box-shadow:inset 0 1px rgba(255,255,255,.1),0 0 20px rgba(49,186,255,.1)}.signal-tool-icon svg{width:23px;height:23px}.signal-tool:nth-child(2) .signal-tool-icon{color:#dbb1ff}.signal-tool:nth-child(3) .signal-tool-icon{color:#71e9c2}.signal-tool:nth-child(4) .signal-tool-icon{color:#8bbdff}.signal-tool:nth-child(5) .signal-tool-icon{color:#ffb4ce}.signal-tool-copy{min-width:0}.signal-tool-copy b{display:block;font-size:11.5px;line-height:1.25}.signal-tool-copy small{display:block;margin-top:3px;color:#8192b6;font-size:9.5px;line-height:1.3}.signal-tool-dot{position:absolute;width:5px;height:5px;right:10px;top:10px;border-radius:50%;background:#55e8ff;box-shadow:0 0 11px #55e8ff}
    @media(max-width:360px){.home{padding-left:14px;padding-right:14px}.hero-esim{padding:18px}.quick-grid{gap:7px}.quick{padding-left:3px;padding-right:3px}.quick span{font-size:9px}.signal-hub{padding:9px}.signal-launch{padding:14px}.signal-launch-logo{width:54px}.signal-launch-copy span{font-size:9.5px}.signal-tool{padding:10px;gap:8px}.signal-tool-icon{width:36px;height:36px}.signal-tool-copy b{font-size:10.5px}.signal-tool-copy small{font-size:8.5px}}
    @media(prefers-reduced-motion:no-preference){.hero-esim{animation:rise .55s ease both}.quick{animation:rise .45s ease both}.quick:nth-child(2){animation-delay:.05s}.quick:nth-child(3){animation-delay:.1s}.quick:nth-child(4){animation-delay:.15s}.signal-hub{animation:rise .55s .12s ease both}.signal-launch-logo{animation:signalFloat 4s ease-in-out infinite}.signal-tool-icon{animation:signalGlow 3.4s ease-in-out infinite}.signal-tool:nth-child(2) .signal-tool-icon{animation-delay:.4s}.signal-tool:nth-child(3) .signal-tool-icon{animation-delay:.8s}.signal-tool:nth-child(4) .signal-tool-icon{animation-delay:1.2s}.signal-tool:nth-child(5) .signal-tool-icon{animation-delay:1.6s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes signalFloat{50%{transform:translateY(-4px) rotate(2deg)}}@keyframes signalGlow{50%{transform:translateY(-2px);box-shadow:inset 0 1px rgba(255,255,255,.14),0 0 23px rgba(55,207,255,.25)}}}
  </style>
</head>
<body class="has-bottomnav">
  <main class="wrap home">
    <header class="topbar">
      <div class="identity"><div class="logo-orbit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12a7 7 0 0 1 14 0M8 12a4 4 0 0 1 8 0"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg></div><div><div class="hello">Ласкаво просимо</div><div id="person" class="person">Signal</div></div></div>
      <button class="round-btn" onclick="location.href='profile.html'" aria-label="Профіль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></button>
    </header>
    <div id="announcements"></div>
    <div id="loading" class="shimmer" style="height:300px;margin-top:22px;border-radius:28px"></div>
    <div id="content" hidden></div>
  </main>
  <nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" class="active" aria-label="Головна" title="Головна" data-nav="dashboard"><span class="nav-icon" aria-hidden="true"><img class="nav-art" src="nav-home-v2.png" alt=""></span></a><a href="plans.html" aria-label="Тарифи" title="Тарифи" data-nav="plans"><span class="nav-icon" aria-hidden="true"><img class="nav-art" src="nav-plans-v2.png" alt=""></span></a><a href="usage.html" aria-label="Витрати" title="Витрати" data-nav="usage"><span class="nav-icon" aria-hidden="true"><img class="nav-art" src="nav-usage-v2.png" alt=""></span></a><a href="profile.html" aria-label="Профіль" title="Профіль" data-nav="profile"><span class="nav-icon" aria-hidden="true"><img class="nav-art" src="nav-profile-v2.png" alt=""></span></a></nav>
  <script src="config.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token'),savedEmail=localStorage.getItem('signal_email'),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    if(!token)location.href='login.html';
    const icon=name=>({
      sim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M9 3v5h6V3M9 13h2m2 0h2m-6 3h2m2 0h2"/></svg>',
      plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
      help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.3 2.2c-.9.4-1.1 1-1.1 1.8M12 17h.01"/></svg>',
      card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h3"/></svg>',
      passport:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="11" r="3"/><path d="M9 11h6M12 8v6M8 17h8"/></svg>',
      points:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.4 5.2L20 9l-4 4 .9 5.7-4.9-2.6-4.9 2.6L8 13 4 9l5.6-.8L12 3Z"/></svg>',
      family:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M14 15.5a4.5 4.5 0 0 1 6.5 4"/></svg>',
      pass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 5v14M12 9h5M12 13h5"/></svg>',
      rescue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6m5.6 5.6 3.6 3.6m0-12.8-3.6 3.6m-5.6 5.6-3.6 3.6"/></svg>'
    })[name];
    const quick=(href,name,label)=>`<a class="quick" href="${href}"><span class="qicon">${icon(name)}</span><span>${label}</span></a>`;
    const signalTool=(href,name,title,subtitle,wide='')=>`<a class="signal-tool ${wide}" href="${href}"><span class="signal-tool-icon">${icon(name)}</span><span class="signal-tool-copy"><b>${title}</b><small>${subtitle}</small></span><i class="signal-tool-dot"></i></a>`;
    const signalHub=()=>`<section class="signal-hub"><a class="signal-launch" href="signal-universe.html"><span class="signal-launch-logo"><img src="signal-premium-logo.png" alt="Signal"></span><span class="signal-launch-copy"><small>ТВІЙ SIGNAL SPACE</small><b>Відкрити Signal</b><span>Усі можливості подорожі в одному просторі</span></span><span class="signal-launch-arrow">↗</span></a><div class="signal-tools">${signalTool('signal-passport.html','passport','Signal Passport','Країни та штампи')}${signalTool('signal-club.html','points','Signal Points','Бонуси й рівні')}${signalTool('family-trip.html','family','Сімейні поїздки','Готовність близьких')}${signalTool('wallet-pass.html','pass','Travel Pass','Картка для Wallet')}${signalTool('rescue-mode.html','rescue','Режим порятунку','Мережа, eSIM, APN і підтримка','wide')}</div></section>`;
    function show(html){loading.style.display='none';content.hidden=false;content.innerHTML=html+signalHub()}
    async function announcements(){try{const response=await fetch(`${API_URL}/api/account/announcements`,{headers:{'x-session-token':token}}),data=await response.json();announcements.innerHTML=(data.announcements||[]).map(item=>`<div class="notice"><b>${esc(item.title)}</b><div>${esc(item.message)}</div></div>`).join('')}catch{}}
    async function load(){
      try{
        const response=await fetch(`${API_URL}/api/status`,{headers:{'x-session-token':token}}),user=await response.json();
        if(!response.ok)throw Error(user.error);
        person.textContent=user.displayName||user.email||'Signal';
        if(user.status==='registered'||!user.esim)return empty();
        let usage={usedGb:user.esim.usedGb||0,totalGb:user.esim.dataLimitGb,remainingGb:user.esim.remainingGb,lastUpdateTime:user.esim.lastUpdateTime};
        try{const usageResponse=await fetch(`${API_URL}/api/usage`,{headers:{'x-session-token':token}}),fresh=await usageResponse.json();if(usageResponse.ok)usage=fresh}catch{}
        const total=Number(usage.totalGb),used=Number(usage.usedGb||0),remaining=usage.remainingGb==null?(Number.isFinite(total)?Math.max(0,total-used):null):Number(usage.remainingGb),percent=Number.isFinite(total)&&total>0?Math.min(100,Math.round(used/total*100)):100,plan={basic:'Базовий',standard:'Стандарт',unlimited:'Безліміт',custom:'Travel'}[user.plan]||user.plan||'eSIM',expiry=user.esim.expiredTime?new Date(user.esim.expiredTime).toLocaleDateString('uk-UA'):'Без дати';
        show(`<section class="hero-esim"><div class="hero-row"><span class="network"><i class="live-dot"></i>eSIM онлайн</span><span class="pill">${esc(plan)}</span></div><div class="plan-name">Доступний мобільний інтернет</div><div class="balance">${remaining==null?'∞':remaining.toLocaleString('uk-UA',{maximumFractionDigits:2})} <small>${remaining==null?'безліміт':'GB залишилось'}</small></div><div class="progress"><span style="width:${Math.max(4,100-percent)}%"></span></div><div class="stats"><div class="stat"><span>Використано</span><b>${used.toLocaleString('uk-UA',{maximumFractionDigits:2})} GB${Number.isFinite(total)?` із ${total.toLocaleString('uk-UA')} GB`:''}</b></div><div class="stat"><span>Діє до</span><b>${expiry}</b></div></div></section><div class="section-label"><h2>Швидкі дії</h2></div><div class="quick-grid">${quick('esim-management.html','sim','Моя eSIM')}${quick('esim-topup.html','plus','Додати пакет')}${quick('app-tools.html','help','Допомога')}${quick('payments.html','card','Оплата')}</div>`);
      }catch{offlineHome()}
    }
    function offlineHome(){if(navigator.onLine)return empty();person.textContent=savedEmail||'Signal';show(`<section class="hero-esim"><div class="hero-row"><span class="network"><i class="live-dot"></i>Офлайн-режим</span><span class="pill">Без мережі</span></div><div class="plan-name">Встановлення eSIM доступне офлайн</div><div class="balance">Ваші <small>збережені картки</small></div><p style="position:relative;z-index:1;color:#9fb0d0;line-height:1.5;margin-top:18px">Відкрийте зашифровану eSIM-картку, код активації, APN і покроковий майстер без інтернету.</p><a class="btn" href="offline-esim.html" style="position:relative;z-index:1;margin-top:18px">Відкрити офлайн-картки</a></section>`)}
    function empty(){person.textContent=savedEmail||'Signal';show(`<section class="hero-esim"><div class="hero-row"><span class="network">Нова eSIM</span><span class="pill">Готово до старту</span></div><div class="plan-name">Інтернет для подорожей</div><div class="balance">Оберіть <small>свій пакет</small></div><p style="position:relative;z-index:1;color:#9fb0d0;line-height:1.5;margin-top:18px">Підключення займає кілька хвилин. Оплата та встановлення eSIM відбуваються покроково.</p><a class="btn" href="plans.html" style="position:relative;z-index:1;margin-top:18px">Переглянути тарифи</a></section>`)}
    announcements();load();
  </script>
</body>
</html>
