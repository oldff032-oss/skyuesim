<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Головна — Signal</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#070914"><script src="pwa.js"></script><style>
.home{max-width:520px;padding-top:max(24px,env(safe-area-inset-top))}.topbar{display:flex;align-items:center;justify-content:space-between}.identity{display:flex;align-items:center;gap:11px}.logo-orbit{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#2563eb,#7c3aed);box-shadow:0 10px 32px rgba(59,130,246,.38);color:#fff}.logo-orbit svg{width:24px}.hello{font-size:12px;color:var(--text-muted)}.person{font:700 17px 'Space Grotesk',sans-serif}.round-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text);display:grid;place-items:center}.round-btn svg{width:20px}.hero-esim{position:relative;overflow:hidden;margin-top:22px;padding:22px;border-radius:28px;background:linear-gradient(145deg,rgba(28,43,91,.96),rgba(16,20,49,.97) 55%,rgba(58,27,94,.92));border:1px solid rgba(125,211,252,.22);box-shadow:0 24px 70px rgba(3,7,22,.45)}.hero-esim:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-110px;top:-120px;background:radial-gradient(circle,rgba(34,211,238,.34),transparent 68%)}.hero-esim:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;left:-130px;bottom:-160px;background:radial-gradient(circle,rgba(139,92,246,.34),transparent 70%)}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px}.network{display:flex;align-items:center;gap:8px;color:#a5f3fc;font-size:12px;font-weight:700}.live-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 14px #34d399}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#dbeafe;font-size:11px;border:1px solid rgba(255,255,255,.1)}.plan-name{position:relative;z-index:1;margin-top:21px;color:#bac8e8;font-size:13px}.balance{position:relative;z-index:1;margin-top:4px;font:700 clamp(34px,10vw,48px) 'Space Grotesk',sans-serif;letter-spacing:-.045em;color:#fff}.balance small{font-size:.42em;letter-spacing:0;color:#93a4c8}.progress{position:relative;z-index:1;height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:20px}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa);box-shadow:0 0 18px rgba(34,211,238,.65)}.stats{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;margin-top:17px;gap:12px}.stat{min-width:0}.stat span{display:block;color:#8798bc;font-size:11px}.stat b{display:block;color:#edf4ff;font-size:13px;margin-top:3px;overflow-wrap:anywhere}.section-label{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.section-label h2{font:700 17px 'Space Grotesk',sans-serif}.section-label a{font-size:12px;color:var(--cyan);text-decoration:none}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.quick{min-width:0;padding:14px 7px 11px;border-radius:18px;text-decoration:none;text-align:center;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:.2s transform,.2s border-color}.quick:active{transform:scale(.96)}.quick .qicon{width:40px;height:40px;border-radius:13px;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,rgba(34,211,238,.15),rgba(139,92,246,.18));color:var(--cyan)}.quick svg{width:21px;height:21px}.quick span{display:block;margin-top:8px;font-size:10px;line-height:1.25;overflow-wrap:anywhere}.smart-card{display:flex;align-items:center;gap:13px;margin-top:12px;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-border);text-decoration:none;color:inherit}.smart-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(52,211,153,.12);color:#34d399;flex:none}.smart-icon svg{width:22px}.smart-copy{min-width:0;flex:1}.smart-copy b{font-size:13px}.smart-copy p{font-size:11px;margin-top:3px;color:var(--text-muted);line-height:1.4}.arrow{color:var(--text-muted)}.notice{padding:13px 15px;margin-top:10px;border-radius:17px;background:rgba(59,130,246,.11);border:1px solid rgba(59,130,246,.27);font-size:12px;line-height:1.45}@media(max-width:360px){.home{padding-left:14px;padding-right:14px}.hero-esim{padding:18px}.quick-grid{gap:7px}.quick{padding-left:3px;padding-right:3px}.quick span{font-size:9px}}@media(prefers-reduced-motion:no-preference){.hero-esim{animation:rise .55s ease both}.quick{animation:rise .45s ease both}.quick:nth-child(2){animation-delay:.05s}.quick:nth-child(3){animation-delay:.1s}.quick:nth-child(4){animation-delay:.15s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
</style></head><body class="has-bottomnav"><main class="wrap home"><header class="topbar"><div class="identity"><div class="logo-orbit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12a7 7 0 0 1 14 0M8 12a4 4 0 0 1 8 0"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg></div><div><div class="hello">Ласкаво просимо</div><div id="person" class="person">Signal</div></div></div><button class="round-btn" onclick="location.href='profile.html'" aria-label="Профіль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></button></header><div id="announcements"></div><div id="loading" class="shimmer" style="height:300px;margin-top:22px;border-radius:28px"></div><div id="content" hidden></div></main><nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" class="active" aria-label="Головна" title="Головна" data-nav="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg></span></a><a href="plans.html" aria-label="Тарифи" title="Тарифи" data-nav="plans"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h16M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 12h8M8 16h5"/></svg></span></a><a href="usage.html" aria-label="Витрати" title="Витрати" data-nav="usage"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V12M12 19V5M19 19V9"/><path d="M3 21h18"/></svg></span></a><a href="profile.html" aria-label="Профіль" title="Профіль" data-nav="profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span></a></nav><script src="config.js"></script><script>
const token=localStorage.getItem('signal_session_token'),savedEmail=localStorage.getItem('signal_email'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token)location.href='login.html';const icon=(name)=>({sim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M9 3v5h6V3M9 13h2m2 0h2m-6 3h2m2 0h2"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.3 2.2c-.9.4-1.1 1-1.1 1.8M12 17h.01"/></svg>',card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h3"/></svg>',shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.8 2.8 8.3 7 10 4.2-1.7 7-5.2 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>'}[name]);
function quick(href,name,label){return `<a class="quick" href="${href}"><span class="qicon">${icon(name)}</span><span>${label}</span></a>`}function show(html){loading.style.display='none';content.hidden=false;content.innerHTML=html}async function announcements(){try{const r=await fetch(`${API_URL}/api/account/announcements`,{headers:{'x-session-token':token}}),d=await r.json();announcements.innerHTML=(d.announcements||[]).map(x=>`<div class="notice"><b>${esc(x.title)}</b><div>${esc(x.message)}</div></div>`).join('')}catch{}}
async function load(){try{const r=await fetch(`${API_URL}/api/status`,{headers:{'x-session-token':token}}),u=await r.json();if(!r.ok)throw Error(u.error);person.textContent=u.displayName||u.email||'Signal';if(u.status==='registered'||!u.esim)return empty();let usage={usedGb:u.esim.usedGb||0,totalGb:u.esim.dataLimitGb,remainingGb:u.esim.remainingGb,lastUpdateTime:u.esim.lastUpdateTime};try{const x=await fetch(`${API_URL}/api/usage`,{headers:{'x-session-token':token}}),d=await x.json();if(x.ok)usage=d}catch{}const total=Number(usage.totalGb),used=Number(usage.usedGb||0),remaining=usage.remainingGb==null?(Number.isFinite(total)?Math.max(0,total-used):null):Number(usage.remainingGb),pct=Number.isFinite(total)&&total>0?Math.min(100,Math.round(used/total*100)):100,plan={basic:'Базовий',standard:'Стандарт',unlimited:'Безліміт',custom:'Travel'}[u.plan]||u.plan||'eSIM',expiry=u.esim.expiredTime?new Date(u.esim.expiredTime).toLocaleDateString('uk-UA'):'Без дати';show(`<section class="hero-esim"><div class="hero-row"><span class="network"><i class="live-dot"></i>eSIM онлайн</span><span class="pill">${esc(plan)}</span></div><div class="plan-name">Доступний мобільний інтернет</div><div class="balance">${remaining==null?'∞':remaining.toLocaleString('uk-UA',{maximumFractionDigits:2})} <small>${remaining==null?'безліміт':'GB залишилось'}</small></div><div class="progress"><span style="width:${Math.max(4,100-pct)}%"></span></div><div class="stats"><div class="stat"><span>Використано</span><b>${used.toLocaleString('uk-UA',{maximumFractionDigits:2})} GB${Number.isFinite(total)?` із ${total.toLocaleString('uk-UA')} GB`:''}</b></div><div class="stat"><span>Діє до</span><b>${expiry}</b></div></div></section><div class="section-label"><h2>Швидкі дії</h2></div><div class="quick-grid">${quick('esim-management.html','sim','Моя eSIM')}${quick('travel-plans.html','plus','Додати пакет')}${quick('app-tools.html','help','Допомога')}${quick('payments.html','card','Оплата')}</div><div class="section-label"><h2>Стан підключення</h2><a href="app-tools.html">Перевірити</a></div><a class="smart-card" href="app-tools.html"><span class="smart-icon">${icon('shield')}</span><span class="smart-copy"><b>Усе працює нормально</b><p>${usage.stale?'Показано останні збережені дані':'Дані оператора синхронізовано'}${usage.lastUpdateTime?` · ${new Date(usage.lastUpdateTime).toLocaleString('uk-UA')}`:''}</p></span><span class="arrow">→</span></a>`)}catch{empty()}}function empty(){person.textContent=savedEmail||'Signal';show(`<section class="hero-esim"><div class="hero-row"><span class="network">Нова eSIM</span><span class="pill">Готово до старту</span></div><div class="plan-name">Інтернет для подорожей</div><div class="balance">Оберіть <small>свій пакет</small></div><p style="position:relative;z-index:1;color:#9fb0d0;line-height:1.5;margin-top:18px">Підключення займає кілька хвилин. Оплата та встановлення eSIM відбуваються покроково.</p><a class="btn" href="plans.html" style="position:relative;z-index:1;margin-top:18px">Переглянути тарифи</a></section>`)}announcements();load();
</script></body></html>
