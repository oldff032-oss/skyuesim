<!doctype html>
<html lang="uk">
<head>

  <style>
    :root{--cyan:#35e8ff;--blue:#188cff;--violet:#704dff;--mint:#4ef0cf;--line:rgba(102,174,255,.24)}*{box-sizing:border-box}html{background:#020611}body{min-height:100svh;margin:0;overflow-x:hidden;color:#f7f9ff;background:#020611 url('signal-earth-v1.png') center top/auto 1000px no-repeat;background-attachment:fixed;font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(1,5,14,.2),#020611 64%,#020611),radial-gradient(circle at 78% 17%,rgba(28,121,255,.22),transparent 31%)}a{color:inherit}.home-shell{width:min(100%,460px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 17px calc(110px + env(safe-area-inset-bottom))}
    .home-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.brand img{width:48px;height:48px;border-radius:15px;object-fit:cover;box-shadow:0 0 25px rgba(28,157,255,.42)}.brand-copy strong{display:block;font:700 24px/1 'Space Grotesk',Inter,sans-serif}.brand-copy span{display:block;margin-top:5px;color:#91a6c9;font-size:11px}.top-actions{display:flex;align-items:center;gap:8px}.icon-button,.avatar{position:relative;width:43px;height:43px;display:grid;place-items:center;border:1px solid var(--line);border-radius:15px;background:rgba(5,14,31,.88);box-shadow:inset 0 1px rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.28);text-decoration:none}.icon-button svg{width:21px;height:21px;fill:none;stroke:#b8d0f5;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.avatar{overflow:hidden;background:linear-gradient(145deg,#1d5ed9,#774cff);color:#fff;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.notice-badge{position:absolute;right:-3px;top:-4px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border:2px solid #020611;border-radius:20px;background:#ff3e70;color:#fff;font-size:8px;font-weight:900}.notice-badge[hidden]{display:none}
    .greeting{margin:27px 2px 17px}.greeting p{margin:0;color:#9fb2d2;font-size:14px}.greeting h1{margin:5px 0 0;font:700 clamp(30px,9vw,39px)/1.08 'Space Grotesk',Inter,sans-serif;letter-spacing:-.04em}.announcement{margin:0 0 12px;padding:12px 14px;border:1px solid rgba(255,193,88,.28);border-radius:17px;background:linear-gradient(135deg,rgba(46,33,16,.76),rgba(25,16,32,.76));font-size:10px;line-height:1.45}.announcement b{display:block;margin-bottom:2px;color:#ffd480;font-size:11px}.loading{height:560px;border:1px solid var(--line);border-radius:29px;background:linear-gradient(100deg,rgba(255,255,255,.03) 20%,rgba(255,255,255,.08) 42%,rgba(255,255,255,.03) 64%);background-size:230% 100%;animation:shimmer 1.35s linear infinite}@keyframes shimmer{to{background-position:-230% 0}}
    .esim-card{position:relative;isolation:isolate;overflow:hidden;padding:19px;border:1px solid rgba(75,204,255,.45);border-radius:29px;background:linear-gradient(145deg,rgba(6,24,51,.96),rgba(4,12,28,.96));box-shadow:0 24px 65px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.14)}.esim-card:before{content:"";position:absolute;z-index:-2;inset:0;background:url('signal-earth-v1.png') 61% 31%/760px auto no-repeat;opacity:.28;filter:saturate(1.2)}.esim-card:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(135deg,rgba(4,19,42,.9),rgba(3,10,24,.66) 54%,rgba(18,8,38,.72))}.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{color:#89a1c4;font-size:9px;letter-spacing:.14em;text-transform:uppercase}.package-name{margin:5px 0 0;max-width:270px;font:700 18px/1.16 'Space Grotesk',Inter,sans-serif}.status-chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid rgba(73,238,196,.38);border-radius:99px;background:rgba(7,66,59,.64);color:#68f0ce;font-size:8px;font-weight:800}.status-chip i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.status-chip.warn{border-color:rgba(255,198,95,.36);background:rgba(77,50,11,.58);color:#ffd07c}.status-chip.bad{border-color:rgba(255,93,126,.4);background:rgba(80,14,31,.58);color:#ff8099}
    .usage-core{display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:center;margin:24px 0 19px}.ring{--remaining:0;position:relative;width:128px;height:128px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(from 210deg,var(--cyan) 0 calc(var(--remaining)*.82%),#4c6fff calc(var(--remaining)*.82%) calc(var(--remaining)*1%),rgba(255,255,255,.1) 0);filter:drop-shadow(0 0 18px rgba(44,172,255,.32))}.ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#10254b,#061022 68%);box-shadow:inset 0 0 22px rgba(0,0,0,.8)}.ring-copy{position:relative;text-align:center}.ring-copy strong{display:block;font:700 27px/1 'Space Grotesk',Inter,sans-serif;letter-spacing:-.05em}.ring-copy span{display:block;margin-top:5px;color:#9bb0ce;font-size:8px}.usage-text>span{color:#9db0cf;font-size:10px}.usage-text h2{margin:5px 0 8px;font:700 29px/1 'Space Grotesk',Inter,sans-serif;letter-spacing:-.045em}.usage-text p{margin:0;color:#b4c3dc;font-size:10px;line-height:1.5}.usage-text p b{color:#fff}.usage-text small{display:block;margin-top:7px;color:#7185a6;font-size:8px}
    .provider-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border:1px solid rgba(72,211,255,.31);border-radius:17px;background:rgba(5,28,51,.73);text-decoration:none}.client-v5 .provider-row:before{display:none!important}.provider-left{display:flex;align-items:center;gap:10px;flex:1}.provider-row .check{width:31px;height:31px;display:grid;place-items:center;flex:0 0 31px!important;border-radius:50%;background:linear-gradient(145deg,#36e9d4,#1393c8);color:#03221d;font-weight:900;box-shadow:0 0 18px rgba(47,222,216,.28)}.provider-copy b{display:block;font-size:10px}.provider-copy small{display:block;margin-top:3px;color:#8da2c3;font-size:8px}.chevron{color:#78bfff;font-size:21px}.primary{min-height:49px;width:100%;margin-top:13px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid rgba(95,226,255,.7);border-radius:15px;background:linear-gradient(105deg,#21cbe9,#167aff 48%,#7539ff);color:#fff;text-decoration:none;font-size:12px;font-weight:850;box-shadow:0 12px 32px rgba(28,116,255,.3),inset 0 1px rgba(255,255,255,.32)}
    .section-title{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 2px 10px}.section-title h2{margin:0;font:700 18px 'Space Grotesk',Inter,sans-serif}.section-title a{color:#52cfff;font-size:9px;text-decoration:none}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feature-card{min-height:157px;padding:15px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,rgba(10,29,56,.94),rgba(5,11,24,.94));box-shadow:inset 0 1px rgba(255,255,255,.08);text-decoration:none}.feature-head{display:flex;align-items:center;justify-content:space-between;gap:7px}.feature-icon{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(66,218,255,.35);border-radius:13px;background:linear-gradient(145deg,#123e66,#101936);color:#63e6ff}.feature-icon.violet{background:linear-gradient(145deg,#322660,#171631);color:#b5a0ff}.feature-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.feature-arrow{color:#6f88ad;font-size:18px}.feature-card h3{margin:11px 0 3px;font-size:13px}.feature-card p{margin:0;color:#8195b5;font-size:8px}.chart{height:45px;margin-top:9px;display:flex;align-items:flex-end;gap:4px}.chart i{flex:1;min-height:5px;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#54ddff,#3564ff);box-shadow:0 0 9px rgba(49,137,255,.24)}.package-count{display:flex;align-items:end;justify-content:space-between;margin-top:16px}.package-count strong{font:700 26px 'Space Grotesk',Inter,sans-serif}.package-count span{color:#6aeecc;font-size:8px}.mini-bar{display:block;width:100%;height:5px!important;min-height:5px;margin-top:8px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.08);line-height:0}.mini-bar i{display:block;height:5px!important;min-height:5px;border-radius:inherit;background:linear-gradient(90deg,#7662ff,#34d8ff)}
    .support-card{margin-top:10px;display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:19px;background:rgba(5,15,31,.88);text-decoration:none}.support-icon{width:39px;height:39px;display:grid;place-items:center;border:1px solid rgba(75,239,201,.35);border-radius:13px;background:rgba(10,57,53,.6);color:#62efc8}.support-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.support-copy{flex:1}.support-copy b{display:block;font-size:11px}.support-copy span{display:block;margin-top:3px;color:#8296b6;font-size:8px}.error-card{padding:22px;border:1px solid rgba(255,102,131,.35);border-radius:25px;background:rgba(39,10,24,.86);text-align:center}.error-card b{font-size:16px}.error-card p{color:#aab8cf;font-size:11px;line-height:1.5}.retry{min-height:42px;padding:0 18px;border:1px solid rgba(74,216,255,.5);border-radius:13px;background:#10264c;color:#85ebff;font-weight:800}
    .bottomnav{position:fixed;z-index:30;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),430px);min-height:70px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border:1px solid rgba(105,165,255,.28);border-radius:24px;background:rgba(3,11,25,.91);box-shadow:0 18px 55px rgba(0,0,0,.65),inset 0 1px rgba(255,255,255,.09);backdrop-filter:blur(22px);transform:translateX(-50%)}.bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:17px;color:#8299bf;text-decoration:none;font-size:8px}.bottomnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bottomnav .nav-label{position:static!important;width:auto!important;height:auto!important;margin:0!important;overflow:visible!important;clip:auto!important;white-space:normal!important}.bottomnav a.active{color:#52e6ff;background:linear-gradient(180deg,rgba(19,104,162,.52),rgba(20,48,102,.25));box-shadow:inset 0 0 18px rgba(48,190,255,.18)}
    @media(max-width:370px){.home-shell{padding-inline:12px}.brand-copy span{display:none}.brand img{width:43px;height:43px}.usage-core{grid-template-columns:112px 1fr;gap:12px}.ring{width:112px;height:112px}.ring-copy strong{font-size:23px}.usage-text h2{font-size:25px}.feature-card{padding:12px}.package-name{font-size:16px}}@media(min-width:720px){body{background-size:auto 1150px}.home-shell{padding-top:32px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<body class="signal-v5 client-v5 has-bottomnav">
  <main class="home-shell">
    <header class="home-top"><a class="brand" href="dashboard.html" aria-label="Signal — головна"><img src="signal-premium-logo.png" alt=""><span class="brand-copy"><strong>Signal</strong><span>eSIM для подорожей</span></span></a><span class="top-actions"><a id="notificationLink" class="icon-button" href="notifications.html" aria-label="Сповіщення"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="noticeBadge" class="notice-badge" hidden></span></a><a id="profileAvatar" class="avatar" href="profile.html" aria-label="Профіль">S</a></span></header>
    <section class="greeting"><p id="greetingTime">Добрий день</p><h1><span id="greetingName">мандрівнику</span>!</h1></section><div id="announcements" aria-live="polite"></div><div id="loading" class="loading" role="status" aria-label="Завантаження даних eSIM"></div><div id="content" aria-live="polite" hidden></div>
  </main>
  <nav class="bottomnav" aria-label="Головна навігація"><a class="active" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5M5.5 9.3V21h13V9.3M9.5 21v-6h5v6"/></svg><span>Головна</span></a><a href="plans.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/></svg><span>Пакети</span></a><a href="usage.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-8M22 20V3M2 20h21"/></svg><span>Витрати</span></a><a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c.4-4.6 2.8-7 7-7s6.6 2.4 7 7"/></svg><span>Профіль</span></a></nav>
  <script src="config.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token');if(!token)location.replace('login.html');const $=id=>document.getElementById(id),escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const api=async(path,options={})=>{const response=await fetch(`${API_URL}${path}`,{cache:'no-store',...options,headers:{'x-session-token':token,'Content-Type':'application/json',...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(response.status===401){localStorage.removeItem('signal_session_token');location.replace('login.html');throw Error('Сеанс завершено')}if(!response.ok)throw Error(data.error||'Не вдалося оновити дані');return data};
    const formatSync=value=>{if(!value)return'очікуємо перше оновлення';const date=new Date(value);return Number.isNaN(date.getTime())?'щойно':date.toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};const statusMeta=value=>({active:['Активна',''],ready:['Готова',''],available:['Готова',''],pending:['Готується','warn'],preparing:['Готується','warn'],provisioning:['Готується','warn'],suspended:['Призупинена','warn'],used_up:['Пакет завершено','bad'],expired:['Термін завершився','bad'],revoked:['Відкликана','bad'],failed:['Потрібна перевірка','bad']}[String(value||'').toLowerCase()]||['Перевіряємо','warn']);const barHeights=percent=>{const used=Math.max(3,Math.min(100,Number(percent)||3)),weights=[.38,.54,.43,.72,.58,.82,1];return weights.map((weight,index)=>Math.max(10,Math.round(used*weight+(index%2?8:2))))};
    function setIdentity(identity={}){const raw=identity.displayName||'мандрівнику',first=raw.trim().split(/\s+/)[0]||'мандрівнику',hour=new Date().getHours();$('greetingTime').textContent=hour<5?'Доброї ночі':hour<12?'Доброго ранку':hour<18?'Добрий день':'Добрий вечір';$('greetingName').textContent=first;const avatar=$('profileAvatar');if(identity.avatarDataUrl)avatar.innerHTML=`<img src="${escapeHtml(identity.avatarDataUrl)}" alt="">`;else avatar.textContent=first.slice(0,1).toUpperCase()}
    function activeMarkup(deck){const card=deck.active||{},known=card.remainingPercent!=null&&Number.isFinite(Number(card.remainingPercent)),remaining=known?Math.max(0,Math.min(100,Number(card.remainingPercent))):0,status=statusMeta(card.status),bars=barHeights(card.usagePercent),packageCount=Math.max(1,(deck.cards||[]).length);return `<section class="esim-card"><div class="card-heading"><div><span class="eyebrow">Активна eSIM</span><h2 class="package-name">${escapeHtml(card.title||'Твоя eSIM')}</h2></div><span class="status-chip ${status[1]}"><i></i>${escapeHtml(status[0])}</span></div><div class="usage-core"><div class="ring" style="--remaining:${remaining}"><span class="ring-copy"><strong>${known?`${Math.round(remaining)}%`:'—'}</strong><span>залишилось</span></span></div><div class="usage-text"><span>Доступний інтернет</span><h2>${escapeHtml(card.dataLabel||'— GB')}</h2><p><b>${escapeHtml(card.usedLabel||'—')}</b> використано<br>з ${escapeHtml(card.totalLabel||'—')}</p><small>${escapeHtml(card.daysLabel||'')}</small></div></div><a class="provider-row" href="usage.html"><span class="provider-left"><span class="check">✓</span><span class="provider-copy"><b>${card.usageStale?'Очікуємо свіжі дані оператора':'Оновлено оператором'}</b><small>${escapeHtml(formatSync(card.lastSyncAt))} · ${escapeHtml(card.networkLabel||'мобільна мережа')}</small></span></span><span class="chevron">›</span></a><a class="primary" href="esim-topup.html"><span>Продовжити пакет</span><span>→</span></a></section><div class="section-title"><h2>Все під контролем</h2><a href="activity.html">Історія →</a></div><section class="feature-grid"><a class="feature-card" href="usage.html"><div class="feature-head"><span class="feature-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-8M22 20V3M2 20h21"/></svg></span><span class="feature-arrow">›</span></div><h3>Витрати</h3><p>${escapeHtml(card.usedLabel||'—')} використано</p><span class="chart" aria-hidden="true">${bars.map(height=>`<i style="height:${Math.min(100,height)}%"></i>`).join('')}</span></a><a class="feature-card" href="plans.html"><div class="feature-head"><span class="feature-icon violet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/></svg></span><span class="feature-arrow">›</span></div><h3>Мої пакети</h3><p>eSIM та доступні тарифи</p><div class="package-count"><strong>${packageCount}</strong><span>${status[0]}</span></div><span class="mini-bar"><i style="width:${remaining}%"></i></span></a></section><a class="support-card" href="support.html"><span class="support-icon"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H3a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2v-6M20 12h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2v-6M19 18c-1 2-2.8 3-5.5 3"/></svg></span><span class="support-copy"><b>Потрібна допомога?</b><span>Підтримка Signal завжди поруч</span></span><span class="chevron">›</span></a>`}
    function render(deck){setIdentity(deck.identity||{});$('content').innerHTML=activeMarkup(deck);$('loading').hidden=true;$('content').hidden=false}function renderError(error){$('loading').hidden=true;$('content').hidden=false;$('content').innerHTML=`<section class="error-card"><b>Не вдалося завантажити головну</b><p>${escapeHtml(error?.message||'Перевірте інтернет і спробуйте ще раз.')}</p><button class="retry" type="button" onclick="loadHome()">Спробувати ще раз</button></section>`}function setBadge(count){const value=Math.max(0,Number(count)||0),badge=$('noticeBadge');badge.hidden=value===0;badge.textContent=value>9?'9+':String(value);$('notificationLink').setAttribute('aria-label',value?`Сповіщення: ${value} непрочитаних`:'Сповіщення')}
    async function loadAnnouncements(){try{const data=await api('/api/account/announcements');$('announcements').innerHTML=(data.announcements||[]).map(item=>`<div class="announcement"><b>${escapeHtml(item.title)}</b>${escapeHtml(item.message)}</div>`).join('')}catch{}}async function loadNotifications(){try{const data=await api('/api/account/notifications');setBadge(data.unread)}catch{setBadge(0)}}async function loadHome(){try{try{await fetch(`${API_URL}/api/usage`,{cache:'no-store',headers:{'x-session-token':token}})}catch{}render(await api('/api/account/home-deck'))}catch(error){renderError(error)}}loadAnnouncements();loadNotifications();loadHome();setInterval(loadNotifications,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadNotifications();loadHome()}});
  </script>
</body>
</html>
