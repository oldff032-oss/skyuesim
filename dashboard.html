<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Головна — Signal eSIM</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#020611"><script src="pwa.js"></script>
  <style>
    :root{--home-cyan:#36e6ff;--home-blue:#2a86ff;--home-violet:#9d57ff;--home-line:rgba(113,190,255,.23)}
    body{background:radial-gradient(circle at 50% -12%,#173d7852,transparent 31%),radial-gradient(circle at 96% 54%,#39146332,transparent 37%),#020611;overflow-x:hidden}.premium-home{width:min(100%,590px);padding:calc(max(17px,env(safe-area-inset-top))) 15px calc(105px + env(safe-area-inset-bottom))}
    .home-head{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}.brand-lockup{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}.home-logo{width:52px;height:52px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 0 13px #37bfff9e)}.brand-lockup b{font:500 clamp(19px,5.4vw,25px)/1 'Space Grotesk',sans-serif;white-space:nowrap}.head-actions{display:flex;gap:7px}.head-action{position:relative;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--home-line);border-radius:50%;background:#090f20d9;color:#83cfff;text-decoration:none;box-shadow:inset 0 1px #ffffff10}.head-action svg{width:21px;height:21px}.head-badge{position:absolute;right:-1px;top:-2px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;border-radius:99px;background:#ff5263;color:#fff;font-size:8px;font-weight:900;box-shadow:0 0 14px #ff526399}
    .announcement-home{margin-top:15px;padding:13px 14px;border:1px solid #ffc66140;border-radius:18px;background:linear-gradient(135deg,#3d2a123d,#2d17353d);font-size:10px;line-height:1.5}.announcement-home b{display:block;margin-bottom:3px;color:#ffd88f;font-size:11px}.loading-card{height:610px;margin-top:22px;border-radius:36px;background:linear-gradient(100deg,#ffffff08 20%,#ffffff16 44%,#ffffff08 68%);background-size:240% 100%;animation:shimmerMove 1.4s linear infinite}@keyframes shimmerMove{to{background-position:-240% 0}}
    .hero-wrap{position:relative;margin-top:22px}.hero-shadow{position:absolute;inset:16px -3px -9px;border:1px solid #6899ff26;border-radius:38px;background:#091027;transform:rotate(-1.6deg)}.esim-hero{position:relative;isolation:isolate;min-height:610px;overflow:hidden;padding:25px 22px 22px;border:1px solid #72dfff88;border-radius:37px;background:#0a1e3e;color:#fff;box-shadow:0 32px 88px #000c,0 0 42px #197cff35,inset 0 1px #ffffff68}.esim-hero:before{content:"";position:absolute;z-index:-3;inset:0;background-image:url('signal-card-scenes-v1.png');background-size:100% 400%;background-repeat:no-repeat;filter:saturate(1.1) contrast(1.04);transform:scale(1.018)}.esim-hero.scene-travel:before{background-position:center 0}.esim-hero.scene-basic:before{background-position:center 33.333%}.esim-hero.scene-standard:before{background-position:center 66.666%}.esim-hero.scene-unlimited:before{background-position:center 100%}.esim-hero:after{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(180deg,#031027dc 0,#07162e68 37%,#0310279e 69%,#020817f2 100%),linear-gradient(100deg,#020c20d9 0,transparent 74%)}.glass-edge{position:absolute;inset:9px;border:1px solid #b6eeff55;border-radius:29px;pointer-events:none}.hero-watermark{position:absolute;right:18px;top:18px;width:76px;height:76px;border:1px solid #7cdfff76;border-radius:50%;background:#020819c7 url('signal-premium-logo.png') center/cover;box-shadow:0 0 30px #31cfff65,inset 0 1px #ffffff3b}.hero-heading{padding-right:82px}.hero-title{margin:0;font:700 clamp(27px,8vw,42px)/1.04 'Space Grotesk',sans-serif;letter-spacing:-.045em;text-shadow:0 4px 22px #000}.hero-status{display:inline-flex;align-items:center;gap:7px;margin-top:13px;padding:7px 11px;border:1px solid #54f0bd80;border-radius:99px;background:#072e2bc7;color:#5bf0c3;font-size:10px;font-weight:800;backdrop-filter:blur(12px)}.hero-status i{width:7px;height:7px;border-radius:50%;background:#4bedb8;box-shadow:0 0 12px #4bedb8}.hero-balance{margin-top:32px}.hero-balance strong{display:block;font:700 clamp(44px,14vw,69px)/.94 'Space Grotesk',sans-serif;letter-spacing:-.06em;text-shadow:0 5px 24px #000}.hero-balance span{display:block;margin-top:7px;color:#edf5ff;font-size:15px;font-weight:600}.hero-used{margin-top:8px;color:#bfd0e9;font-size:11px}
    .hero-lower{position:absolute;left:22px;right:22px;bottom:22px;display:grid;grid-template-columns:116px 1fr;gap:17px;align-items:end}.usage-ring{--remaining:0;position:relative;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 205deg,var(--home-cyan) calc(var(--remaining)*1%),#a95cff calc(var(--remaining)*1% + 6%),#ffffff1e 0);box-shadow:0 0 28px #309dff4a}.usage-ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#07142be8;box-shadow:inset 0 0 20px #000a}.usage-ring strong{position:relative;font:700 25px 'Space Grotesk',sans-serif}.usage-ring small{position:absolute;bottom:27px;color:#96a9c7;font-size:7px}.hero-facts{display:grid;gap:7px}.hero-fact{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:7px;min-width:0;color:#e7efff;font-size:9.5px}.hero-fact svg{width:17px;color:#44dfff}.hero-fact span{overflow-wrap:anywhere}.hero-detail{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:4px;min-height:38px;border:1px solid #53cfff66;border-radius:13px;background:#06162ec7;color:#64e4ff;text-decoration:none;font-size:9.5px;font-weight:800;backdrop-filter:blur(12px)}
    .reward-card{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;margin-top:18px;padding:14px;border:1px solid #8aaeff35;border-radius:22px;background:linear-gradient(115deg,#0c1931,#0a0d1d 62%,#241035);color:inherit;text-decoration:none;box-shadow:inset 0 1px #ffffff10}.reward-medal{width:47px;height:47px;display:grid;place-items:center;border:1px solid #59dfff6b;border-radius:50%;background:radial-gradient(circle,#164481,#091126 69%);color:#d8f7ff;font-size:20px;box-shadow:0 0 24px #31bfff3b}.reward-copy b{display:block;font-size:12px}.reward-copy b span{color:#7eeaff}.reward-copy small{display:block;margin-top:4px;color:#8ea0bd;font-size:8px}.reward-progress{height:4px;margin-top:8px;overflow:hidden;border-radius:99px;background:#ffffff12}.reward-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#35e5ff,#9d5cff)}.discount-box{padding-left:10px;border-left:1px solid #ffffff1b;text-align:center}.discount-box strong{display:block;color:#eca0ff;font-size:16px}.discount-box span{display:block;margin-top:2px;max-width:70px;color:#a993c6;font-size:7px}.gift-count{position:absolute;right:7px;top:6px;min-width:16px;height:16px;display:grid;place-items:center;border-radius:99px;background:#ff78e6;color:#150316;font-size:8px;font-weight:900}
    .quick-title{margin:21px 4px 10px;font:700 18px 'Space Grotesk',sans-serif}.quick-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.quick-new{position:relative;min-width:0;min-height:92px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid var(--home-line);border-radius:18px;background:linear-gradient(155deg,#101a31,#070b17);color:#fff;text-decoration:none;box-shadow:inset 0 1px #ffffff0d,0 10px 24px #0003;transition:transform .2s ease,border-color .2s ease}.quick-new:active{transform:scale(.95)}.quick-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #64dfff36;border-radius:14px;background:linear-gradient(145deg,#12304b,#11162f);color:#5ce9ff;box-shadow:inset 0 1px #ffffff10,0 0 18px #28cfff18}.quick-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.quick-new.family .quick-icon{color:#aa8cff;background:linear-gradient(145deg,#241a49,#12162f)}.quick-new.support .quick-icon{color:#5bf1bd;background:linear-gradient(145deg,#123a38,#10192d)}.quick-new b{font-size:8.5px;line-height:1.15;text-align:center;white-space:normal}
    .premium-home~.bottomnav{width:min(344px,calc(100% - 20px));height:56px;padding:5px 12px;border-color:#5aa8ff38;border-radius:21px;background:linear-gradient(135deg,#0c1429f7,#070a18fa)}.premium-home~.bottomnav .nav-icon{width:30px;height:30px}.premium-home~.bottomnav .nav-art{width:23px;height:23px}.premium-home~.bottomnav a.active .nav-art{width:25px;height:25px}.premium-home~.bottomnav a::before{width:36px;height:36px;border-radius:12px}
    @media(max-width:390px){.premium-home{padding-inline:11px}.brand-lockup b{font-size:18px}.home-logo{width:46px;height:46px}.esim-hero{min-height:574px;padding-inline:18px}.hero-lower{left:18px;right:18px;grid-template-columns:102px 1fr;gap:12px}.usage-ring{width:98px;height:98px}.usage-ring strong{font-size:22px}.usage-ring small{bottom:23px}.quick-row{gap:5px}.quick-new{min-height:84px;padding-inline:2px}.quick-icon{width:38px;height:38px;border-radius:12px}.quick-icon svg{width:20px;height:20px}.quick-new b{font-size:8px}.premium-home~.bottomnav{width:calc(100% - 18px)}}
    @media(max-width:345px){.hero-title{font-size:25px}.hero-watermark{width:64px;height:64px}.hero-heading{padding-right:67px}.hero-fact{font-size:8.5px}.quick-new{min-height:78px}.quick-icon{width:34px;height:34px}.quick-icon svg{width:18px;height:18px}.quick-new b{font-size:7.2px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body class="has-bottomnav">
  <main class="wrap premium-home">
    <header class="home-head">
      <a class="head-action" href="app-tools.html" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/></svg></a>
      <span class="brand-lockup"><img class="home-logo" src="signal-premium-logo.png" alt=""><b>Signal eSIM</b></span>
      <span class="head-actions"><a class="head-action" href="notifications.html" aria-label="Сповіщення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="noticeBadge" class="head-badge" hidden></span></a><a class="head-action" href="profile.html" aria-label="Профіль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></a></span>
    </header>
    <div id="announcements"></div><div id="loading" class="loading-card"></div><div id="content" hidden></div>
  </main>
  <nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" class="active" aria-label="Головна"><span class="nav-icon"><svg class="nav-art nav-vector" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5"/><path d="M5.5 9.3V21h13V9.3M9.5 21v-6h5v6"/></svg></span></a><a href="plans.html" aria-label="Тарифи"><span class="nav-icon"><svg class="nav-art nav-vector" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/></svg></span></a><a href="usage.html" aria-label="Витрати"><span class="nav-icon"><svg class="nav-art nav-vector" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V5M16 20v-8M22 20V3M2 20h21"/></svg></span></a><a href="profile.html" aria-label="Профіль"><span class="nav-icon"><svg class="nav-art nav-vector" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c.4-4.6 2.8-7 7-7s6.6 2.4 7 7"/></svg></span></a></nav>
  <script src="config.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token'),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));if(!token)location.href='login.html';
    const api=async path=>{const response=await fetch(`${API_URL}${path}`,{cache:'no-store',headers:{'x-session-token':token}}),data=await response.json().catch(()=>({}));if(response.status===401){localStorage.removeItem('signal_session_token');location.href='login.html'}if(!response.ok)throw Error(data.error||'Не вдалося оновити дані');return data};
    const scene=value=>['travel','basic','standard','unlimited'].includes(value)?value:'unlimited',dateLabel=value=>{if(!value)return'Без обмеження';const date=new Date(value);return Number.isNaN(date.getTime())?'Не визначено':date.toLocaleDateString('uk-UA')},syncLabel=value=>{if(!value)return'Щойно';const date=new Date(value);return Number.isNaN(date.getTime())?'Щойно':date.toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
    const factIcons={calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>',signal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20v-3M10 20v-7M15 20V9M20 20V4"/></svg>',sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5M18 12a6 6 0 0 0-10.3-4.2L4 12m16 0-3.7 4.2A6 6 0 0 1 6 12"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};
    const quickIcons={install:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 3v4h6V3M9 11h6M9 15h4"/></svg>',add:'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="14" rx="3"/><path d="M8 3h9a3 3 0 0 1 3 3v9M13 13h6M16 10v6"/></svg>',family:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3.5 20c.4-4 2.2-6 5.5-6s5.1 2 5.5 6M14 15.5c.8-.7 1.8-1 3-1 2.5 0 3.8 1.7 4 5.5"/></svg>',support:'<svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 12H3a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2v-6ZM20 12h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2v-6ZM19 18c-1 2-2.8 3-5.5 3"/></svg>'};
    function activeCard(card){const remaining=card.remainingPercent==null?100:Math.max(0,Math.min(100,Number(card.remainingPercent)));return `<section class="hero-wrap"><div class="hero-shadow"></div><article class="esim-hero scene-${scene(card.scene)}"><i class="glass-edge"></i><i class="hero-watermark" aria-hidden="true"></i><div class="hero-heading"><h1 class="hero-title">${esc(card.title)}</h1><span class="hero-status"><i></i>${card.status==='active'?'eSIM активна':'eSIM готується'}</span></div><div class="hero-balance"><strong>${esc(card.dataLabel)}</strong><span>залишилось</span><div class="hero-used">${esc(card.usedLabel)} використано із ${esc(card.totalLabel)}</div></div><div class="hero-lower"><div class="usage-ring" style="--remaining:${remaining}"><strong>${Math.round(remaining)}%</strong><small>залишилось</small></div><div class="hero-facts"><span class="hero-fact">${factIcons.clock}<span>${esc(card.daysLabel)}</span></span><span class="hero-fact">${factIcons.calendar}<span>Діє до ${esc(dateLabel(card.validUntil))}</span></span><span class="hero-fact">${factIcons.signal}<span>Мережа: ${esc(card.networkLabel)} · ${esc(card.networkType)}</span></span><span class="hero-fact">${factIcons.sync}<span>Оновлено: ${esc(syncLabel(card.lastSyncAt))}</span></span><a class="hero-detail" href="esim-management.html">Деталі eSIM <span>›</span></a></div></div></article></section>`}
    function rewards(value){const progress=value.tier?.next?Math.min(100,Math.round(value.points/value.tier.next*100)):100,label=value.redeemable?'Знижка доступна':value.next?`Ще ${value.next.pointsNeeded} Points`:'Максимальний рівень',discount=value.redeemable?value.redeemable.name:value.next?.name||'Усі винагороди відкрито';return `<a class="reward-card" href="signal-club.html" aria-label="Винагороди"><span class="reward-medal">✦</span><span class="reward-copy"><b>${esc(value.tier.name)} · <span>${value.points} Points</span></b><small>${esc(label)}</small><span class="reward-progress"><i style="width:${progress}%"></i></span></span><span class="discount-box"><strong>${value.redeemable?'10%':'↗'}</strong><span>${esc(discount)}</span></span>${value.availableCount?`<i class="gift-count">${value.availableCount}</i>`:''}</a>`}
    function quick(){return `<h2 class="quick-title">Швидкі дії</h2><div class="quick-row"><a class="quick-new" href="installing.html"><span class="quick-icon" aria-hidden="true">${quickIcons.install}</span><b>Встановити</b></a><a class="quick-new" href="esim-topup.html"><span class="quick-icon" aria-hidden="true">${quickIcons.add}</span><b>Додати пакет</b></a><a class="quick-new family" href="family-esims.html"><span class="quick-icon" aria-hidden="true">${quickIcons.family}</span><b>Для близьких</b></a><a class="quick-new support" href="support.html"><span class="quick-icon" aria-hidden="true">${quickIcons.support}</span><b>Підтримка</b></a></div>`}
    function render(deck){content.innerHTML=activeCard(deck.active)+rewards(deck.reward)+quick();loading.style.display='none';content.hidden=false}
    async function announcementsLoad(){try{const data=await api('/api/account/announcements');announcements.innerHTML=(data.announcements||[]).map(item=>`<div class="announcement-home"><b>${esc(item.title)}</b>${esc(item.message)}</div>`).join('')}catch{}}
    async function load(){try{fetch(`${API_URL}/api/usage`,{cache:'no-store',headers:{'x-session-token':token}}).catch(()=>{});const [deck,notices]=await Promise.all([api('/api/account/home-deck'),api('/api/account/notifications')]);if(notices.unread){noticeBadge.hidden=false;noticeBadge.textContent=notices.unread>9?'9+':notices.unread}render(deck)}catch(error){offline(error)}}
    function offline(error){loading.style.display='none';content.hidden=false;content.innerHTML=`<section class="hero-wrap"><div class="hero-shadow"></div><article class="esim-hero scene-unlimited"><i class="glass-edge"></i><i class="hero-watermark"></i><div class="hero-heading"><h1 class="hero-title">Signal без мережі</h1><span class="hero-status"><i></i>Офлайн-картка захищена</span></div><div class="hero-balance"><strong>Твоя eSIM</strong><span>доступна офлайн</span></div><div class="hero-lower" style="grid-template-columns:1fr"><a class="hero-detail" href="offline-esim.html">Відкрити офлайн-картку</a></div></article></section><div class="announcement-home"><b>Дані не оновлено</b>${esc(error?.message||'Перевір інтернет і спробуй ще раз.')}</div>`}
    announcementsLoad();load();
  </script>
</body>
</html>
