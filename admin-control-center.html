<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центр керування — Signal Admin</title><link rel="stylesheet" href="style.css"><style>
.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 16px}.tabs button{white-space:nowrap}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric,.item{padding:15px}.metric b{display:block;font-size:25px}.item{border:1px solid var(--glass-border);border-radius:14px;margin:10px 0;background:rgba(255,255,255,.025)}.head,.setting{display:flex;justify-content:space-between;gap:12px}.pill{padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700}.critical,.failed,.error{color:#ff6b6b;background:#ff50501c}.warning,.disabled{color:#ffc45c;background:#ffb4321c}.healthy,.sent,.succeeded,.retried{color:#39e5bd;background:#39e5bd1c}.muted{color:var(--text-muted);font-size:12px;margin-top:6px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.actions a,.actions button{padding:8px 11px;border:1px solid var(--glass-border);border-radius:9px;background:transparent;color:var(--text);text-decoration:none}.setting{align-items:center;padding:12px;border-bottom:1px solid var(--glass-border)}.setting input{width:20px;height:20px}@media(max-width:650px){.admin-main{padding:16px 12px}.grid{grid-template-columns:1fr 1fr}.head{display:block}}
</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><img src="signal-premium-logo.png" style="width:34px;border-radius:10px"><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Центр керування</h1><p class="lead">Операції, проблеми, звірки, доставка та налаштування.</p><div class="tabs" id="tabs"></div><div id="loading" class="shimmer" style="height:160px"></div>
<section id="overview" class="panel"><div class="grid" id="metrics"></div><h2>Стан сервісів</h2><div class="grid" id="health"></div><h2>Найважливіше зараз</h2><div id="top"></div></section>
<section id="attention" class="panel"><h2>Потребує уваги</h2><div id="attentionList"></div></section>
<section id="reconciliation" class="panel"><h2>Фінансова звірка</h2><div class="grid" id="reconSummary"></div><div id="reconList"></div></section>
<section id="jobs" class="panel"><h2>Черга завдань</h2><div id="jobList"></div></section>
<section id="delivery" class="panel"><h2>Email і push</h2><div id="deliveryList"></div></section>
<section id="support" class="panel"><h2>SLA підтримки</h2><div class="grid" id="supportSummary"></div><div id="supportList"></div></section>
<section id="localization" class="panel"><h2>Контроль перекладів</h2><div id="translationHealth"></div><div class="glass glass-card"><input id="sourceText" placeholder="Український оригінал"><input id="translatedText" placeholder="English translation" style="margin-top:8px"><button class="btn primary" onclick="manualTranslation()" style="margin-top:8px">Зберегти переклад</button></div></section>
<section id="settings" class="panel"><h2>Feature flags</h2><div class="glass glass-card" id="flags"></div><h2>Баланс eSIM Access</h2><div class="glass glass-card"><div class="grid"><input id="balance" type="number" step=".01" placeholder="Баланс USD"><input id="averageCost" type="number" step=".01" placeholder="Середня ціна замовлення"></div><button class="btn primary" onclick="saveBalance()" style="margin-top:8px">Оновити</button></div><h2>Версії</h2><div class="glass glass-card"><div class="grid"><input id="frontVersion" placeholder="Frontend"><input id="backVersion" placeholder="Backend"><input id="swVersion" placeholder="Service Worker"></div><button class="btn primary" onclick="saveVersions()" style="margin-top:8px">Зафіксувати деплой</button></div></section>
<section id="reports" class="panel"><h2>Щоденний звіт</h2><button class="btn primary" onclick="generateReport()">Сформувати зараз</button><pre id="report" class="glass glass-card" style="white-space:pre-wrap"></pre></section>
</main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();let data;const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),F=v=>v?new Date(v).toLocaleString('uk-UA'):'—';const N={overview:'Огляд',attention:'Проблеми',reconciliation:'Звірка',jobs:'Черга',delivery:'Доставка',support:'SLA',localization:'Переклади',settings:'Налаштування',reports:'Звіти'};tabs.innerHTML=Object.entries(N).map(([k,v])=>`<button class="btn ghost" onclick="tab('${k}')">${v}</button>`).join('');function tab(x){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===x));location.hash=x}function M(v,l,t=''){return `<div class="glass metric"><b class="${t}">${E(v)}</b>${E(l)}</div>`}
function I(i){const link=i.ticketId?`admin-ticket.html?id=${i.ticketId}`:i.email?`admin-users.html?email=${encodeURIComponent(i.email)}`:'admin-diagnostics.html';return `<div class="item"><div class="head"><b>${E(i.title)}</b><span class="pill ${E(i.severity)}">${E(i.severity)}</span></div><div class="muted">${E(i.email||'Система')} · ${F(i.at)} ${i.plan?'· '+E(i.plan):''}</div><p>${E(i.explanation||'')}</p><div class="muted"><b>Що зробити:</b> ${E(i.recommendedAction||'Перевірити вручну')}</div><div class="actions"><a href="${link}">Відкрити</a>${i.action==='retry_provision'&&i.email&&i.purchaseId?`<button onclick="retryProvision('${encodeURIComponent(i.email)}','${encodeURIComponent(i.purchaseId)}')">Повторити видачу</button>`:''}<button onclick="resolveItem('${encodeURIComponent(i.id)}')">Вирішено</button></div></div>`}
async function load(){const r=await adminFetch('/api/admin/control-center');data=await r.json();if(!r.ok)throw Error(data.error);loading.style.display='none';render();tab(N[location.hash.slice(1)]?location.hash.slice(1):'overview')}
function render(){const s=data.summary;metrics.innerHTML=M(s.attention,'Потребує уваги',s.critical?'critical':'healthy')+M(s.critical,'Критичних','critical')+M(s.reconciliationIssues,'Розбіжностей')+M(s.jobsFailed,'Завдань з помилкою')+M(data.support.summary.open,'Відкритих звернень')+M(data.provider.estimatedOrders??'—','Можливих замовлень');health.innerHTML=Object.entries(data.services).filter(x=>x[0]!=='deepl').map(([k,v])=>M(v?'Працює':'Не налаштовано',k,v?'healthy':'warning')).join('')+M(data.provider.level,'eSIM баланс',data.provider.level);top.innerHTML=data.attention.slice(0,5).map(I).join('')||'<div class="item healthy">Проблем немає</div>';attentionList.innerHTML=data.attention.map(I).join('')||'<div class="item healthy">Усі операції в нормі</div>';const r=data.reconciliation;reconSummary.innerHTML=M(r.summary.payments,'Оплат')+M(r.summary.provisioned,'Виданих eSIM')+M(r.summary.refunded,'Повернень')+M(r.summary.issues,'Розбіжностей',r.summary.issues?'critical':'healthy');reconList.innerHTML=r.issues.map(x=>`<div class="item"><b>${E(x.type)}</b><div class="muted">${E(x.email)} · ${E(x.purchaseId)}</div><p>${E(x.detail)}</p><a href="admin-purchases.html?purchase=${encodeURIComponent(x.purchaseId)}">Відкрити покупку</a></div>`).join('')||'<div class="item healthy">Звірка чиста</div>';jobList.innerHTML=data.jobs.map(j=>`<div class="item"><div class="head"><b>${E(j.type)} · ${E(j.email||'система')}</b><span class="pill ${E(j.status)}">${E(j.status)}</span></div><div class="muted">${F(j.updatedAt)} · ${j.attempts}/${j.maxAttempts}</div>${j.error?`<p>${E(j.error)}</p>`:''}${j.status==='failed'&&j.retryable?`<button onclick="retryJob('${j.id}')">Повторити</button>`:''}</div>`).join('')||'<div class="item">Черга порожня</div>';deliveryList.innerHTML=data.deliveries.map(d=>`<div class="item"><div class="head"><b>${E(d.channel)} · ${E(d.subject)}</b><span class="pill ${E(d.status)}">${E(d.status)}</span></div><div class="muted">${E(d.recipient)} · ${F(d.updatedAt)} · спроб ${d.attempts}</div>${d.error?`<p>${E(d.error)}</p>`:''}${['failed','disabled'].includes(d.status)?`<button onclick="retryDelivery('${d.id}')">Повторити</button>`:''}</div>`).join('')||'<div class="item">Подій немає</div>';const ss=data.support.summary;supportSummary.innerHTML=M(ss.open,'Відкритих')+M(ss.unassigned,'Без виконавця')+M(ss.overdue,'Прострочених',ss.overdue?'critical':'healthy')+M(ss.averageFirstResponseMinutes??'—','Перша відповідь, хв');supportList.innerHTML=data.support.tickets.filter(t=>t.overdue||!t.assignedTo).map(t=>`<div class="item"><b>#${t.id} · ${E(t.subject)}</b><span class="pill ${t.overdue?'critical':'warning'}">${t.overdue?'SLA':'без виконавця'}</span><div class="muted">${E(t.email)} · SLA ${t.slaMinutes} хв</div><a href="admin-ticket.html?id=${t.id}">Відкрити</a></div>`).join('')||'<div class="item healthy">SLA дотримано</div>';const t=data.services.deepl;translationHealth.innerHTML='<div class="grid">'+M(t.enabled?'Увімкнено':'Вимкнено','DeepL',t.enabled?'healthy':'warning')+M(t.cacheSize,'Фраз у кеші')+M(t.rateLimits,'HTTP 429',t.rateLimits?'warning':'healthy')+M(t.failures,'Помилок',t.failures?'critical':'healthy')+'</div><div class="item">Остання помилка: '+E(t.lastError||'немає')+'</div>';flags.innerHTML=Object.entries(data.featureFlags).map(([k,v])=>`<label class="setting"><span>${E(k)}</span><input type="checkbox" data-flag="${E(k)}" ${v?'checked':''} onchange="saveFlags()"></label>`).join('');balance.value=data.provider.amount??'';averageCost.value=data.provider.averageOrderCost??'';frontVersion.value=data.versionInfo.frontend||'';backVersion.value=data.versionInfo.backend||'';swVersion.value=data.versionInfo.serviceWorker||'';report.textContent=data.latestReport?JSON.stringify(data.latestReport,null,2):'Ще не сформовано'}
async function call(path,method='POST',body={}){const r=await adminFetch(path,{method,body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function act(fn){try{await fn();await load()}catch(e){alert(e.message)}}function resolveItem(id){act(()=>call(`/api/admin/attention/${id}/resolve`))}function retryJob(id){act(()=>call(`/api/admin/jobs/${id}/retry`))}function retryDelivery(id){act(()=>call(`/api/admin/deliveries/${id}/retry`))}function retryProvision(e,p){act(()=>call(`/api/admin/users/${e}/purchases/${p}/retry-provision`))}function manualTranslation(){act(()=>call('/api/admin/localization-manual','POST',{source:sourceText.value,translated:translatedText.value}))}function saveFlags(){const b={};document.querySelectorAll('[data-flag]').forEach(x=>b[x.dataset.flag]=x.checked);act(()=>call('/api/admin/feature-flags','PATCH',b))}function saveBalance(){act(()=>call('/api/admin/provider-balance','PATCH',{amount:balance.value===''?null:+balance.value,averageOrderCost:averageCost.value===''?null:+averageCost.value,currency:'USD'}))}function saveVersions(){act(()=>call('/api/admin/version-info','PATCH',{frontend:frontVersion.value,backend:backVersion.value,serviceWorker:swVersion.value}))}function generateReport(){act(()=>call('/api/admin/daily-report/generate'))}load().catch(e=>loading.textContent=e.message);
</script></body></html>
