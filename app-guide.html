<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Інструкція — Signal eSIM</title>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030611"><script src="pwa.js"></script>
  <style>
    body.guide-page{background:radial-gradient(circle at 50% -8%,#102553 0,#070a17 34%,#02040b 76%)}.guide-wrap{width:min(100% - 24px,680px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 0 calc(110px + env(safe-area-inset-bottom))}.guide-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.guide-head img{width:45px;height:45px;border-radius:14px;box-shadow:0 0 28px #31aaff55}.guide-head b{font:700 19px 'Space Grotesk',sans-serif}.guide-head a{margin-left:auto;color:#9ba9c4;text-decoration:none;font-size:13px}.guide-hero{position:relative;overflow:hidden;padding:27px 23px;border:1px solid #5f9fff3d;border-radius:29px;background:radial-gradient(circle at 90% 0,#35dfff28,transparent 36%),linear-gradient(145deg,#101d3e,#121329 58%,#251441);box-shadow:0 24px 70px #0008}.guide-kicker{color:#65e8ff;font-size:9px;font-weight:900;letter-spacing:.15em}.guide-hero h1{margin:10px 0 8px;font:700 clamp(29px,8vw,43px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.045em}.guide-hero p{margin:0;color:#aab7d0;font-size:13px;line-height:1.55}.guide-ready{display:inline-flex;align-items:center;gap:8px;margin-top:17px;padding:8px 11px;border:1px solid #42e9bf42;border-radius:99px;background:#0c302aaa;color:#6eeee0;font-size:10px;font-weight:800}.guide-ready i{width:7px;height:7px;border-radius:50%;background:#48eabf;box-shadow:0 0 12px #48eabf}.guide-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.guide-nav a{min-width:0;padding:11px 7px;border:1px solid #647eb831;border-radius:14px;background:#0c1121;color:#b9c7df;text-decoration:none;text-align:center;font-size:9px;font-weight:800}.guide-section-title{margin:25px 3px 10px;color:#778db5;font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.guide-card{overflow:hidden;margin-top:9px;border:1px solid #5d77ad2d;border-radius:21px;background:linear-gradient(145deg,#0e1426,#090c17);box-shadow:inset 0 1px #ffffff08}.guide-card summary{display:grid;grid-template-columns:43px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:72px;padding:13px 15px;list-style:none;cursor:pointer}.guide-card summary::-webkit-details-marker{display:none}.guide-card[open]{border-color:#56cfff46;background:linear-gradient(145deg,#101d36,#0b0d1a)}.guide-number{width:43px;height:43px;display:grid;place-items:center;border:1px solid #55ddff3d;border-radius:14px;background:linear-gradient(145deg,#153b60,#2c2054);color:#75eaff;font:800 14px 'Space Grotesk'}.guide-summary b{display:block;font-size:13px}.guide-summary small{display:block;margin-top:4px;color:#7e8dab;font-size:9px;line-height:1.35}.guide-arrow{color:#6f82a7;transition:transform .2s}.guide-card[open] .guide-arrow{transform:rotate(180deg)}.guide-body{padding:0 17px 17px 70px;color:#a6b3cb;font-size:11px;line-height:1.62}.guide-body ol,.guide-body ul{margin:8px 0 0;padding-left:17px}.guide-body li+li{margin-top:6px}.guide-note{margin-top:11px;padding:11px;border:1px solid #44dfff31;border-radius:13px;background:#0a1b30;color:#8cdff0}.guide-warning{border-color:#ffbd5738;background:#271b0e;color:#efc985}.guide-support{display:flex;align-items:center;justify-content:center;min-height:49px;margin-top:18px;border:1px solid #61dfff46;border-radius:16px;background:linear-gradient(135deg,#143a65,#28205d);color:#fff;text-decoration:none;font-size:12px;font-weight:800;box-shadow:0 12px 34px #0005}
    @media(max-width:410px){.guide-wrap{width:min(100% - 18px,680px)}.guide-hero{padding:23px 19px}.guide-nav{gap:5px}.guide-nav a{font-size:8px}.guide-card summary{grid-template-columns:39px minmax(0,1fr) auto;padding-inline:12px}.guide-number{width:39px;height:39px}.guide-body{padding-left:63px;padding-right:13px}}
  </style>
</head>
<body class="has-bottomnav guide-page">
  <main class="guide-wrap">
    <header class="guide-head"><img src="signal-premium-logo.png" alt="Signal"><b id="brandTitle">Signal: інструкція</b><a href="dashboard.html" id="doneLink">Готово</a></header>
    <section class="guide-hero"><span class="guide-kicker" id="heroKicker">ВІД ПЕРШОГО ВХОДУ ДО ІНТЕРНЕТУ</span><h1 id="heroTitle">Усе просто.<br>По кроках.</h1><p id="heroCopy">Тут зібрано повну інструкцію: купівля пакета, встановлення eSIM, перевірка трафіку та допомога.</p><span class="guide-ready"><i></i><span id="readyText">Можна читати офлайн</span></span></section>
    <nav class="guide-nav" id="guideNav"></nav><div id="guideContent"></div><a class="guide-support" href="support.html" id="supportLink">Написати в підтримку</a>
  </main>
  <script src="config.js"></script>
  <script>
    const token=localStorage.getItem('signal_session_token');if(!token)location.href='login.html';
    const english=localStorage.getItem('signal_language')==='en',t=(uk,en)=>english?en:uk;
    document.documentElement.lang=english?'en':'uk';document.title=t('Інструкція — Signal eSIM','Guide — Signal eSIM');
    brandTitle.textContent=t('Signal: інструкція','Signal: guide');doneLink.textContent=t('Готово','Done');heroKicker.textContent=t('ВІД ПЕРШОГО ВХОДУ ДО ІНТЕРНЕТУ','FROM FIRST SIGN-IN TO INTERNET');heroTitle.innerHTML=t('Усе просто.<br>По кроках.','Everything is simple.<br>Step by step.');heroCopy.textContent=t('Тут зібрано повну інструкцію: купівля пакета, встановлення eSIM, перевірка трафіку та допомога.','This complete guide covers buying a plan, installing your eSIM, checking usage and getting help.');readyText.textContent=t('Можна читати офлайн','Available offline');supportLink.textContent=t('Написати в підтримку','Contact support');
    const sections=[
      {group:t('Початок','Getting started'),items:[
        [t('Обери пакет','Choose a plan'),t('Купівля та активація','Purchase and activation'),t('<ol><li>Відкрий вкладку «Тарифи» внизу.</li><li>Обери країну, регіон, обсяг і термін дії.</li><li>Оплати пакет на захищеній сторінці Stripe.</li><li>Після підтвердження Signal автоматично підготує eSIM.</li></ol><div class="guide-note">Не закривай екран одразу після оплати — видача eSIM може тривати кілька секунд.</div>','<ol><li>Open Plans in the bottom menu.</li><li>Choose a country, region, data amount and validity.</li><li>Pay securely with Stripe.</li><li>Signal prepares the eSIM after payment confirmation.</li></ol><div class="guide-note">Keep the screen open after payment. Provisioning can take a few seconds.</div>')],
        [t('Встанови eSIM','Install the eSIM'),t('QR-код потрібен лише один раз','The QR code is normally used once'),t('<ol><li>Відкрий «Профіль» → «Моя eSIM».</li><li>На iPhone: Налаштування → Стільникові дані → Додати eSIM.</li><li>На Android: Налаштування → Підключення/SIM → Додати eSIM.</li><li>Відскануй QR-код іншим пристроєм або скористайся ручним кодом.</li><li>Назви профіль Signal і вибери його для мобільних даних.</li></ol><div class="guide-warning guide-note">Не видаляй встановлену eSIM без потреби. QR-код може бути одноразовим.</div>','<ol><li>Open Profile → My eSIM.</li><li>On iPhone: Settings → Cellular → Add eSIM.</li><li>On Android: Settings → Connections/SIM → Add eSIM.</li><li>Scan the QR code or use the manual activation code.</li><li>Name the profile Signal and select it for mobile data.</li></ol><div class="guide-warning guide-note">Do not delete an installed eSIM unless necessary. The QR code may be single-use.</div>')],
        [t('Увімкни інтернет','Turn on data'),t('Дані та роумінг для Signal eSIM','Data and roaming for Signal eSIM'),t('<ol><li>У налаштуваннях SIM вибери Signal для мобільних даних.</li><li>Увімкни «Роумінг даних» саме для Signal eSIM.</li><li>Залиш основну SIM для дзвінків, якщо це потрібно.</li><li>Вимкни автоматичне перемикання мобільних даних, щоб телефон не використав дорогу домашню SIM.</li></ol>','<ol><li>Select Signal for mobile data in your SIM settings.</li><li>Enable Data Roaming for the Signal eSIM.</li><li>Keep your main SIM for calls if needed.</li><li>Disable automatic mobile-data switching to avoid charges on your home SIM.</li></ol>')]
      ]},
      {group:t('Під час користування','While using it'),items:[
        [t('Перевіряй трафік','Check usage'),t('Точні дані надходять від оператора','Exact data comes from the carrier'),t('<p>На головній картці видно залишок. У вкладці «Витрати» можна запросити свіже значення.</p><div class="guide-note">Оператор оновлює лічильник не миттєво — зазвичай раз на 2–3 години. Signal не вигадує проміжні цифри й показує час останнього підтвердження.</div>','<p>The home card shows your remaining data. Use the Usage tab to request the latest value.</p><div class="guide-note">The carrier counter is not real time and usually refreshes every 2–3 hours. Signal never invents interim values and shows the last confirmed time.</div>')],
        [t('Додай пакет','Add more data'),t('З новим QR або без нього','With or without a new QR'),t('<ul><li><b>Без нового QR:</b> сумісний пакет додається до вже встановленої eSIM.</li><li><b>З новим QR:</b> старий профіль замінюється, якщо пакет несумісний, вичерпаний або відкликаний.</li></ul><div class="guide-note">Не видаляй стару eSIM, доки застосунок прямо не покаже інструкцію для заміни.</div>','<ul><li><b>Without a new QR:</b> a compatible plan is added to the installed eSIM.</li><li><b>With a new QR:</b> the old profile is replaced when the plan is incompatible, exhausted or revoked.</li></ul><div class="guide-note">Do not delete the old eSIM until the app explicitly shows replacement instructions.</div>')],
        [t('Сповіщення','Notifications'),t('Тільки важливі події','Only important events'),t('<p>Дозволь системні сповіщення один раз. Signal повідомить про відповідь підтримки, стан eSIM та важливі зміни пакета.</p><div class="guide-note">Червоне число біля дзвіночка з’являється лише тоді, коли є непрочитані повідомлення.</div>','<p>Allow system notifications once. Signal will notify you about support replies, eSIM status and important plan changes.</p><div class="guide-note">The red number by the bell appears only when there are unread notifications.</div>')]
      ]},
      {group:t('Допомога та захист','Help and security'),items:[
        [t('Якщо немає мережі','If there is no connection'),t('Швидка перевірка','Quick checklist'),t('<ol><li>Увімкни й вимкни режим польоту.</li><li>Перевір вибір Signal eSIM для мобільних даних.</li><li>Переконайся, що роумінг даних увімкнений.</li><li>Перезапусти телефон і залиш вибір мережі автоматичним.</li><li>APN зазвичай налаштовується автоматично; змінюй його лише за інструкцією підтримки.</li></ol>','<ol><li>Toggle Airplane Mode.</li><li>Check that Signal eSIM is selected for mobile data.</li><li>Make sure Data Roaming is enabled.</li><li>Restart the phone and leave network selection automatic.</li><li>APN is usually automatic; change it only when support tells you to.</li></ol>')],
        [t('Захист акаунта','Protect your account'),t('PIN, графічний ключ і Face ID','PIN, pattern and Face ID'),t('<p>У «Профілі» відкрий «Акаунт і безпека». Можна використовувати PIN або графічний ключ і додати Face ID/Passkey.</p><div class="guide-warning guide-note">Після трьох неправильних спроб вхід блокується на 5 хвилин. Забутий PIN відновлюється кодом із email.</div>','<p>Open Account and security from Profile. You can use a PIN or pattern and add Face ID/Passkey.</p><div class="guide-warning guide-note">After three failed attempts, access is locked for 5 minutes. A forgotten PIN can be recovered with an email code.</div>')],
        [t('Звернись у підтримку','Contact support'),t('Що надіслати команді','What to send the team'),t('<p>Опиши модель телефона, країну, час появи проблеми та додай скриншот. Це допоможе швидше знайти причину.</p><div class="guide-warning guide-note">Ніколи не надсилай пароль, PIN, банківські дані, QR-код або повний код активації.</div>','<p>Include your phone model, country, when the issue started and a screenshot. This helps the team diagnose it faster.</p><div class="guide-warning guide-note">Never send your password, PIN, banking details, QR code or full activation code.</div>')]
      ]}
    ];
    guideNav.innerHTML=sections.map((section,index)=>`<a href="#guide-${index}">${section.group}</a>`).join('');let number=0;
    guideContent.innerHTML=sections.map((section,index)=>`<section id="guide-${index}"><h2 class="guide-section-title">${section.group}</h2>${section.items.map(item=>{number+=1;return `<details class="guide-card" ${number===1?'open':''}><summary><span class="guide-number">${number}</span><span class="guide-summary"><b>${item[0]}</b><small>${item[1]}</small></span><span class="guide-arrow">⌄</span></summary><div class="guide-body">${item[2]}</div></details>`}).join('')}</section>`).join('');
  </script>
</body>
</html>
