<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Моя економія — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="profile.html" aria-label="Назад">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Моя економія</b></header><div id="content"><div class="xp-skeleton" style="height:300px"></div></div></main><script src="config.js"></script><script src="experience.js"></script><script>
document.body.insertAdjacentHTML('beforeend',xpNav('profile'));const money=cents=>`$${(Number(cents||0)/100).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})}`;xpFetch('/api/account/savings').then(data=>{const max=Math.max(1,data.referenceCents,data.paidCents),signalHeight=Math.max(5,Math.round(data.paidCents/max*100)),referenceHeight=Math.max(5,Math.round(data.referenceCents/max*100));content.innerHTML=`<section class="xp-hero"><div class="xp-kicker">ОРІЄНТОВНА ВИГОДА</div><div class="xp-money">${data.comparable?money(data.estimatedSavingsCents):'—'} <small>заощаджено</small></div><p class="xp-lead">Розрахунок на основі твоїх оплачених пакетів Signal і прозорої контрольної ціни роумінгу.</p><div class="xp-saving-chart"><div class="xp-saving-bar"><i style="--h:${signalHeight}%"></i><span>ТВОЇ ВИТРАТИ<br><b>${money(data.paidCents)}</b></span></div><div class="xp-saving-bar"><i style="--h:${referenceHeight}%"></i><span>ОРІЄНТИР РОУМІНГУ<br><b>${money(data.referenceCents)}</b></span></div></div></section><section class="xp-panel" style="margin-top:16px"><div class="xp-row"><span class="xp-muted">Оплачених пакетів</span><b>${data.purchaseCount}</b></div><div class="xp-row"><span class="xp-muted">Придбано даних</span><b>${Number(data.dataGb).toLocaleString('uk-UA',{maximumFractionDigits:2})} GB</b></div><div class="xp-row"><span class="xp-muted">Середня ціна Signal за 1 GB</span><b>${data.averageCentsPerGb==null?'—':money(data.averageCentsPerGb)}</b></div><div class="xp-row"><span class="xp-muted">Днів у пакетах</span><b>${data.tripDays||'—'}</b></div></section><div class="xp-note" style="margin-top:14px">${xpEsc(data.method)}</div><a class="xp-btn" href="plans.html" style="margin-top:14px">Знайти наступний пакет</a>`}).catch(error=>content.innerHTML=`<div class="xp-note">${xpEsc(error.message)}</div>`);
</script></body></html>
