<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Створити акаунт — Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="signal-v5.css?v=101">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020713">
  <script src="pwa.js"></script>
</head>
<body class="signal-v5 register-v5">
  <main class="o-shell registration-shell">
    <div class="o-brand"><img src="signal-premium-logo.png" alt=""><span><strong>Signal</strong><small data-i18n-uk="eSIM для подорожей" data-i18n-en="eSIM for travel">eSIM для подорожей</small></span></div>
    <div class="o-stepper" aria-label="Крок 2 з 4"><span class="o-step done" data-step="1" data-i18n-uk="Мова" data-i18n-en="Language">Мова</span><span class="o-step active" data-step="2" data-i18n-uk="Акаунт" data-i18n-en="Account">Акаунт</span><span class="o-step" data-step="3" data-i18n-uk="Підтвердження" data-i18n-en="Verification">Підтвердження</span><span class="o-step" data-step="4" data-i18n-uk="Готово" data-i18n-en="Done">Готово</span></div>
    <h1 data-i18n-uk="Створити акаунт" data-i18n-en="Create account">Створити акаунт</h1>
    <p class="lead" data-i18n-uk="Декілька кроків — і ви готові досліджувати світ." data-i18n-en="Just a few steps and you are ready to explore the world.">Декілька кроків — і ви готові досліджувати світ.</p>
    <section class="registration-fields visible">
      <div class="field-group field-with-icon"><label class="field-label" data-i18n-uk="Ім’я" data-i18n-en="Name">Ім’я</label><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><input type="text" id="displayName" placeholder="Юлія" autocomplete="name" maxlength="60"></div>
      <div class="field-group field-with-icon"><label class="field-label" data-i18n-uk="Електронна пошта" data-i18n-en="Email">Електронна пошта</label><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input type="email" id="email" placeholder="yuliia@gmail.com" autocomplete="email"></div>
      <div class="field-group field-with-icon password-field"><label class="field-label" data-i18n-uk="Пароль" data-i18n-en="Password">Пароль</label><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" id="password" placeholder="••••••••" autocomplete="new-password"><button id="togglePassword" type="button" aria-label="Показати пароль">◉</button></div>
      <div class="password-rules"><b data-i18n-uk="Пароль має містити:" data-i18n-en="Password must contain:">Пароль має містити:</b><span data-rule="length">✓ <i data-i18n-uk="мінімум 8 символів" data-i18n-en="at least 8 characters">мінімум 8 символів</i></span><span data-rule="letters">✓ <i data-i18n-uk="велику та малу літери" data-i18n-en="upper and lowercase letters">велику та малу літери</i></span><span data-rule="number">✓ <i data-i18n-uk="цифру" data-i18n-en="a number">цифру</i></span><span data-rule="symbol">✓ <i data-i18n-uk="спеціальний символ" data-i18n-en="a special character">спеціальний символ</i></span></div>
      <div id="err" class="o-error" hidden></div>
      <button class="o-btn" id="continueBtn" type="button" data-i18n-uk="Продовжити　→" data-i18n-en="Continue　→">Продовжити　→</button>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    const language=['uk','en'].includes(localStorage.getItem('signal_language'))?localStorage.getItem('signal_language'):'uk';
    const rules={length:value=>value.length>=8,letters:value=>/[a-zа-яіїє]/.test(value)&&/[A-ZА-ЯІЇЄ]/.test(value),number:value=>/\d/.test(value),symbol:value=>/[^A-Za-zА-Яа-яІіЇїЄє0-9]/.test(value)};
    function updateRules(){const value=password.value;Object.entries(rules).forEach(([name,test])=>document.querySelector(`[data-rule="${name}"]`).classList.toggle('valid',test(value)))}
    password.addEventListener('input',updateRules);togglePassword.onclick=()=>{password.type=password.type==='password'?'text':'password'};
    async function requestCode(){
      const mail=email.value.trim(),name=displayName.value.trim(),secret=password.value;
      err.hidden=true;
      if(!name){err.textContent=window.signalT('Введіть ім’я','Enter your name');err.hidden=false;return}
      if(!mail||!mail.includes('@')){err.textContent=window.signalT('Введіть коректний email','Enter a valid email');err.hidden=false;return}
      if(!Object.values(rules).every(test=>test(secret))){err.textContent=window.signalT('Пароль не відповідає вимогам','Password does not meet the requirements');err.hidden=false;return}
      continueBtn.disabled=true;continueBtn.textContent=window.signalT('Надсилаємо код…','Sending code…');window.signalAuthLoading?.(true,window.signalT('Надсилаємо код','Sending your code'),window.signalT('Готуємо захищене підтвердження email','Preparing secure email verification'));
      try{const response=await fetch(`${API_URL}/api/auth/request-code`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:mail,language,displayName:name,password:secret})}),data=await response.json();if(!response.ok)throw Error(data.error||'Помилка сервера');password.value='';localStorage.setItem('signal_pending_email',mail);window.signalAuthSuccess?.(window.signalT('Код надіслано!','Code sent!'));setTimeout(()=>location.href='verify-code.html',550)}catch(error){window.signalAuthLoading?.(false);err.textContent=error.message;err.hidden=false;continueBtn.disabled=false;continueBtn.textContent=window.signalT('Продовжити　→','Continue　→')}
    }
    continueBtn.onclick=requestCode;password.addEventListener('keydown',event=>{if(event.key==='Enter')requestCode()});
  </script>
</body>
</html>
