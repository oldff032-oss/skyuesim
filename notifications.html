<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сповіщення — Signal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><script src="pwa.js"></script></head><body class="xp-page"><main class="xp-wrap"><header class="xp-head"><a class="xp-back" href="profile.html" aria-label="Назад">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Сповіщення</b><span class="xp-head-spacer"></span></header><section class="xp-hero"><div class="xp-kicker">ВАЖЛИВЕ В ОДНОМУ МІСЦІ</div><h1 class="xp-title">Нічого не пропусти</h1><p class="xp-lead">Поїздки, трафік, відповіді підтримки та повідомлення Signal.</p></section><div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px"><h2 style="font-size:18px">Останні</h2><button id="readAll" class="xp-btn secondary" style="width:auto;padding:10px 13px;font-size:10px">Прочитати всі</button></div><div id="list" class="xp-list"><div class="xp-skeleton"></div></div></main><script src="config.js"></script><script src="experience.js"></script><script>
document.body.insertAdjacentHTML('beforeend',xpNav('profile'));const glyph={announcement:'S',support:'?',usage:'GB',expiry:'⌛',trip:'✈',purchase:'$',family:'F'};const ago=value=>{const ms=Date.now()-new Date(value).getTime(),m=Math.floor(ms/60000);if(m<1)return'щойно';if(m<60)return`${m} хв тому`;const h=Math.floor(m/60);if(h<24)return`${h} год тому`;return xpDate(value)};let data;
function render(){readAll.disabled=!data.unread;list.innerHTML=data.items.length?data.items.map(item=>`<a class="xp-notification-card ${item.read?'':'unread'} ${xpEsc(item.priority)}" href="${xpEsc(item.url||'/dashboard.html')}" data-id="${xpEsc(item.id)}"><span class="xp-notification-icon">${xpEsc(glyph[item.type]||'S')}</span><span class="xp-notification-copy"><b>${xpEsc(item.title)}</b><p>${xpEsc(item.message)}</p><time>${xpEsc(ago(item.date))}</time></span></a>`).join(''):`<div class="xp-empty xp-panel"><i>✓</i><b>Усе спокійно</b><p class="xp-muted">Нових сповіщень поки немає.</p></div>`;document.querySelectorAll('[data-id]').forEach(link=>link.onclick=event=>{const item=data.items.find(x=>x.id===link.dataset.id);if(!item||item.read)return;event.preventDefault();xpFetch(`/api/account/notifications/${encodeURIComponent(item.id)}/read`,{method:'POST'}).finally(()=>location.href=link.href)})}
async function load(){data=await xpFetch('/api/account/notifications');render()}readAll.onclick=async()=>{readAll.disabled=true;await xpFetch('/api/account/notifications/read-all',{method:'POST'});data.items.forEach(item=>item.read=true);data.unread=0;render();xpToast('Усе прочитано')};load().catch(error=>list.innerHTML=`<div class="xp-note">${xpEsc(error.message)}</div>`);
</script></body></html>
