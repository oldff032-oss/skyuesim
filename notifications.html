<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Сповіщення — Signal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="experience.css">
  <script src="pwa.js"></script>
  <style>
    .xp-notification-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body class="xp-page has-bottomnav">
  <main class="xp-wrap">
    <header class="xp-head"><a class="xp-back" href="profile.html" aria-label="Назад">‹</a><img class="xp-logo" src="signal-premium-logo.png" alt="Signal"><b>Сповіщення</b><span class="xp-head-spacer"></span></header>
    <section class="xp-hero"><div class="xp-kicker">ВАЖЛИВЕ В ОДНОМУ МІСЦІ</div><h1 class="xp-title">Нічого не пропусти</h1><p class="xp-lead">Відповіді підтримки, зміни трафіку, стан eSIM та важливі повідомлення Signal.</p></section>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px"><h2 style="font-size:18px">Останні</h2><button id="readAll" class="xp-btn secondary" style="width:auto;padding:10px 13px;font-size:10px">Прочитати всі</button></div>
    <div id="list" class="xp-list"><div class="xp-skeleton"></div></div>
  </main>
  <script src="config.js"></script>
  <script src="experience.js"></script>
  <script>
    document.body.insertAdjacentHTML('beforeend',xpNav());
    const glyph={
      announcement:'<svg viewBox="0 0 24 24"><path d="M4 11v2l11 4V7L4 11Z"/><path d="m7 14 1 5h3l-1-4M18 9c1 .8 1.5 1.8 1.5 3S19 14.2 18 15"/></svg>',
      support:'<svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 12H3a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2v-6ZM20 12h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2v-6ZM19 18c-1 2-2.8 3-5.5 3"/></svg>',
      usage:'<svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V6M16 20v-8M22 20V3M2 20h21"/></svg>',
      expiry:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      trip:'<svg viewBox="0 0 24 24"><path d="m3 11 18-7-7 18-3-8-8-3Z"/><path d="m11 14 4-4"/></svg>',
      purchase:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>',
      family:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 21c.3-4 2.3-6 6-6s5.7 2 6 6M15 15c3.5 0 5.4 1.8 5.7 5"/></svg>'
    };
    const ago=value=>{const ms=Date.now()-new Date(value).getTime(),m=Math.floor(ms/60000);if(m<1)return'щойно';if(m<60)return`${m} хв тому`;const h=Math.floor(m/60);if(h<24)return`${h} год тому`;return xpDate(value)};
    let data={items:[],unread:0};
    function render(){readAll.disabled=!data.unread;list.innerHTML=data.items.length?data.items.map(item=>`<a class="xp-notification-card ${item.read?'':'unread'} ${xpEsc(item.priority)}" href="${xpEsc(item.url||'/dashboard.html')}" data-id="${xpEsc(item.id)}"><span class="xp-notification-icon">${glyph[item.type]||glyph.announcement}</span><span class="xp-notification-copy"><b>${xpEsc(item.title)}</b><p>${xpEsc(item.message)}</p><time>${xpEsc(ago(item.date))}</time></span></a>`).join(''):`<div class="xp-empty xp-panel"><i>✓</i><b>Усе спокійно</b><p class="xp-muted">Нових сповіщень поки немає.</p></div>`;document.querySelectorAll('[data-id]').forEach(link=>link.onclick=event=>{const item=data.items.find(x=>x.id===link.dataset.id);if(!item||item.read)return;event.preventDefault();xpFetch(`/api/account/notifications/${encodeURIComponent(item.id)}/read`,{method:'POST'}).finally(()=>location.href=link.href)})}
    async function load(){data=await xpFetch('/api/account/notifications');render()}
    readAll.onclick=async()=>{readAll.disabled=true;await xpFetch('/api/account/notifications/read-all',{method:'POST'});data.items.forEach(item=>item.read=true);data.unread=0;render();xpToast('Усе прочитано')};
    load().catch(error=>{list.innerHTML=`<div class="xp-note">${xpEsc(error.message||'Не вдалося завантажити сповіщення')}</div>`});
  </script>
</body>
</html>
