<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Відгуки — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.feedback-list{display:grid;gap:12px;margin-top:18px}.feedback-item{padding:17px}.feedback-head{display:flex;align-items:center;gap:12px}.feedback-avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--blue),var(--violet));background-size:cover;background-position:center;font-weight:800}.stars{color:#ffc94f;letter-spacing:2px;font-size:17px}.feedback-message{margin-top:13px;padding:13px;border-radius:12px;background:rgba(255,255,255,.035);line-height:1.55;white-space:pre-wrap}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}@media(min-width:700px){.summary-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><div class="mark" style="width:32px;height:32px;font-size:15px">⭐</div><span style="font-size:15px">Signal Admin</span></div><nav class="admin-nav"><a href="admin-dashboard.html">📊 Dashboard</a><a href="admin-tickets.html">🎫 Підтримка</a><a href="admin-users.html">👥 Користувачі</a><a href="admin-team.html" id="teamNavLink">🔑 Команда</a><a href="admin-audit.html" id="auditNavLink">🛡️ Журнал дій</a><a href="#" onclick="logout()">⏏ Вийти</a></nav></aside><main class="admin-main"><h1 style="font-size:22px">Відгуки користувачів</h1><p class="lead">Оцінки та пропозиції щодо покращення застосунку</p><div id="summary" class="summary-grid"></div><div class="filter-bar" style="margin-top:18px"><select id="rating"><option value="">Усі оцінки</option><option value="5">5 — чудово</option><option value="4">4 — добре</option><option value="3">3 — нормально</option><option value="2">2 — погано</option><option value="1">1 — дуже погано</option></select></div><div id="loading" class="shimmer" style="height:170px;margin-top:18px"></div><div id="list" class="feedback-list"></div></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));async function load(){const rating=document.getElementById('rating').value,response=await adminFetch(`/api/admin/feedback${rating?`?rating=${rating}`:''}`),data=await response.json();document.getElementById('loading').style.display='none';if(!response.ok){document.getElementById('list').innerHTML='<div class="card">Не вдалося завантажити відгуки</div>';return}document.getElementById('summary').innerHTML=`<div class="card"><div class="muted">Усього</div><b style="font-size:24px">${data.summary.total}</b></div><div class="card"><div class="muted">Середня оцінка</div><b style="font-size:24px">${data.summary.average||'—'}</b></div><div class="card"><div class="muted">Позитивні 4–5</div><b style="font-size:24px">${(data.summary.distribution[4]||0)+(data.summary.distribution[5]||0)}</b></div><div class="card"><div class="muted">Потребують уваги 1–2</div><b style="font-size:24px">${(data.summary.distribution[1]||0)+(data.summary.distribution[2]||0)}</b></div>`;document.getElementById('list').innerHTML=data.items.map(item=>`<article class="card feedback-item"><div class="feedback-head"><div class="feedback-avatar" style="${item.avatarDataUrl?`background-image:url('${item.avatarDataUrl}')`:''}">${item.avatarDataUrl?'':esc((item.displayName||item.email)[0].toUpperCase())}</div><div style="min-width:0;flex:1"><b>${esc(item.displayName||item.email)}</b><div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis">${esc(item.email)} · ${new Date(item.createdAt).toLocaleString('uk-UA')}</div></div><div class="stars">${'★'.repeat(item.rating)}${'☆'.repeat(5-item.rating)}</div></div><div class="feedback-message">${esc(item.message||'Без текстового коментаря')}</div></article>`).join('')||'<div class="card muted">Відгуків із таким фільтром немає.</div>'}document.getElementById('rating').onchange=load;load();
</script></body></html>
