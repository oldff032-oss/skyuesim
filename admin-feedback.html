<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Відгуки — Signal Admin</title><link rel="stylesheet" href="style.css"><style>.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.feedback{padding:17px;margin:12px 0}.head{display:flex;gap:12px;align-items:center}.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--violet));background-size:cover}.stars{color:#ffc94f;margin-left:auto}.message{padding:13px;background:rgba(255,255,255,.035);border-radius:12px;margin:12px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:rgba(90,120,255,.14)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions select,.actions button{padding:8px;border-radius:9px}</style></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><img src="signal-premium-logo.png" style="width:34px;border-radius:10px"><span>Signal Admin</span></div><nav class="admin-nav"></nav></aside><main class="admin-main"><h1>Відгуки користувачів</h1><p class="lead">Оцінки, теми, відповідальні та задачі на покращення.</p><div id="summary" class="summary"></div><div class="filter-bar"><select id="rating"><option value="">Усі оцінки</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input id="search" placeholder="Пошук користувача або тексту"></div><div id="loading" class="shimmer" style="height:170px"></div><div id="list"></div></main></div><script src="config.js"></script><script src="admin-common.js"></script><script>
requireAdminAuth();const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[];async function load(){const r=await adminFetch(`/api/admin/feedback${rating.value?`?rating=${rating.value}`:''}`),d=await r.json();loading.style.display='none';if(!r.ok){list.textContent=d.error;return}items=d.items;summary.innerHTML=`<div class="card"><small>Усього</small><h2>${d.summary.total}</h2></div><div class="card"><small>Середня оцінка</small><h2>${d.summary.average||'—'}</h2></div><div class="card"><small>Нових</small><h2>${d.summary.byStatus.new||0}</h2></div><div class="card"><small>Заплановано</small><h2>${d.summary.byStatus.planned||0}</h2></div>`;render()}function render(){const q=search.value.trim().toLowerCase();list.innerHTML=items.filter(x=>!q||`${x.email} ${x.displayName} ${x.message}`.toLowerCase().includes(q)).map(x=>`<article class="card feedback"><div class="head"><div class="avatar" style="${x.avatarDataUrl?`background-image:url('${x.avatarDataUrl}')`:''}">${x.avatarDataUrl?'':E((x.displayName||x.email)[0].toUpperCase())}</div><div><b>${E(x.displayName||x.email)}</b><div class="muted">${E(x.email)} · ${new Date(x.createdAt).toLocaleString('uk-UA')}</div></div><div class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div></div><div class="message">${E(x.message||'Без текстового коментаря')}</div><div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${E(t)}</span>`).join('')}</div><div class="actions"><select onchange="updateFeedback('${x.id}',{status:this.value})">${['new','reviewed','planned','done'].map(s=>`<option ${s===(x.status||'new')?'selected':''}>${s}</option>`).join('')}</select><input value="${E(x.assignedTo||'')}" placeholder="Email відповідального" onchange="updateFeedback('${x.id}',{assignedTo:this.value})"><button onclick="updateFeedback('${x.id}',{createTask:true})">Створити задачу</button><a class="btn ghost" href="admin-user-timeline.html?email=${encodeURIComponent(x.email)}">Користувач</a></div></article>`).join('')||'<div class="card muted">Відгуків немає.</div>'}async function updateFeedback(id,body){const r=await adminFetch(`/api/admin/feedback/${id}`,{method:'PATCH',body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.error);load()}rating.onchange=load;search.oninput=render;load();
// Distribution is returned as summary.distribution and is available for rating analytics.
</script></body></html>
