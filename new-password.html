<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новий пароль — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигнал">
<script src="pwa.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="mark">📶</div><span>Сигнал</span></div>
    <h1 style="margin-top:20px;">Новий пароль</h1>
    <p class="lead">Придумай новий надійний пароль</p>

    <div class="field-group">
      <label class="field-label">Новий пароль</label>
      <div class="input-icon-wrap">
        <input type="password" id="password" placeholder="Мінімум 8 символів" autocomplete="new-password" />
        <button class="icon-btn" onclick="togglePw()" type="button">👁️</button>
      </div>
      <div class="strength-track">
        <div class="strength-seg" id="seg1"></div>
        <div class="strength-seg" id="seg2"></div>
        <div class="strength-seg" id="seg3"></div>
        <div class="strength-seg" id="seg4"></div>
      </div>
      <div class="strength-label" id="strengthLabel">Мінімум 8 символів</div>
      <div class="err-text" id="err" style="display:none;"></div>
    </div>

    <button class="btn" id="btn" style="margin-top:24px;" onclick="submit()">Зберегти новий пароль</button>
  </div>

  <script src="config.js"></script>
  <script>
    const resetToken = localStorage.getItem('signal_reset_token');
    if(!resetToken){ window.location.href = 'forgot-password.html'; }

    function togglePw(){
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function scorePassword(pw){
      let score = 0;
      if(pw.length >= 8) score++;
      if(pw.length >= 12) score++;
      if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if(/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
      return score;
    }
    const colors = ['var(--danger)', 'var(--danger)', '#f5a623', 'var(--cyan)', 'var(--success)'];
    const labels = ['Мінімум 8 символів', 'Слабкий', 'Так собі', 'Добрий', 'Дуже надійний'];

    document.getElementById('password').addEventListener('input', (e) => {
      const score = scorePassword(e.target.value);
      const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3'), document.getElementById('seg4')];
      segs.forEach((s, i) => { s.style.background = i < score ? colors[score] : 'var(--border)'; });
      document.getElementById('strengthLabel').textContent = e.target.value ? labels[score] : 'Мінімум 8 символів';
    });

    async function submit(){
      const pwInput = document.getElementById('password');
      const password = pwInput.value;
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      err.style.display = 'none';
      pwInput.classList.remove('error');

      if(password.length < 8){
        err.textContent = 'Пароль має бути не менше 8 символів';
        err.style.display = 'flex';
        pwInput.classList.add('error');
        return;
      }

      btn.classList.add('loading');
      btn.textContent = 'Зберігаємо...';

      try{
        const res = await fetch(`${API_URL}/api/auth/reset-password`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ resetToken, password })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Помилка сервера');

        localStorage.removeItem('signal_reset_token');
        localStorage.removeItem('signal_reset_email');
        window.location.href = 'login.html?reset=success';
      }catch(e){
        err.textContent = e.message;
        err.style.display = 'flex';
        btn.classList.remove('loading');
        btn.textContent = 'Зберегти новий пароль';
      }
    }
  </script>
</body>
</html>
