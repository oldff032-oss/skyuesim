<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Центр безпеки — Сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="pwa.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="has-bottomnav">
  <div class="wrap">
    <div class="brand"><div class="mark">🛡️</div><span>Сигнал</span></div>
    <h1 style="margin-top:20px;">Центр <em>безпеки</em></h1>
    <p class="lead">Перевіряй, де твій акаунт зараз відкритий.</p>

    <div class="glass glass-card" style="margin-top:22px;">
      <p style="font-family:'Space Grotesk',sans-serif;font-weight:700;">Твої входи</p>
      <p class="muted" style="margin-top:6px;">Поточний пристрій позначено окремо. Незнайомий вхід — привід одразу завершити інші сесії.</p>
      <div id="sessions" style="margin-top:14px;"><div class="shimmer" style="height:72px;"></div></div>
    </div>

    <button id="revokeBtn" class="btn danger" style="margin-top:16px;" onclick="revokeOthers()">Вийти з інших пристроїв</button>
    <button id="faceIdBtn" class="btn" style="margin-top:12px;">Увімкнути Face ID</button>
    <p id="message" class="muted" style="text-align:center;margin-top:12px;"></p>

    <a class="btn ghost" href="forgot-password.html" style="margin-top:18px;">Змінити пароль</a>
  </div>

  <nav class="bottomnav" aria-label="Головна навігація"><a href="dashboard.html" aria-label="Головна" title="Головна" data-nav="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="home-roof" d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><rect class="home-window" x="9.7" y="13" width="4.6" height="7" rx="1" fill="currentColor" stroke="none"/><circle class="home-spark" cx="19" cy="5" r="1.25" fill="currentColor" stroke="none"/></svg></span></a><a href="plans.html" aria-label="Тарифи" title="Тарифи" data-nav="plans"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect class="plan-back" x="5.5" y="3" width="15" height="14" rx="2.5"/><rect class="plan-front" x="3" y="6.5" width="16" height="14" rx="2.5"/><path class="plan-scan" d="M3.8 11h14.4"/><path d="M7 16h5"/></svg></span></a><a href="usage.html" aria-label="Витрати" title="Витрати" data-nav="usage"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="usage-bar bar-one" d="M5 19V13"/><path class="usage-bar bar-two" d="M12 19V7"/><path class="usage-bar bar-three" d="M19 19V10"/><path d="M3 21h18"/><circle class="usage-pulse" cx="19" cy="7.5" r="1.45" fill="currentColor" stroke="none"/></svg></span></a><a href="profile.html" class="active" aria-label="Профіль" title="Профіль" data-nav="profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle class="profile-head" cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/><path class="profile-orbit" d="M5.5 8c1.8-5.6 11.2-7.2 15-1.6" stroke-dasharray="2 3"/><circle class="profile-star" cx="20.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg></span></a></nav>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem('signal_session_token');
    if (!token) window.location.href = 'login.html';
    const headers = { 'x-session-token': token };
    const date = (value) => new Date(value).toLocaleString('uk-UA', { dateStyle:'medium', timeStyle:'short' });

    async function loadSessions(){
      const res = await fetch(`${API_URL}/api/account/sessions`, { headers });
      const data = await res.json();
      if(!res.ok){ window.location.href = 'login.html'; return; }
      document.getElementById('sessions').innerHTML = data.sessions.map(session => `
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--glass-border);">
          <span style="font-size:19px;">${session.current ? '📱' : '🖥️'}</span>
          <div style="min-width:0;flex:1;"><div style="font-size:13px;font-weight:600;">${escapeHtml(session.deviceName)} ${session.current ? '<span style="color:var(--success);font-size:11px;">• цей пристрій</span>' : ''}</div><div class="muted" style="margin-top:3px;font-size:11px;">Вхід: ${date(session.createdAt)}</div></div>
        </div>`).join('');
    }
    function escapeHtml(value){ return String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    async function revokeOthers(){
      const button = document.getElementById('revokeBtn');
      button.disabled = true; button.textContent = 'Завершуємо входи…';
      try{
        const res = await fetch(`${API_URL}/api/account/sessions/revoke-others`, { method:'POST', headers });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Не вдалося завершити сесії');
        document.getElementById('message').textContent = data.revoked ? `Завершено входів: ${data.revoked}.` : 'Інших активних входів немає.';
        await loadSessions();
      }catch(error){ document.getElementById('message').textContent = error.message; }
      finally { button.disabled = false; button.textContent = 'Вийти з інших пристроїв'; }
    }
    loadSessions();
  </script>
  <script type="module">
    const button=document.getElementById('faceIdBtn');
    import('https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13.3.0/+esm').then(({startRegistration})=>{
      button.onclick=async()=>{const token=localStorage.getItem('signal_session_token');try{button.disabled=true;button.textContent='Підтвердь Face ID…';let r=await fetch(`${API_URL}/api/account/passkeys/register/options`,{method:'POST',headers:{'x-session-token':token}});let options=await r.json();if(!r.ok)throw new Error(options.error);const response=await startRegistration({optionsJSON:options});r=await fetch(`${API_URL}/api/account/passkeys/register/verify`,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify(response)});const data=await r.json();if(!r.ok)throw new Error(data.error);button.textContent='Face ID увімкнено';alert('Face ID успішно увімкнено');}catch(e){alert(`Face ID не увімкнено: ${e.message}`)}finally{button.disabled=false}};
    }).catch(()=>{button.onclick=()=>alert('Не вдалося завантажити модуль Face ID. Перевір інтернет і онови сторінку.');});
  </script>
</body>
</html>
